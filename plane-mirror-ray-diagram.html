<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plane Mirror Ray Diagram</title>
<style>
  :root{
    --bg:#eef2f6; --card:#ffffff; --ink:#1f2933; --muted:#5f6b7a; --line:#d9dee5;
    --accent:#1971c2; --accent-soft:#e7f1fb; --ok:#2b8a3e; --bad:#c92a2a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang HK","Microsoft JhengHei","Noto Sans HK",sans-serif;font-size:15px;line-height:1.4}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;color:var(--ink)}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.on:hover{color:#fff}
  button.primary{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700;font-size:16px;padding:10px 12px}
  button.primary:hover:not(:disabled){color:#fff;filter:brightness(1.08)}
  button.link{border:0;background:none;color:var(--accent);padding:4px 6px;font-size:14px}
  button.link:hover{text-decoration:underline}

  .topbar{max-width:1240px;margin:0 auto;padding:14px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .topbar h1{margin:0;font-size:21px;color:#c2410c}
  .mode{display:inline-flex;background:#dde3ea;border-radius:11px;padding:3px}
  .mode button{border:0;background:transparent;padding:8px 22px;border-radius:9px;font-weight:700;color:var(--muted)}
  .mode button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .topright{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .lang button{padding:8px 16px}

  .wrap{max-width:1240px;margin:0 auto;padding:8px 16px 24px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
  @media (max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .side{display:flex;flex-direction:column;gap:12px}
  .side > div{display:flex;flex-direction:column;gap:12px}
  .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}

  .task{display:flex;align-items:center;gap:10px;background:#fff8e1;border:1px solid #ffe08a;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:16.5px;font-weight:600;min-height:48px}
  .badge{flex:none;min-width:32px;height:32px;padding:0 9px;border-radius:16px;background:#f59f00;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  svg#board{width:100%;height:auto;display:block;border:1px solid #cfc8b0;border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none}
  .handle{fill:rgba(25,113,194,0);cursor:grab}
  .handle:hover{fill:rgba(25,113,194,.16)}
  .warn{color:var(--bad);font-weight:600;margin-top:8px}
  .warn:empty{display:none}
  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:13px;color:var(--muted);align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px}

  .exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .exgrid button{padding:8px 4px;font-size:14px}
  .steps{display:flex;gap:6px}
  .steps button{flex:1;padding:6px 0;font-weight:700}
  .steps button.done{color:var(--ok);border-color:#b2f2bb}
  .steptext{font-size:15.5px;margin:12px 0;min-height:44px}
  .tip{font-size:13.5px;color:var(--muted);margin-top:4px}
  .nav{display:flex;gap:8px;margin-top:8px}
  .nav button{flex:1}
  .center{text-align:center}

  .res-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
  .res-row:last-child{border-bottom:0}
  .chip{width:12px;height:12px;border-radius:3px;margin-top:4px;flex:none}
  .yes{color:var(--ok);font-weight:700}
  .no{color:var(--bad);font-weight:700}
  .muted{color:var(--muted)}

  details.card > summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none}
  details.card > summary::-webkit-details-marker{display:none}
  details.card > summary::before{content:"▸ ";}
  details.card[open] > summary::before{content:"▾ ";}
  details.card[open] > summary{margin-bottom:10px}
  .opt{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}
  .opt input{width:17px;height:17px}
  .seg{display:inline-flex}
  .seg button{border-radius:0;font-size:14px}
  .seg button:first-child{border-radius:8px 0 0 8px}
  .seg button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
  select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:#fff}
  ol.conv{margin:0;padding-left:20px;font-size:14px}
  ol.conv li{margin:3px 0}

  .tasklist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tchip{min-width:32px;height:32px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--line);color:#adb5bd;font-size:15px}
  .tchip.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .tchip.first{background:#d3f9d8;border-color:#2b8a3e;color:#2b8a3e}
  .tchip.retry{background:#fff3bf;border-color:#e67700;color:#e67700}
  .tchip.shown{background:#ffe3e3;border-color:#c92a2a;color:#c92a2a}
  .tchip.skip{background:#f1f3f5;color:#ced4da}
  .tools{display:flex;gap:8px}
  .tools button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 6px;font-weight:600}
  .tools button.on svg line,.tools button.on svg polygon{stroke:#fff;fill:#fff}
  .answers{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .answers button{padding:11px;font-weight:700;font-size:15.5px}
  .mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;justify-content:center}
  .mini button{border:0;background:#f1f3f5;font-size:13.5px;padding:6px 10px}
  .fb{margin-top:12px;padding:9px 11px;border-radius:8px;font-size:15px;font-weight:600}
  .fb.bad{background:#fff0f0;color:#a61e1e}
  .fb.good{background:#ebfbee;color:#1f6f31}
  .fb.info{background:#f1f3f5;color:#495057;font-weight:500}
  .foot{display:flex;justify-content:space-between}
  .big{font-size:34px;font-weight:800;text-align:center;color:var(--ok);margin-top:4px}
  sub{font-size:.7em}
</style>
</head>
<body>
<a id="homeLink" href="./" style="display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 max(16px,env(safe-area-inset-left,0px));min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid rgba(127,140,150,.35);font:500 13px/1.2 system-ui,-apple-system,sans-serif;color:inherit;text-decoration:none;opacity:.85">&#8592; All simulations</a>
<header class="topbar">
  <h1 data-t="h1">Plane Mirror: Can the Observer See the Image?</h1>
  <div class="topright">
    <div class="mode lang" role="group" aria-label="Language / 語言">
      <button id="lang-en" type="button">EN</button><button id="lang-zh" type="button">中文</button>
    </div>
    <div class="mode">
      <button id="tabExplore" class="on" data-t="explore">Explore</button>
      <button id="tabChallenge" data-t="challenge">Challenge</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="task"><span class="badge" id="taskBadge"></span><span id="prompt"></span></div>
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="warn" class="warn"></div>
    <div class="legend">
      <span><svg width="40" height="12"><line x1="2" y1="6" x2="38" y2="6" stroke="#f08c00" stroke-width="2.2"/><polygon points="25,6 16,2 16,10" fill="#f08c00"/></svg><span data-t="lgReal">real ray</span></span>
      <span><svg width="40" height="12"><line x1="2" y1="6" x2="38" y2="6" stroke="#f08c00" stroke-width="2" stroke-dasharray="5 4"/></svg><span data-t="lgVirt">virtual ray</span></span>
      <span><svg width="40" height="12"><line x1="2" y1="6" x2="32" y2="6" stroke="#222" stroke-width="2" stroke-dasharray="5 4"/><polygon points="38,6 29,2 29,10" fill="#222"/></svg><span data-t="lgImg">image</span></span>
      <span><svg width="40" height="12"><line x1="2" y1="6" x2="38" y2="6" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="5 4"/></svg><span data-t="lgMiss">misses mirror</span></span>
    </div>
  </section>

  <aside class="side">
    <div id="explorePanel">
      <div class="card">
        <div class="lbl" data-t="lblExample">Example</div>
        <div class="exgrid" id="exRow"></div>
      </div>

      <div class="card">
        <div class="lbl" data-t="lblSteps">Steps</div>
        <div id="stepBtns" class="steps"></div>
        <div id="stepText" class="steptext"></div>
        <div class="nav">
          <button id="prev" data-t="back">◀ Back</button>
          <button id="next" class="primary" data-t="next">Next ▶</button>
        </div>
        <div class="center"><button id="all" class="link" data-t="showAll">Show all steps</button></div>
      </div>

      <div class="card" id="resultCard">
        <div class="lbl" data-t="lblResult">Result</div>
        <div id="results"></div>
      </div>

      <details class="card">
        <summary data-t="moreSettings">More settings</summary>
        <div class="opt"><div class="seg" id="typeSeg">
          <button data-type="arrow" data-t="arrowObj">Arrow object</button>
          <button data-type="point" data-t="pointObj">Point object</button>
        </div></div>
        <div class="opt"><span data-t="observers">Observers:</span>
          <button id="remObs">−</button><button id="addObs">+</button>
        </div>
        <label class="opt"><input type="checkbox" id="optCons" checked> <span data-t="optCons">Construction lines</span></label>
        <label class="opt"><input type="checkbox" id="optVis" checked> <span data-t="optVis">Highlight the part of image seen</span></label>
        <label class="opt"><input type="checkbox" id="optRegion"> <span data-t="optRegion">Shade the viewing region</span></label>
        <label class="opt"><input type="checkbox" id="optNormals"> <span data-t="optNormals">Normals and angles</span></label>
        <label class="opt"><span data-t="snapLbl">Snap to grid</span>
          <select id="snap">
            <option value="1" data-t="snap1">1 square</option>
            <option value="0.5" selected data-t="snapHalf">½ square</option>
            <option value="0.25" data-t="snapQuarter">¼ square</option>
            <option value="0" data-t="snapOff">off</option>
          </select>
        </label>
      </details>

      <details class="card">
        <summary data-t="drawingRules">Drawing rules</summary>
        <ol class="conv" data-h="rulesList"></ol>
      </details>
    </div>

    <div id="challengeBox"></div>
  </aside>
</main>

      startExactly:I=>`線要剛好由 ${I} 開始。`,

      solidReal:()=>'要用<b>實線</b>光線——這是真實的光。',
      arrowOM:O=>`箭頭方向錯誤：應該是 ${O} → 鏡。`,
      samePoint:()=>'光線要射到鏡上與虛線<b>相同的一點</b>。',

      hereAnswer:()=>'這是答案。',
      skipNote:(I,O)=>`看不到 ${I}，所以不需要畫由 ${O} 射出的光線。`
    },
    doneBadge:'🎉', donePrompt:'做得好！挑戰完成。', firstTime:'首次答對',
    newCh:'新挑戰 ▶', tryAgain:'↻ 再試這一題', stepOf:(a,b)=>`第 ${a} / ${b} 步`,
    pen:'筆', dotted:'虛線', solid:'實線', penTip:'鏡後：虛線 · 鏡前：實線',
    canBtn:I=>`✔ 看到 ${I}`, cannotBtn:I=>`✘ 看不到 ${I}`, checkBtn:'檢查 ✔',
    fWhole:'整個像', fPart:'部分像', fNone:'完全看不到像',
    hints:{img:'沿着藍色的垂直 (⊥) 線。', iray:'沿着藍色線到眼睛。', oray:'對準藍色圓圈。'},
    finish:'完成 ✓', nextBtn:'下一步 ▶', undo:'↶ 復原', clear:'清除', hint:'💡 提示', showAns:'顯示答案', restart:'↻ 重新開始'
  }};
  // language choice is remembered on this device and shared by all simulations on this site
  let lang='en';
  try{ const s=localStorage.getItem('sim-lang'); if(s==='zh'||s==='en') lang=s; }catch(e){}
  const tx = ()=>TXT[lang];
  // a message "thunk": stored as a function so it can be re-shown in the other language
  const M = (k,...a)=>()=>tx().m[k](...a);
  const say = m => typeof m==='function' ? m() : (m||'');
  const dispName = n => n==='observer' ? tx().obsWord : n==='eye' ? tx().eyeWord : n;


  // ---------- vector helpers ----------
  const P = (x,y)=>({x,y});
  const sub = (a,b)=>P(a.x-b.x,a.y-b.y);
  const add = (a,b)=>P(a.x+b.x,a.y+b.y);
  const mul = (a,k)=>P(a.x*k,a.y*k);
  const dot = (a,b)=>a.x*b.x+a.y*b.y;
  const cross = (a,b)=>a.x*b.y-a.y*b.x;
  const len = a=>Math.hypot(a.x,a.y);
  const unit = a=>{const l=len(a)||1;return P(a.x/l,a.y/l);};
  const lerp = (a,b,t)=>P(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
  const side = (p,a,b)=>cross(sub(b,a),sub(p,a));
  const near = (a,b,t=0.3)=>len(sub(a,b))<=t;
  function footT(p,a,b){const d=sub(b,a);return dot(sub(p,a),d)/dot(d,d);}
  function foot(p,a,b){return lerp(a,b,footT(p,a,b));}
  function reflect(p,a,b){const f=foot(p,a,b);return sub(mul(f,2),p);}
  function lineParams(p,q,a,b){
    const r=sub(q,p), s=sub(b,a), den=cross(r,s);
    if(Math.abs(den)<1e-12) return null;
    const ap=sub(a,p);
    return { t:cross(ap,s)/den, u:cross(ap,r)/den };
  }
  function segX(p,q,a,b){
    const k=lineParams(p,q,a,b); const e=1e-9;
    if(!k||k.t<-e||k.t>1+e||k.u<-e||k.u>1+e) return null;
    return { ...k, pt:lerp(p,q,k.t) };
  }

  // ---------- state ----------
  const ARROW_L = { h:'O_1', t:'O_2', hi:'I_1', ti:'I_2' };
  const POINT_L = { h:'O', hi:'I' };
  const st = {
    type:'arrow', O1:P(5,2), O2:P(3,2), M1:P(6,2), M2:P(6,4),
    obs:[{x:3,y:5,name:'observer'}], labels:{...ARROW_L},
    step:0, mode:'explore', snap:0.5, prompt:'', preset:'ex1',
    opt:{ cons:true, vis:true, region:false, normals:false },
    ch:null
  };

  const PRESETS = {
    ex1:{ n:1, type:'arrow', O1:[5,2], O2:[3,2], M1:[6,2], M2:[6,4], obs:[[3,5,'observer']],
      prompt:'Can the observer see the whole image?' },
    ex2:{ n:2, type:'arrow', O1:[5,2], O2:[3,2], M1:[6,2], M2:[6,4], obs:[[5,5,'observer']],
      prompt:'Why can’t the observer see I₂? Drag the observer to fix it.' },
    ex3:{ n:3, type:'point', O1:[7,3], M1:[5,2], M2:[5,4], obs:[[7,2,'A'],[7,4,'B'],[7,5.5,'C']],
      prompt:'Can A, B and C see the image? Drag C until it can.' },
    ex4:{ n:4, type:'point', O1:[7,5], M1:[3,4], M2:[6,4], obs:[[4,5,'Leon']], labels:{h:'P',hi:"P'"},
      prompt:'Can Leon see Patrick (P) in the mirror?' },
    ex5:{ n:5, type:'arrow', O1:[7,6], O2:[5,6], M1:[6.5,4.5], M2:[8.5,6.5], obs:[[5,5,'P']], labels:{h:'Y',t:'X',hi:"Y'",ti:"X'"},
      prompt:'Can P see the images of X and Y?' },
    ex6:{ n:6, type:'arrow', O1:[9,1.5], O2:[9,8], M1:[5,2.5], M2:[5,5.5], obs:[[9,2,'eye']], labels:{h:'H',t:'F',hi:"H'",ti:"F'"},
      prompt:'Shortest mirror to see your whole body? Drag the mirror ends.' }
  };

  function loadPreset(key){
    const p = PRESETS[key];
    st.type = p.type;
    st.O1 = P(...p.O1);
    st.O2 = p.O2 ? P(...p.O2) : P(p.O1[0]-2, p.O1[1]);
    st.M1 = P(...p.M1); st.M2 = P(...p.M2);
    st.obs = p.obs.map(o=>({x:o[0],y:o[1],name:o[2]}));
    st.labels = {...(p.type==='arrow'?ARROW_L:POINT_L), ...(p.labels||{})};
    st.prompt = key; st.preset = key;
    st.step = 0;
    render();
  }

  const maxStep = ()=> st.type==='arrow' ? 4 : 3;

  function validity(){
    const {M1,M2}=st;
    if(len(sub(M2,M1))<0.2) return {ok:false,msg:tx().tooShortMirror};
    const s1 = side(st.O1,M1,M2);
    if(Math.abs(s1)<1e-6) return {ok:false,msg:tx().onLine};
    if(st.type==='arrow'){
      const s2 = side(st.O2,M1,M2);
      if(Math.abs(s2)<1e-6 || Math.sign(s2)!==Math.sign(s1))
        return {ok:false,msg:tx().sameSide};
    }
    return {ok:true,msg:''};
  }

  function frontNormal(){
    const d = unit(sub(st.M2,st.M1));
    let n = P(-d.y,d.x);
    if(dot(n, sub(st.O1,st.M1)) < 0) n = mul(n,-1);
    return n;
  }

  function imagePoints(){
    const {M1,M2}=st, L=st.labels;
    if(st.type==='point')
      return [{O:st.O1, I:reflect(st.O1,M1,M2), ol:L.h, il:L.hi, color:COL.o1, v:2, r:3}];
    return [
      {O:st.O1, I:reflect(st.O1,M1,M2), ol:L.h, il:L.hi, color:COL.o1, v:2, r:3},
      {O:st.O2, I:reflect(st.O2,M1,M2), ol:L.t, il:L.ti, color:COL.o2, v:4, r:4}
    ];
  }

  function visibleRuns(E, ips){
    const A = ips[1].I, B = ips[0].I, N = 160, runs = [];
    let cur = null, cnt = 0;
    for(let i=0;i<=N;i++){
      const s=i/N, J=lerp(A,B,s), ok=!!segX(J,E,st.M1,st.M2);
      if(ok){ cnt++; if(!cur) cur={a:s,b:s}; else cur.b=s; }
      else if(cur){ runs.push(cur); cur=null; }
    }
    if(cur) runs.push(cur);
    return { runs, frac:cnt/(N+1), A, B };
  }

  // ---------- svg string helpers ----------
  const fx = v => (v*U).toFixed(1);
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function line(a,b,{c=COL.ink,w=2,dash=null,op=1,cap='round'}={}){
    return `<line x1="${fx(a.x)}" y1="${fx(a.y)}" x2="${fx(b.x)}" y2="${fx(b.y)}" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap}" ${dash?`stroke-dasharray="${dash}"`:''} opacity="${op}"/>`;
  }
  function poly(pts,fill,op=1,stroke='none',sw=0){
    return `<polygon points="${pts.map(p=>fx(p.x)+','+fx(p.y)).join(' ')}" fill="${fill}" fill-opacity="${op}" stroke="${stroke}" stroke-width="${sw}"/>`;
  }
  function circle(p,r,{fill='none',stroke='none',w=2,op=1}={}){
    return `<circle cx="${fx(p.x)}" cy="${fx(p.y)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" opacity="${op}"/>`;
  }
  function arrowTip(tip,dir,c,size=0.22){
    const d=unit(dir), n=P(-d.y,d.x), base=sub(tip,mul(d,size));
    return poly([tip, add(base,mul(n,size*0.42)), sub(base,mul(n,size*0.42))], c);
  }
  function realRay(a,b,c){
    const d=sub(b,a), mid=lerp(a,b,0.5);
    return line(a,b,{c,w:2.3}) + (len(d)>0.5 ? arrowTip(add(mid,mul(unit(d),0.11)),d,c) : '');
  }
  function labelInner(s,size){
    const m = s.match(/^(.*)_(.+)$/);
    const base = (m?m[1]:s).replace(/'/g,'′');
    const ital = base.replace('′','').length<=1;
    const b = `<tspan font-style="${ital?'italic':'normal'}" font-family="${ital?'Georgia, Times New Roman, serif':'system-ui, sans-serif'}">${esc(base)}</tspan>`;
    return m ? b + `<tspan font-size="${(size*0.68).toFixed(0)}" dy="5" font-family="Georgia, serif">${esc(m[2])}</tspan>` : b;
  }
  function label(p,s,{size=19,c=COL.ink,anchor='middle',weight=400}={}){
    return `<text x="${fx(p.x)}" y="${fx(p.y)}" font-size="${size}" fill="${c}" text-anchor="${anchor}" font-weight="${weight}" dominant-baseline="middle" style="paint-order:stroke;stroke:#fffdf2;stroke-width:4px">${labelInner(s,size)}</text>`;
  }
  function htmlLab(s){
    const m = s.match(/^(.*)_(.+)$/);
    const base = (m?m[1]:s).replace(/'/g,'′');
    const ital = base.replace('′','').length<=1;
    const b = ital?`<i>${esc(base)}</i>`:esc(base);
    return m ? `${b}<sub>${esc(m[2])}</sub>` : b;
  }
  function upNormal(dir){
    let n = unit(P(-dir.y,dir.x));
    if(n.y>0.01 || (Math.abs(n.y)<=0.01 && n.x>0)) n = mul(n,-1);
    return n;
  }

  // ---------- shared drawing ----------
  function drawGrid(out){
    out.push(`<rect x="0" y="0" width="${W*U}" height="${H*U}" fill="#fffdf2"/>`);
    for(let i=0;i<=W;i++) out.push(`<line x1="${i*U}" y1="0" x2="${i*U}" y2="${H*U}" stroke="#d9d2ba" stroke-width="1"/>`);
    for(let j=0;j<=H;j++) out.push(`<line x1="0" y1="${j*U}" x2="${W*U}" y2="${j*U}" stroke="#d9d2ba" stroke-width="1"/>`);
  }
  function drawMirror(out,top,fn,endBoxes=true){
    const {M1,M2}=st, md=unit(sub(M2,M1));
    const n = fn ? mul(fn,-1) : P(-md.y,md.x), wdt=0.15, L=len(sub(M2,M1));
    out.push(poly([M1,M2,add(M2,mul(n,wdt)),add(M1,mul(n,wdt))],'#b2f2bb',1,'#2f9e44',1));
    for(let t=0.06;t<L-0.05;t+=0.13){
      const p=add(M1,mul(md,t));
      out.push(line(p, add(add(p,mul(n,wdt)),mul(md,0.09)),{c:'#2f9e44',w:1.1,cap:'butt'}));
    }
    out.push(line(M1,M2,{c:'#2f9e44',w:2.4}));
    if(endBoxes) [M1,M2].forEach(p=>out.push(`<rect x="${fx(p.x)-5}" y="${fx(p.y)-5}" width="10" height="10" fill="#fff" stroke="#2f9e44" stroke-width="2"/>`));
    let lp;
    if(Math.abs(md.x)<0.3){ const topEnd = M1.y<=M2.y ? M1 : M2; lp = add(topEnd,P(0,-0.32)); }
    else if(Math.abs(md.y)<0.3){ lp = add(lerp(M1,M2,0.5), mul(n, 0.45)); }
    else {
      const far = len(sub(M1,st.O1))>len(sub(M2,st.O1)) ? M1 : M2;
      const o = far===M1 ? mul(md,-1) : md;
      lp = add(far, add(mul(o,0.35), P(o.x>0?0.35:-0.35,0)));
    }
    top.push(label(lp,tx().mirror,{size:14,c:'#2f9e44'}));
  }
  function drawImageArrow(out,top,ips){
    const I1=ips[0].I, I2=ips[1].I, d=sub(I1,I2);
    out.push(line(I2, sub(I1,mul(unit(d),0.18)),{c:COL.ink,w:2.2,dash:'7 5',cap:'butt'}));
    out.push(arrowTip(I1,d,COL.ink,0.26));
    const n=upNormal(d);
    top.push(label(add(I1,mul(n,0.36)),ips[0].il));
    top.push(label(add(I2,mul(n,0.36)),ips[1].il));
  }
  function drawImageDot(out,top,ip){
    out.push(circle(ip.I,5,{fill:COL.ink}));
    top.push(label(add(ip.I,P(-0.28,-0.3)),ip.il));
  }
  function drawObject(out,top){
    if(st.type==='arrow'){
      const d=sub(st.O1,st.O2);
      out.push(line(st.O2, sub(st.O1,mul(unit(d),0.18)),{c:COL.ink,w:2.6,cap:'butt'}));
      out.push(arrowTip(st.O1,d,COL.ink,0.26));
      const n=upNormal(d);
      top.push(label(add(st.O1,mul(n,0.36)),st.labels.h));
      top.push(label(add(st.O2,mul(n,0.36)),st.labels.t));
    } else {
      out.push(circle(st.O1,6,{fill:COL.ink}));
      top.push(label(add(st.O1,P(0.3,-0.3)),st.labels.h));
    }
  }
  function drawObservers(out,top){
    st.obs.forEach((E,j)=>{
      out.push(circle(E,6.5,{fill:COL.ink}));
      if(st.obs.length>1) out.push(circle(E,10,{stroke:OBS_COL[j]}));
      const single = E.name.length<=1;
      top.push(label(add(E,P(single?0.32:0,single?-0.3:0.42)),dispName(E.name),{size:single?19:15}));
    });
  }
  function cannotLabel(top,I,E,il){
    const m=lerp(I,E,0.6), n=upNormal(sub(E,I));
    top.push(`<text x="${fx(m.x+n.x*0.3)}" y="${fx(m.y+n.y*0.3)}" font-size="14" fill="${COL.blue}" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#fffdf2;stroke-width:4px">${tx().cannotSee(labelInner(il,14))}</text>`);
  }
  function finishSvg(out,top,handles=''){
    svg.innerHTML = `<defs><clipPath id="clipB"><rect x="0" y="0" width="${W*U}" height="${H*U}"/></clipPath></defs>`+
      `<g clip-path="url(#clipB)">${out.join('')}${top.join('')}</g>${handles}`;
  }

  // ---------- explore render ----------
  function render(){
    setModeUI();
    if(st.mode==='challenge'){ renderChallenge(); return; }
    const out=[], top=[];
    const {M1,M2}=st;
    const v = validity();
    const ips = v.ok ? imagePoints() : [];
    const fn = v.ok ? frontNormal() : null;
    const md = unit(sub(M2,M1));

    drawGrid(out);

    if(v.ok && st.opt.region){
      ips.forEach(ip=>{
        const f1=add(M1,mul(sub(M1,ip.I),80)), f2=add(M2,mul(sub(M2,ip.I),80));
        out.push(poly([M1,M2,f2,f1], ip.color, 0.11));
        out.push(line(M1,f1,{c:ip.color,w:1.2,dash:'2 5',op:.7}) + line(M2,f2,{c:ip.color,w:1.2,dash:'2 5',op:.7}));
      });
    }

    if(v.ok && st.step>=1 && st.opt.cons){
      let needExt=false;
      ips.forEach((ip,k)=>{
        const t=footT(ip.O,M1,M2); if(t<0||t>1) needExt=true;
        const F=foot(ip.O,M1,M2);
        out.push(line(ip.O,ip.I,{c:'#adb5bd',w:1.4,dash:'2 4'}));
        const no=unit(sub(ip.O,F)), s=0.16;
        out.push(`<polyline points="${[add(F,mul(md,s)),add(add(F,mul(md,s)),mul(no,s)),add(F,mul(no,s))].map(p=>fx(p.x)+','+fx(p.y)).join(' ')}" fill="none" stroke="#868e96" stroke-width="1.3"/>`);
        [lerp(ip.O,F,0.5), lerp(F,ip.I,0.5)].forEach(m=>{
          for(let q=0;q<=k;q++){
            const c=add(m,mul(no,(q-k/2)*0.09));
            out.push(line(add(c,mul(md,-0.12)),add(c,mul(md,0.12)),{c:'#868e96',w:1.4}));
          }
        });
      });
      if(needExt) out.push(line(add(M1,mul(md,-40)),add(M2,mul(md,40)),{c:'#adb5bd',w:1.2,dash:'6 6'}));
    }

    drawMirror(out,top,fn);

    if(v.ok && st.step>=1){
      if(st.type==='arrow') drawImageArrow(out,top,ips); else drawImageDot(out,top,ips[0]);
    }

    const hits = [];
    if(v.ok){
      ips.forEach((ip,k)=>{
        hits[k]=[];
        st.obs.forEach((E,j)=>{
          const h = segX(ip.I,E,M1,M2);
          hits[k][j]=h;
          if(st.step>=ip.v){
            if(h){
              out.push(line(ip.I,h.pt,{c:ip.color,w:1.8,dash:'6 5'}));
              out.push(realRay(h.pt,E,ip.color));
            } else {
              out.push(line(ip.I,E,{c:COL.blue,w:1.8,dash:'6 5'}));
              cannotLabel(top,ip.I,E,ip.il);
            }
          }
          if(st.step>=ip.r && h){
            out.push(realRay(ip.O,h.pt,ip.color));
            if(st.opt.normals){
              out.push(line(h.pt,add(h.pt,mul(fn,1.1)),{c:COL.grey,w:1.3,dash:'2 4'}));
              const ang = Math.acos(Math.max(-1,Math.min(1,dot(unit(sub(ip.O,h.pt)),fn))))*180/Math.PI;
              const tp = add(add(h.pt,mul(fn,0.55)), mul(md, (k===0?-0.35:0.35)));
              top.push(`<text x="${fx(tp.x)}" y="${fx(tp.y)}" font-size="12.5" fill="${ip.color}" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#fffdf2;stroke-width:4px">i = r = ${ang.toFixed(0)}°</text>`);
            }
          }
        });
      });
    }

    if(v.ok && st.type==='arrow' && st.opt.vis && st.step===maxStep()){
      st.obs.forEach((E,j)=>{
        const r = visibleRuns(E,ips);
        r.runs.forEach(run=>{
          const a=lerp(r.A,r.B,run.a), b=lerp(r.A,r.B,run.b);
          const off = mul(upNormal(sub(r.B,r.A)), -0.13*(j));
          out.push(line(add(a,off),add(b,off),{c:OBS_COL[j],w:10,op:.3}));
        });
      });
    }

    drawObject(out,top);
    drawObservers(out,top);

    [st.O1].concat(st.type==='arrow'?[st.O2]:[]).concat(st.obs).forEach(p=>out.push(circle(p,13,{stroke:'#74c0fc',w:1.5,op:.9})));
    const hs=[];
    const addH=(key,p)=>hs.push(`<circle class="handle" data-key="${key}" cx="${fx(p.x)}" cy="${fx(p.y)}" r="${(0.34*U).toFixed(0)}"/>`);
    addH('M1',M1); addH('M2',M2); addH('O1',st.O1);
    if(st.type==='arrow') addH('O2',st.O2);
    st.obs.forEach((E,j)=>addH('E'+j,E));
    finishSvg(out,top,hs.join(''));

    $('warn').textContent = v.msg;
    updatePanel(v, ips, hits);
  }

  function stepTexts(){
    const L=st.labels, A=st.type==='arrow';
    const h=htmlLab(L.h), hi=htmlLab(L.hi);
    const img = A ? hi+htmlLab(L.ti) : hi;
    const T=tx(), s=[
      [T.start, T.st0()],
      ['①', T.st1(img)],
      ['②', T.st2(hi)],
      ['③', T.st3(h)]
    ];
    if(A) s.push(['④', T.st4(htmlLab(L.ti))]);
    return s;
  }

  function setModeUI(){
    const ch = st.mode==='challenge';
    $('explorePanel').style.display = ch ? 'none' : '';
    $('challengeBox').style.display = ch ? '' : 'none';
    document.querySelectorAll('#typeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.type===st.type));
    $('addObs').disabled = st.obs.length>=3;
    $('remObs').disabled = st.obs.length<=1;
    $('tabExplore').classList.toggle('on',!ch);
    $('tabChallenge').classList.toggle('on',ch);
    svg.style.cursor = ch ? 'crosshair' : '';
  }

  function updatePanel(v, ips, hits){
    const texts = stepTexts(), mx = maxStep();
    if(st.step>mx) st.step=mx;
    $('stepBtns').innerHTML = texts.map((tx,i)=>`<button data-step="${i}" class="${i===st.step?'on':i<st.step?'done':''}">${tx[0]}</button>`).join('');
    $('stepText').innerHTML = texts[st.step][1];
    $('prev').disabled = st.step===0;
    $('next').disabled = st.step===mx;
    $('all').style.visibility = st.step===mx ? 'hidden' : 'visible';
    const pr = PRESETS[st.preset];
    $('taskBadge').textContent = pr ? tx().exampleN(pr.n) : tx().exploreBadge;
    $('prompt').innerHTML = st.prompt ? esc(tx().presets[st.prompt]) : tx().dragPrompt;
    $('exRow').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.ex===st.preset));

    const rc=$('resultCard');
    if(!v.ok || st.step!==mx){ rc.style.display='none'; return; }
    rc.style.display='';
    $('results').innerHTML = st.obs.map((E,j)=>{
      const parts = ips.map((ip,k)=>`${htmlLab(ip.il)} <span class="${hits[k][j]?'yes':'no'}">${hits[k][j]?'✓':'✗'}</span>`).join(' &nbsp; ');
      let verdict;
      if(st.type==='arrow'){
        const f = visibleRuns(E,ips).frac;
        verdict = f>0.995 ? 'whole' : f>0 ? 'part' : 'none';
      } else verdict = hits[0][j] ? 'image' : 'none';
      const nm = E.name==='observer' ? tx().Observer : E.name==='eye' ? tx().Eye : htmlLab(E.name);
      const chip = st.obs.length>1||st.type==='arrow' ? `<span class="chip" style="background:${OBS_COL[j]}"></span>` : '';
      return `<div class="res-row">${chip}<div>${tx().sees(nm,verdict)}<div class="muted">${parts}</div></div></div>`;
    }).join('');
  }

  // =====================================================================
  // ---------- CHALLENGE: students draw the ray diagram ----------
  // =====================================================================
  const rnd = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const inB = (p,m=0.5)=>p.x>=m&&p.x<=W-m&&p.y>=m&&p.y<=H-m;

  function newChallenge(){
    const type = Math.random()<0.75?'arrow':'point';
    const r0=Math.random(), want = type==='point' ? (r0<0.85?1:0) : (r0<0.6?2:r0<0.9?1:0); // number of image points visible
    for(let tries=0; tries<20000; tries++){
      const dirs=[[0,1],[1,0],[1,1],[1,-1]], d=dirs[rnd(0,3)], L=rnd(2,3);
      const M1=P(rnd(2,W-2),rnd(1,H-1)), M2=P(M1.x+d[0]*L,M1.y+d[1]*L);
      if(!inB(M2,1)) continue;
      const O1=P(rnd(1,W-1),rnd(1,H-1));
      let O2=null;
      if(type==='arrow'){
        const ad=[[1,0],[-1,0],[0,1],[0,-1],[1,1],[1,-1]][rnd(0,5)], l2=rnd(2,3);
        O2=P(O1.x+ad[0]*l2,O1.y+ad[1]*l2);
        if(!inB(O2,1)) continue;
      }
      const E=P(rnd(1,W-1),rnd(1,H-1));
      const ml=len(sub(M2,M1)), f=side(O1,M1,M2);
      if(Math.abs(f)/ml<1) continue;
      const pts=[O1,E].concat(O2?[O2]:[]);
      if(pts.some(p=>Math.sign(side(p,M1,M2))!==Math.sign(f) || Math.abs(side(p,M1,M2))/ml<0.9)) continue;
      if(len(sub(E,O1))<1.5 || (O2 && len(sub(E,O2))<1.5)) continue;
      if(O2){ const tt=Math.max(0,Math.min(1,footT(E,O2,O1))); if(len(sub(E,lerp(O2,O1,tt)))<1) continue; }
      const objs=[O1].concat(O2?[O2]:[]);
      const imgs=objs.map(o=>reflect(o,M1,M2));
      if(!imgs.every(p=>inB(p,0.5))) continue;
      let bad=false;
      imgs.forEach(I=>{ const k=lineParams(I,E,M1,M2); if(!k||Math.abs(k.u)<0.12||Math.abs(k.u-1)<0.12) bad=true; });
      if(bad) continue;
      const hits = imgs.map(I=>!!segX(I,E,M1,M2));
      if(hits.filter(Boolean).length!==want) continue;
      st.type=type; st.O1=O1; st.O2=O2||P(O1.x-2,O1.y); st.M1=M1; st.M2=M2;
      st.obs=[{x:E.x,y:E.y,name:'observer'}];
      st.labels={...(type==='arrow'?ARROW_L:POINT_L)};
      if(type==='arrow' && !hits[0] && !hits[1] && visibleRuns(st.obs[0],imagePoints()).frac>0) continue;
      startChallenge();
      return;
    }
  }

  function buildTasks(){
    const t=[{kind:'img',k:0}];
    if(st.type==='arrow') t.push({kind:'img',k:1});
    t.push({kind:'iray',k:0},{kind:'oray',k:0});
    if(st.type==='arrow') t.push({kind:'iray',k:1},{kind:'oray',k:1},{kind:'final'});
    return t;
  }

  function startChallenge(){
    const tasks=buildTasks();
    st.ch={ tasks, ti:0, lines:[], tool:'v',
      imgOK:[false,false], rayDone:[null,null], oDone:[false,false],
      wrongPt:null, msg:'', msgType:'', ok:false, note:'',
      tries:tasks.map(()=>0), record:tasks.map(()=>null), hintUsed:tasks.map(()=>false),
      hint:false, drawing:null, done:false, finalAns:null };
    render();
  }

  const curTask = ()=> st.ch.tasks[st.ch.ti];
  function SYM(t){
    if(t.kind==='img') return '①';
    if(t.kind==='final') return '✓';
    if(t.k===0) return t.kind==='iray' ? '②' : '③';
    return '④';
  }
  function truthHit(k){ const ips=imagePoints(); return segX(ips[k].I, st.obs[0], st.M1, st.M2); }
  function correctFinal(){
    const h0=!!truthHit(0), h1=st.type==='arrow' ? !!truthHit(1) : h0;
    return h0&&h1 ? 'whole' : (h0||h1) ? 'part' : 'none';
  }

  function taskInfo(t){
    const ips=imagePoints();
    if(t.kind==='final') return {sym:'✓', text:tx().finalQ};
    const ip=ips[t.k], I=htmlLab(ip.il), O=htmlLab(ip.ol);
    if(t.kind==='img') return {sym:'①', text:tx().taskImg(I,O)};
    if(t.kind==='iray') return {sym:SYM(t), text:tx().taskIray(I)};
    return {sym:SYM(t), text:tx().taskOray(O)};
  }

  // --- line helpers for checking ---
  const ends = (L,a,b)=>(L.a.id===a&&L.b.id===b)||(L.a.id===b&&L.b.id===a);
  const touches = (L,id)=>L.a.id===id||L.b.id===id;
  const mEnd = L=> L.a.id==='M' ? L.a : L.b.id==='M' ? L.b : null;

  function snapDraw(p,from){
    const ch=st.ch, ips=imagePoints(), E=st.obs[0];
    const keys=[{id:'O0',...st.O1}];
    if(st.type==='arrow') keys.push({id:'O1',...st.O2});
    ips.forEach((ip,k)=>{ if(ch.imgOK[k]) keys.push({id:'I'+k,x:ip.I.x,y:ip.I.y}); });
    keys.push({id:'E',x:E.x,y:E.y});
    let best=null, bd=0.42;
    keys.forEach(q=>{ const d=len(sub(q,p)); if(d<bd){bd=d;best=q;} });
    if(best) return {x:best.x,y:best.y,id:best.id};
    const t=Math.max(0,Math.min(1,footT(p,st.M1,st.M2))), q=lerp(st.M1,st.M2,t);
    if(len(sub(p,q))<0.55){
      // keep the student's direction: snap to where the drawn line crosses the mirror
      if(from && len(sub(p,from))>0.3){
        const k=lineParams(from,p,st.M1,st.M2);
        if(k && k.u>=0 && k.u<=1 && k.t>0 && k.t<=1.0001){ const x=lerp(st.M1,st.M2,k.u); if(len(sub(x,p))<0.8) return {x:x.x,y:x.y,id:'M'}; return {x:Math.round(p.x*4)/4,y:Math.round(p.y*4)/4,id:null}; }
      }
      return {x:q.x,y:q.y,id:'M'};
    }
    const s=0.25;
    return {x:Math.round(p.x/s)*s, y:Math.round(p.y/s)*s, id:null};
  }

  function pass(msg){
    const ch=st.ch;
    ch.ok=true; ch.msgType='good'; ch.msg=msg; ch.lines=[]; ch.wrongPt=null;
    if(!ch.record[ch.ti]) ch.record[ch.ti] = ch.tries[ch.ti]===0 ? 'first' : 'retry';
  }
  function fail(msg){
    const ch=st.ch;
    ch.tries[ch.ti]++; ch.msgType='bad'; ch.msg=msg;
  }

  // short reason why no line from point `id` to the mirror was found
  function diagnose(lines,id,lab,what){
    const {M1,M2}=st;
    const mine=lines.filter(L=>touches(L,id));
    const W_=()=>tx()[what];
    if(!mine.length) return lines.length ? ()=>tx().m.startOn(W_(),lab) : ()=>tx().m.drawFrom(W_(),lab);
    const L=mine[mine.length-1], other = L.a.id===id ? L.b : L.a, from = L.a.id===id ? L.a : L.b;
    if(other.id && other.id!=='M') return ()=>tx().m.endOnMirror(W_());
    if(segX(from,other,M1,M2)) return ()=>tx().m.tooLong(W_());
    return ()=>tx().m.tooShort(W_());
  }

  function placeImage(p){
    const t=curTask(), ip=imagePoints()[t.k], {M1,M2}=st;
    const O=htmlLab(ip.ol);
    if(near(p,ip.I,0.12)){ st.ch.imgOK[t.k]=true; return pass(M('correct')); }
    st.ch.wrongPt=p;
    const sp=side(p,M1,M2), so=side(ip.O,M1,M2);
    if(Math.abs(sp)<1e-6 || Math.sign(sp)===Math.sign(so)) return fail(M('behind'));
    if(!near(foot(p,M1,M2),foot(ip.O,M1,M2),0.12)) return fail(M('perp',O));
    return fail(M('dist',O));
  }

  function checkIray(claimCan){
    const ch=st.ch, t=curTask(), ip=imagePoints()[t.k], E=st.obs[0];
    const h=segX(ip.I,E,st.M1,st.M2), I=htmlLab(ip.il), Iid='I'+t.k, lines=ch.lines;
    if(!lines.length) return fail(M('drawFirst',I));
    if(h){
      if(lines.some(L=>ends(L,Iid,'E'))) return fail(M('breakLine'));
      if(lines.some(L=>L.type==='r'&&touches(L,Iid))) return fail(M('dottedBehind'));
      const V=lines.find(L=>ends(L,Iid,'M'));
      if(!V) return fail(diagnose(lines,Iid,I,'wDotted'));
      if(!near(mEnd(V),h.pt,0.3)) return fail(M('aimEye'));
      const R=lines.find(L=>ends(L,'M','E'));
      if(!R) return fail(M('nowSolid'));
      if(R.type!=='r') return fail(M('solidFront'));
      if(R.a.id==='E') return fail(M('arrowME'));
      if(!near(mEnd(R),h.pt,0.3)) return fail(M('startWhereMeets'));
      if(lines.length>2) return fail(M('tooMany'));
      if(!claimCan) return fail(M('passesLook'));
      st.ch.rayDone[t.k]={hit:true,P:h.pt};
      return pass(M('canSee',I));
    }
    if(lines.some(L=>touches(L,'M'))) return fail(M('reallyHit',I));
    const V=lines.find(L=>ends(L,Iid,'E'));
    if(!V) return fail(lines.some(L=>touches(L,Iid)) ? M('allTheWay') : M('startExactly',I));
    if(V.type!=='v') return fail(M('noReal'));
    if(lines.length>1) return fail(M('tooMany'));
    if(claimCan) return fail(M('missesLook'));
    st.ch.rayDone[t.k]={hit:false};
    return pass(M('cannotSeeOk',I));
  }

  function checkOray(){
    const ch=st.ch, t=curTask(), ip=imagePoints()[t.k], Pt=ch.rayDone[t.k].P;
    const O=htmlLab(ip.ol), Oid='O'+t.k, lines=ch.lines;
    if(!lines.length) return fail(M('drawRayFirst',O));
    const R=lines.find(L=>ends(L,Oid,'M'));
    if(!R) return fail(diagnose(lines,Oid,O,'wRay'));
    if(R.type!=='r') return fail(M('solidReal'));
    if(R.a.id==='M') return fail(M('arrowOM',O));
    if(!near(mEnd(R),Pt,0.3)) return fail(M('samePoint'));
    if(lines.length>1) return fail(M('tooMany'));
    ch.oDone[t.k]=true;
    return pass(M('correct'));
  }

  function checkFinal(ans){
    const c=correctFinal();
    st.ch.finalAns=ans;
    if(ans===c) return pass(M('correct'));
    return fail(M('finalWrong'));
  }

  function showAnswer(){
    const ch=st.ch, t=curTask();
    if(t.kind==='img') ch.imgOK[t.k]=true;
    if(t.kind==='iray'){ const h=truthHit(t.k); ch.rayDone[t.k] = h ? {hit:true,P:h.pt} : {hit:false}; }
    if(t.kind==='oray') ch.oDone[t.k]=true;
    if(t.kind==='final') ch.finalAns=correctFinal();
    ch.record[ch.ti]='shown';
    pass(t.kind==='final' ? M('answer',correctFinal()) : M('hereAnswer'));
    ch.msgType='info';
  }

  function nextTask(){
    const ch=st.ch, ips=imagePoints();
    ch.ti++; ch.lines=[]; ch.ok=false; ch.msg=''; ch.hint=false; ch.wrongPt=null; ch.note='';
    while(ch.ti<ch.tasks.length){
      const t=curTask();
      if(t.kind==='oray' && ch.rayDone[t.k] && !ch.rayDone[t.k].hit){
        ch.record[ch.ti]='skip';
        ch.note=M('skipNote',htmlLab(ips[t.k].il),htmlLab(ips[t.k].ol));
        ch.ti++; continue;
      }
      break;
    }
    if(ch.ti>=ch.tasks.length) ch.done=true;
    else ch.tool = curTask().kind==='oray' ? 'r' : 'v';
    render();
  }

  function studentLine(L,col,op=1){
    let s = L.type==='v' ? line(L.a,L.b,{c:col,w:2.2,dash:'6 5',op}) : `<g opacity="${op}">${realRay(L.a,L.b,col)}</g>`;
    [L.a,L.b].forEach(e=>{ if(e.id==='M') s+=circle(e,3.5,{fill:col,op}); });
    return s;
  }

  function renderChallenge(){
    const ch=st.ch, out=[], top=[], ips=imagePoints(), E=st.obs[0], fn=frontNormal();
    const {M1,M2}=st, md=unit(sub(M2,M1));
    const t = ch.done ? null : curTask();
    drawGrid(out);

    // hints
    if(t && ch.hint){
      if(t.kind==='img'){
        const ip=ips[t.k], F=foot(ip.O,M1,M2), n=unit(sub(ip.O,F)), s=0.16;
        out.push(line(add(M1,mul(md,-40)),add(M2,mul(md,40)),{c:'#adb5bd',w:1.2,dash:'6 6'}));
        out.push(line(add(ip.O,mul(n,30)),sub(F,mul(n,30)),{c:'#74c0fc',w:1.6,dash:'3 5'}));
        out.push(`<polyline points="${[add(F,mul(md,s)),add(add(F,mul(md,s)),mul(n,s)),add(F,mul(n,s))].map(p=>fx(p.x)+','+fx(p.y)).join(' ')}" fill="none" stroke="#1c7ed6" stroke-width="1.4"/>`);
      } else if(t.kind==='iray'){
        out.push(line(ips[t.k].I,E,{c:'#74c0fc',w:1.4,dash:'3 5'}));
      } else if(t.kind==='oray'){
        out.push(circle(ch.rayDone[t.k].P,13,{stroke:'#1c7ed6',w:2.5}));
      }
    }

    drawMirror(out,top,fn,false);

    // accepted images
    if(st.type==='arrow' && ch.imgOK[0] && ch.imgOK[1]) drawImageArrow(out,top,ips);
    else ips.forEach((ip,k)=>{ if(ch.imgOK[k]) drawImageDot(out,top,ip); });

    // accepted rays
    [0,1].forEach(k=>{
      const rd=ch.rayDone[k]; if(!rd) return;
      const ip=ips[k];
      if(rd.hit){
        out.push(line(ip.I,rd.P,{c:ip.color,w:1.8,dash:'6 5'}));
        out.push(realRay(rd.P,E,ip.color));
        if(ch.oDone[k]) out.push(realRay(ip.O,rd.P,ip.color));
      } else {
        out.push(line(ip.I,E,{c:COL.blue,w:1.8,dash:'6 5'}));
        cannotLabel(top,ip.I,E,ip.il);
      }
    });

    // student's lines for the current step
    if(t && (t.kind==='iray'||t.kind==='oray')){
      const col=ips[t.k].color;
      // faint extension of dotted lines from the image, to help aim at the observer
      const extend=(L,op)=>{
        if(L.type!=='v') return;
        const isImg=e=>e.id&&e.id[0]==='I';
        let from=L.a, to=L.b;
        if(isImg(L.b)&&!isImg(L.a)){ from=L.b; to=L.a; }
        if(!isImg(from)) return;
        const d=sub(to,from); if(len(d)<0.2) return;
        out.push(line(to, add(to,mul(unit(d),40)),{c:'#495057',w:1.6,dash:'2 5',op}));
      };
      ch.lines.forEach(L=>extend(L,0.7));
      ch.lines.forEach(L=>out.push(studentLine(L,col)));
      if(ch.drawing){
        const D={...ch.drawing,type:ch.tool};
        if(len(sub(D.a,D.b))>0.05){ extend(D,0.85); out.push(studentLine(D,col,0.65)); }
        [D.a,D.b].forEach(e=>{ if(e.id) out.push(circle(e,11,{stroke:'#1c7ed6',w:2,op:.8})); });
        const e=D.b, ips2=imagePoints();
        const nm = e.id==='M' ? tx().onMirror : e.id==='E' ? tx().obsWord : e.id&&e.id[0]==='I' ? ips2[+e.id[1]].il : e.id&&e.id[0]==='O' ? ips2[+e.id[1]].ol : '';
        if(nm && len(sub(D.a,D.b))>0.05) top.push(`<text x="${fx(e.x+0.3)}" y="${fx(e.y-0.35)}" font-size="13" fill="#1c7ed6" font-weight="600" style="paint-order:stroke;stroke:#fffdf2;stroke-width:4px">✓ ${e.id==='M'||e.id==='E'?nm:labelInner(nm,13)}</text>`);
      }
    }
    if(ch.wrongPt){
      const p=ch.wrongPt, r=0.16;
      out.push(line(add(p,P(-r,-r)),add(p,P(r,r)),{c:COL.bad,w:3})+line(add(p,P(-r,r)),add(p,P(r,-r)),{c:COL.bad,w:3}));
    }

    drawObject(out,top);
    drawObservers(out,top);
    // pulsing marker: where to start the next line
    if(t && !ch.ok && !ch.drawing){
      let pt=null;
      if(t.kind==='iray'){
        const Iid='I'+t.k, V=ch.lines.find(L=>ends(L,Iid,'M'));
        if(!ch.lines.some(L=>touches(L,Iid))) pt=ips[t.k].I;
        else if(V && !ch.lines.some(L=>touches(L,'E'))) pt=mEnd(V);
      } else if(t.kind==='oray' && !ch.lines.length) pt=ips[t.k].O;
      if(pt) out.push(`<circle cx="${fx(pt.x)}" cy="${fx(pt.y)}" r="9" fill="none" stroke="#1c7ed6" stroke-width="3"><animate attributeName="r" values="8;17;8" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/></circle>`);
    }
    finishSvg(out,top);
    $('warn').textContent='';
    updateChallengePanel();
  }

  const PEN_V = `<svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="#495057" stroke-width="2.4" stroke-dasharray="5 4"/></svg>`;
  const PEN_R = `<svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="#495057" stroke-width="2.4"/><polygon points="22,5 13,1 13,9" fill="#495057"/></svg>`;

  function updateChallengePanel(){
    const ch=st.ch, ips=imagePoints();
    const chips = ch.tasks.map((t,i)=>{
      const r=ch.record[i];
      const cls = r ? r : (i===ch.ti && !ch.done ? 'cur' : '');
      return `<span class="tchip ${cls}">${i+1}</span>`;
    }).join('');
    const T=tx();
    let html = `<div class="card"><div class="tasklist">${chips}</div>`;

    if(ch.done){
      const n=ch.tasks.filter((_,i)=>ch.record[i]!=='skip').length;
      const first=ch.record.filter(r=>r==='first').length;
      $('taskBadge').textContent=T.doneBadge;
      $('prompt').innerHTML=T.donePrompt;
      html += `<div class="big">${first} / ${n}</div><div class="center muted">${T.firstTime}</div>`;
      if(ch.note) html += `<div class="fb info">${say(ch.note)}</div>`;
      html += `<div class="nav" style="margin-top:14px"><button data-act="new" class="primary">${T.newCh}</button></div>`;
      html += `<div class="center"><button data-act="restart" class="link">${T.tryAgain}</button></div></div>`;
      $('challengeBox').innerHTML = html;
      return;
    }

    const t=curTask(), info=taskInfo(t), drawing = t.kind==='iray'||t.kind==='oray';
    $('taskBadge').textContent = T.stepOf(ch.ti+1,ch.tasks.length);
    $('prompt').innerHTML = info.text;
    if(ch.note) html += `<div class="fb info" style="margin:0 0 12px">${say(ch.note)}</div>`;

    if(!ch.ok){
      if(drawing){
        html += `<div class="lbl">${T.pen}</div><div class="tools">
          <button data-tool="v" class="${ch.tool==='v'?'on':''}">${PEN_V} ${T.dotted}</button>
          <button data-tool="r" class="${ch.tool==='r'?'on':''}">${PEN_R} ${T.solid}</button></div>`;
        if(t.kind==='iray') html += `<div class="tip center">${T.penTip}</div>`;
      }
      if(t.kind==='iray'){
        const I=htmlLab(ips[t.k].il);
        html += `<div class="answers"><button data-act="can">${T.canBtn(I)}</button><button data-act="cannot">${T.cannotBtn(I)}</button></div>`;
      } else if(t.kind==='oray'){
        html += `<div class="answers"><button data-act="check">${T.checkBtn}</button></div>`;
      } else if(t.kind==='final'){
        html += `<div class="answers" style="margin-top:0">
          <button data-act="final" data-v="whole">${T.fWhole}</button>
          <button data-act="final" data-v="part">${T.fPart}</button>
          <button data-act="final" data-v="none">${T.fNone}</button></div>`;
      }
    }
    if(ch.msg) html += `<div class="fb ${ch.msgType}">${ch.msgType==='bad'?'✗ ':ch.msgType==='good'?'✓ ':''}${say(ch.msg)}</div>`;
    else if(ch.hint && !ch.ok){
      const H=T.hints[t.kind];
      html += `<div class="fb info">💡 ${H}</div>`;
    }
    if(ch.ok){
      const last = ch.ti===ch.tasks.length-1 || ch.tasks.slice(ch.ti+1).every(tt=>tt.kind==='oray'&&ch.rayDone[tt.k]&&!ch.rayDone[tt.k].hit);
      html += `<div class="nav" style="margin-top:12px"><button data-act="next" class="primary">${last?T.finish:T.nextBtn}</button></div>`;
    } else {
      const mini=[];
      if(drawing){ const d=ch.lines.length?'':'disabled'; mini.push(`<button data-act="undo" ${d}>${T.undo}</button>`,`<button data-act="clear" ${d}>${T.clear}</button>`); }
      if(t.kind!=='final') mini.push(`<button data-act="hint" ${ch.hint?'disabled':''}>${T.hint}</button>`);
      if(ch.tries[ch.ti]>=2) mini.push(`<button data-act="show">${T.showAns}</button>`);
      if(mini.length) html += `<div class="mini">${mini.join('')}</div>`;
    }
    html += `</div><div class="foot"><button data-act="restart" class="link">${T.restart}</button><button data-act="new" class="link">${T.newCh}</button></div>`;
    $('challengeBox').innerHTML = html;
  }

  // ---------- interaction ----------
  let drag=null;
  function toUnits(e){
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    return P(q.x/U,q.y/U);
  }
  function snapP(p,s=st.snap){
    let x=p.x,y=p.y;
    if(s>0){ x=Math.round(x/s)*s; y=Math.round(y/s)*s; }
    return P(Math.max(0.25,Math.min(W-0.25,x)),Math.max(0.25,Math.min(H-0.25,y)));
  }
  function setPt(key,p){
    if(key==='M1'||key==='M2'){
      const other = key==='M1'?st.M2:st.M1;
      if(len(sub(p,other))<0.3) return;
      st[key]=p;
    } else if(key==='O1'||key==='O2'){
      const other = key==='O1'?st.O2:st.O1;
      if(st.type==='arrow' && len(sub(p,other))<0.3) return;
      st[key]=p;
    } else if(key[0]==='E'){
      const j=+key.slice(1); st.obs[j].x=p.x; st.obs[j].y=p.y;
    }
  }
  svg.addEventListener('pointerdown',e=>{
    if(st.mode==='challenge'){
      const ch=st.ch; if(!ch||ch.done||ch.ok) return;
      const t=curTask(), p=toUnits(e);
      e.preventDefault();
      if(t.kind==='img'){ placeImage(snapP(p,0.5)); render(); return; }
      if(t.kind==='iray'||t.kind==='oray'){
        const a=snapDraw(p); ch.drawing={a,b:a};
        svg.setPointerCapture(e.pointerId); render();
      }
      return;
    }
    const k=e.target.dataset && e.target.dataset.key;
    if(!k) return;
    drag=k; svg.setPointerCapture(e.pointerId); e.preventDefault();
  });
  svg.addEventListener('pointermove',e=>{
    if(st.mode==='challenge'){
      if(st.ch && st.ch.drawing){ st.ch.drawing.b=snapDraw(toUnits(e),st.ch.drawing.a); render(); }
      return;
    }
    if(!drag) return;
    setPt(drag,snapP(toUnits(e))); render();
  });
  const endDrag=()=>{
    drag=null;
    const ch=st.ch;
    if(st.mode==='challenge' && ch && ch.drawing){
      const {a,b}=ch.drawing;
      if(len(sub(a,b))>0.25){ ch.lines.push({a,b,type:ch.tool}); ch.msg=''; }
      ch.drawing=null; render();
    }
  };
  svg.addEventListener('pointerup',endDrag);
  svg.addEventListener('pointercancel',endDrag);

  const setStep = s=>{ const mx=maxStep(); st.step=Math.max(0,Math.min(mx,s)); render(); };
  $('stepBtns').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setStep(+b.dataset.step); });
  $('prev').onclick=()=>setStep(st.step-1);
  $('next').onclick=()=>setStep(st.step+1);
  $('all').onclick=()=>setStep(maxStep());
  document.addEventListener('keydown',e=>{
    if(st.mode!=='explore') return;
    if(['SELECT','INPUT'].includes(document.activeElement.tagName)) return;
    if(e.key==='ArrowRight') setStep(st.step+1);
    if(e.key==='ArrowLeft') setStep(st.step-1);
  });

  function exButtons(){ $('exRow').innerHTML = Object.entries(PRESETS).map(([k,p])=>`<button data-ex="${k}" class="${k===st.preset?'on':''}">${tx().exampleN(p.n)}</button>`).join(''); }
  function applyLang(){
    const T=tx();
    document.documentElement.lang = lang==='zh' ? 'zh-HK' : 'en';
    document.title = T.title;
    $('homeLink').textContent = T.home;
    document.querySelectorAll('[data-t]').forEach(e=>{ e.textContent = T[e.dataset.t]; });
    document.querySelectorAll('[data-h]').forEach(e=>{ e.innerHTML = T[e.dataset.h]; });
    ['en','zh'].forEach(l=>{ const b=$('lang-'+l); b.classList.toggle('on',lang===l); b.setAttribute('aria-pressed',String(lang===l)); });
    exButtons();
  }
  function setLang(l){ lang=l; try{ localStorage.setItem('sim-lang',l); }catch(e){} applyLang(); render(); }
  $('lang-en').onclick=()=>setLang('en');
  $('lang-zh').onclick=()=>setLang('zh');
  applyLang();
  $('exRow').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) loadPreset(b.dataset.ex); });
  document.querySelectorAll('#typeSeg button').forEach(b=>b.onclick=()=>{
    const t=b.dataset.type; if(t===st.type) return;
    st.type=t;
    if(t==='arrow'){
      let O2=P(st.O1.x-2,st.O1.y);
      if(!inB(O2,0.3)) O2=P(st.O1.x+2,st.O1.y);
      st.O2=O2; st.labels={...ARROW_L};
    } else st.labels={...POINT_L};
    st.prompt=''; st.preset=null; render();
  });
  const defaultNames = ()=>st.obs.every(o=>o.name==='observer'||/^[ABC]$/.test(o.name));
  $('addObs').onclick=()=>{
    if(st.obs.length>=3) return;
    const last=st.obs[st.obs.length-1];
    let np=P(last.x+1,last.y); if(!inB(np,0.5)) np=P(last.x-1,last.y);
    st.obs.push({x:np.x,y:np.y,name:'observer'});
    if(defaultNames()) st.obs.forEach((o,i)=>o.name='ABC'[i]);
    render();
  };
  $('remObs').onclick=()=>{
    if(st.obs.length<=1) return;
    st.obs.pop();
    if(st.obs.length===1 && /^[ABC]$/.test(st.obs[0].name) && defaultNames()) st.obs[0].name='observer';
    render();
  };

  $('tabExplore').onclick=()=>{ if(st.mode==='explore') return; st.mode='explore'; loadPreset(st.preset||'ex1'); };
  $('tabChallenge').onclick=()=>{ st.mode='challenge'; newChallenge(); };
  $('challengeBox').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    const ch=st.ch;
    if(b.dataset.tool){ ch.tool=b.dataset.tool; render(); return; }
    switch(b.dataset.act){
      case 'new': newChallenge(); return;
      case 'restart': startChallenge(); return;
      case 'undo': ch.lines.pop(); ch.msg=''; break;
      case 'clear': ch.lines=[]; ch.msg=''; break;
      case 'can': checkIray(true); break;
      case 'cannot': checkIray(false); break;
      case 'check': checkOray(); break;
      case 'final': checkFinal(b.dataset.v); break;
      case 'hint': ch.hint=true; ch.hintUsed[ch.ti]=true; break;
      case 'show': showAnswer(); break;
      case 'next': nextTask(); return;
    }
    render();
  });

  const bindOpt=(id,key)=>$(id).onchange=e=>{st.opt[key]=e.target.checked;render();};
  bindOpt('optCons','cons'); bindOpt('optVis','vis'); bindOpt('optRegion','region'); bindOpt('optNormals','normals');
  $('snap').onchange=e=>{st.snap=+e.target.value;};

  loadPreset('ex1');
})();
</script>
</body>
</html>
