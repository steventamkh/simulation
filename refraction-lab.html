<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Refraction Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Schibsted+Grotesk:wght@600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: an optical bench. The ray diagram holds the left column and the question works beside it; on a phone they stack as question, diagram, answer. */
:root{
  --bg:#eef4f5; --panel:#fbfdfd; --fg:#13262e; --muted:#51666f; --line:#c5d4d9;
  --accent:#0a6580; --accent-fg:#ffffff; --accent-soft:#d8ebf1;
  --ray:#cf2a23; --m1:#f1f7f8; --m2:#bfe0e8; --boundary:#27505f;
  --ok:#14753f; --ok-soft:#dcf1e4; --bad:#b4261f; --bad-soft:#fae3e0; --halo:#ffffff;
  --display:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,"Microsoft JhengHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a1f; --panel:#15252c; --fg:#e6f0f2; --muted:#9db2ba; --line:#2f464f;
  --accent:#62c6df; --accent-fg:#06222b; --accent-soft:#1c3b47;
  --ray:#ff7468; --m1:#14252c; --m2:#20485a; --boundary:#94c3d1;
  --ok:#62d394; --ok-soft:#143626; --bad:#ff8f85; --bad-soft:#42201d; --halo:#0e1a1f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1f; --panel:#15252c; --fg:#e6f0f2; --muted:#9db2ba; --line:#2f464f;
  --accent:#62c6df; --accent-fg:#06222b; --accent-soft:#1c3b47;
  --ray:#ff7468; --m1:#14252c; --m2:#20485a; --boundary:#94c3d1;
  --ok:#62d394; --ok-soft:#143626; --bad:#ff8f85; --bad-soft:#42201d; --halo:#0e1a1f;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 17px/1.5 var(--body)}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(26px,5vw,34px)/1.1 var(--display);margin:0;letter-spacing:-.01em}
.h1zh{font-size:.62em;font-weight:600;color:var(--muted);white-space:nowrap}
.sub{margin:2px 0 0;color:var(--muted);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.wedge:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:7px 12px;min-height:40px;font-size:15px}
.ghost[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}

.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rname{font-size:14px;line-height:1.3}
.eq{display:block;font:500 15px/1.6 var(--mono);overflow-wrap:anywhere}
.explorer{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 18px}
.explorer summary{cursor:pointer;font:600 17px var(--display);min-height:32px}
.ex-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px 24px;margin-top:12px}
.ex-body svg{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
.ex-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.ex-side select{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:8px;min-height:44px;width:100%}
.ex-side p{margin:0}
.rung{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0;
  background:var(--panel);border:1px solid var(--line);border-bottom-width:4px;border-radius:6px;padding:10px 14px}
.rung b{font:600 16px/1.25 var(--display)}
.rung small{color:var(--muted);font-size:14px}
.rung[aria-current="true"]{border-color:var(--accent)}
.rung[disabled]{cursor:not-allowed;opacity:.72}
.rung.passed small{color:var(--ok);font-weight:700}
.next-note{margin:0;color:var(--muted);font-size:14px}

.bench{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;
  display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  grid-template-areas:"meta meta" "fig prompt" "fig controls" "fig feedback";
  grid-template-rows:auto auto auto 1fr;column-gap:24px;row-gap:14px}
.meta{grid-area:meta;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.meta span{font:500 13px var(--mono);color:var(--muted);letter-spacing:.02em}
.pips{display:flex;gap:6px}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:500 13px var(--mono);color:var(--muted)}
.pip.now{border-color:var(--accent);color:var(--fg)}
.pip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fig{grid-area:fig;min-width:0}
.fig svg{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.prompt{grid-area:prompt;min-width:0}
.prompt p{margin:0;font-size:19px;line-height:1.42;text-wrap:pretty}
.controls{grid-area:controls;min-width:0;display:flex;flex-direction:column;gap:8px}
.feedback{grid-area:feedback;min-width:0;display:flex;flex-direction:column;gap:10px}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 14px;min-height:48px;text-align:left;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default;opacity:.62}
.opt.right{border-color:var(--ok);background:var(--ok-soft);opacity:1}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.letters .opt{text-align:center;font:500 20px var(--mono);padding:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.answer{display:flex;align-items:center;gap:6px;font:500 20px var(--mono)}
.answer input{font:inherit;width:6em;padding:8px 10px;min-height:48px;border:2px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:10px 18px;min-height:48px;font-weight:700}
.primary:hover{filter:brightness(1.08)}
label.slide{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted)}
label.slide input{width:100%;height:32px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:15px;margin:0;min-height:1.4em}
.hintbtn{align-self:flex-start;background:none;border:0;padding:6px 0;color:var(--accent);text-decoration:underline;font-size:16px;min-height:40px}
.hints{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.hints li{border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-size:16px}
.verdict{border-radius:6px;padding:12px 14px;font-size:16px;display:flex;flex-direction:column;gap:6px}
.verdict h2{margin:0;font:600 17px var(--display)}
.verdict p{margin:0}
.verdict.ok{background:var(--ok-soft)} .verdict.ok h2{color:var(--ok)}
.verdict.bad{background:var(--bad-soft)} .verdict.bad h2{color:var(--bad)}
.zh{display:none;color:var(--muted);font-size:.92em}
.show-zh .zh{display:inline}

.result{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px 18px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.result h2{margin:0;font:800 clamp(30px,6vw,44px)/1.1 var(--display)}
.result p{margin:0;max-width:62ch}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

svg text{font-family:var(--body);fill:var(--fg);font-size:15px;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round}
svg .sm{font-size:14px;fill:var(--muted)}
svg .val{font:500 14px var(--mono)}
svg .ltr{font:500 19px var(--mono)}
.m1{fill:var(--m1)} .m2{fill:var(--m2)}
.bd{stroke:var(--boundary);stroke-width:2.5}
.nm{stroke:var(--fg);stroke-width:1.6;stroke-dasharray:7 6;fill:none}
.ext{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:2 5;stroke-linecap:round;fill:none}
.ray{stroke:var(--ray);stroke-width:3.2;fill:none;stroke-linecap:round}
.head{fill:var(--ray)}
.ray.out{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .7s ease-out}
.head.out{animation:appear .7s ease-out}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes appear{0%,60%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ray.out,.head.out{animation:none}}
.w{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:1.4}
.wedge{cursor:pointer}
.wedge .hit{fill:transparent;stroke:none}
.wedge:hover .w{fill-opacity:.36}
.wedge.right .w{fill:var(--ok);stroke:var(--ok);fill-opacity:.42}
.wedge.wrong .w{fill:var(--bad);stroke:var(--bad);fill-opacity:.42}
.wedge.off{cursor:default}
.mine{stroke:var(--accent);stroke-width:3;stroke-dasharray:9 6}
.mine.faded{stroke:var(--bad);stroke-width:2}
.grab{fill:var(--accent);stroke:var(--halo);stroke-width:2.5;cursor:grab}
.true{stroke:var(--ok);stroke-width:2.6;stroke-dasharray:9 5}
.sq{fill:none;stroke:var(--ok);stroke-width:1.8}

@media (max-width:760px){
  .bench{grid-template-columns:minmax(0,1fr);grid-template-areas:"meta" "prompt" "fig" "controls" "feedback";grid-template-rows:none;padding:14px}
  .prompt p{font-size:18px}
}
@media (max-width:760px){
  .rname{display:none}
  .rung{padding:7px 7px}
  .rung b{font-size:14px}
  .rung small{font-size:12px;line-height:1.25}
  .ex-body{grid-template-columns:minmax(0,1fr)}
}
</style>

<a href="./" style="display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 max(16px,env(safe-area-inset-left,0px));min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid rgba(127,140,150,.35);font:500 13px/1.2 system-ui,-apple-system,sans-serif;color:inherit;text-decoration:none;opacity:.85">&#8592; All simulations</a>
<div class="wrap">
  <header>
    <div>
      <h1>Refraction Lab <span class="h1zh">折射練習室</span></h1>
      <p class="sub">HKDSE Physics · Light · Score 4 out of 5 to climb to the next level</p>
    </div>
    <button class="ghost" id="zh-toggle" type="button" aria-pressed="false">Show 中文 terms</button>
  </header>
  <nav class="ladder" id="ladder" aria-label="Levels"></nav>
  <main id="stage"></main>
  <details class="explorer" id="explorer" hidden>
    <summary>Ray explorer: change the angle and watch the ray</summary>
    <div class="ex-body">
      <div id="ex-fig"></div>
      <div class="ex-side">
        <label class="slide" for="ex-pair">Media
          <select id="ex-pair">
            <option value="glass,air">Glass into air</option>
            <option value="water,air">Water into air</option>
            <option value="diamond,air">Diamond into air</option>
            <option value="glass,water">Glass into water</option>
            <option value="air,glass">Air into glass</option>
          </select>
        </label>
        <label class="slide" for="ex-angle"><span>Angle of incidence: <b id="ex-angle-val">30°</b></span>
          <input type="range" id="ex-angle" min="0" max="89" step="1" value="30">
        </label>
        <p id="ex-read" aria-live="polite"></p>
      </div>
    </div>
  </details>
  <div class="foot">
    <p class="next-note">Your scores are saved in this browser only.</p>
    <button class="ghost" id="reset" type="button">Reset my progress</button>
  </div>
</div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const snell=(n1,n2,t)=>deg(Math.asin(n1*Math.sin(rad(t))/n2));
const n2f=n=>n.toFixed(2);
const speed=n=>(3/n).toFixed(2);
const MEDIA={air:['Air',1.00],water:['Water',1.33],ethanol:['Ethanol',1.36],oil:['Cooking oil',1.47],perspex:['Perspex',1.49],
  glass:['Glass',1.50],flint:['Flint glass',1.65],sapphire:['Sapphire',1.77],diamond:['Diamond',2.42]};
const md=k=>({key:k,name:MEDIA[k][0],n:MEDIA[k][1],lower:MEDIA[k][0].toLowerCase()});
const GLOSS=[['total internal reflection','全內反射'],['critical angle','臨界角'],['angle of reflection','反射角'],['optical fibre','光纖'],['cladding','包層'],['prism','稜鏡'],['angle of incidence','入射角'],['angle of refraction','折射角'],['refractive index','折射率'],['refractive indices','折射率'],
  ['optically denser','光密'],['optically less dense','光疏'],['incident ray','入射光線'],['refracted ray','折射光線'],['boundary','界面'],['normal','法線'],['surface','表面']];
function gloss(html){
  const seen={};
  const re=new RegExp('\\b('+GLOSS.map(g=>g[0]).join('|')+')\\b','gi');
  return html.replace(re,m=>{const k=m.toLowerCase();if(seen[k])return m;seen[k]=1;
    const z=GLOSS.find(g=>g[0]===k)[1];return m+'<span class="zh"> ('+z+')</span>'});
}
const store={
  get(){try{return JSON.parse(localStorage.getItem('refraction-ladder')||'{}')}catch(e){return {}}},
  set(v){try{localStorage.setItem('refraction-ladder',JSON.stringify(v))}catch(e){}}
};

/* ---------- ray geometry: b = boundary direction (deg), s = which way along the boundary the ray travels ---------- */
function geo(b,s,t,p){
  const u=[Math.cos(rad(b)),Math.sin(rad(b))], n=[-Math.sin(rad(b)),Math.cos(rad(b))];
  const dir=a=>[Math.cos(rad(a))*n[0]+s*Math.sin(rad(a))*u[0],Math.cos(rad(a))*n[1]+s*Math.sin(rad(a))*u[1]];
  const dI=dir(t);
  // the reflected ray keeps its motion along the boundary and reverses its motion along the normal
  const along=dI[0]*u[0]+dI[1]*u[1],across=dI[0]*n[0]+dI[1]*n[1];
  return {b,s,t,p,u,n,dIn:dI,dOut:dir(p),dR:[along*u[0]-across*n[0],along*u[1]-across*n[1]]};
}
const P=[240,170];
const at=(v,r,o)=>[(o||P)[0]+v[0]*r,(o||P)[1]+v[1]*r];
const neg=v=>[-v[0],-v[1]];
const fmt=q=>q[0].toFixed(1)+' '+q[1].toFixed(1);
function roleDirs(g,role){
  return {inN:[neg(g.dIn),neg(g.n)],inS:[neg(g.dIn),[-g.s*g.u[0],-g.s*g.u[1]]],
    outN:[g.dOut,g.n],outS:[g.dOut,[g.s*g.u[0],g.s*g.u[1]]],dev:[g.dIn,g.dOut],refl:[g.dR,neg(g.n)]}[role];
}
function wedgePath(a,b,r){
  const a1=Math.atan2(a[1],a[0]),a2=Math.atan2(b[1],b[0]);
  let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  const e=at(a,r),f=at(b,r);
  return 'M'+fmt(P)+' L'+fmt(e)+' A'+r+' '+r+' 0 0 '+(d>0?1:0)+' '+fmt(f)+' Z';
}
function bisect(a,b){const m=[a[0]+b[0],a[1]+b[1]],l=Math.hypot(m[0],m[1])||1;return [m[0]/l,m[1]/l]}
function arrow(from,d){
  const mid=at(d,105,from),x=[-d[1],d[0]];
  const pts=[[mid[0]+d[0]*9,mid[1]+d[1]*9],[mid[0]-d[0]*6+x[0]*6.5,mid[1]-d[1]*6+x[1]*6.5],[mid[0]-d[0]*6-x[0]*6.5,mid[1]-d[1]*6-x[1]*6.5]];
  return pts.map(fmt).join(' ');
}
function regionLabel(g,side,lines,hug){
  // hug keeps the label close to the boundary, clear of a reflected ray on the same side
  const sign=side===1?-1:1, along=side===1?g.s:-g.s, perp=hug?44:92, off=hug?170:128;
  let x=P[0]+sign*perp*g.n[0]+along*off*g.u[0], y=P[1]+sign*perp*g.n[1]+along*off*g.u[1];
  x=Math.min(392,Math.max(88,x)); y=Math.min(318-(lines.length-1)*19,Math.max(24,y));
  return textBlock(x,y,lines);
}
function textBlock(x,y,lines){
  return '<text text-anchor="middle" x="'+x.toFixed(0)+'" y="'+y.toFixed(0)+'"><tspan style="font-weight:700">'+lines[0]+'</tspan>'+
    lines.slice(1).map((l,i)=>'<tspan x="'+x.toFixed(0)+'" dy="19" class="sm">'+l+'</tspan>').join('')+'</text>';
}
function drawFig(q,done){
  const g=q.g, big=1200;
  const A=at(g.u,big),B=at(g.u,-big);
  const poly=(sg)=>[A,B,[B[0]+sg*big*g.n[0],B[1]+sg*big*g.n[1]],[A[0]+sg*big*g.n[0],A[1]+sg*big*g.n[1]]].map(fmt).join(' ');
  let h='<svg viewBox="0 0 480 340" role="img" aria-label="Ray diagram at a boundary between two media" id="fig-svg"'+(q.kind==='drag'&&!done?' style="touch-action:none"':'')+'>';
  if(q.bg)h+=q.bg;
  else{
    h+='<polygon class="m1" points="'+poly(-1)+'"/><polygon class="m2" points="'+poly(1)+'"/>';
    h+='<line class="bd" x1="'+A[0].toFixed(1)+'" y1="'+A[1].toFixed(1)+'" x2="'+B[0].toFixed(1)+'" y2="'+B[1].toFixed(1)+'"/>';
    h+=regionLabel(g,1,q.labels[0],!!q.outcome)+regionLabel(g,2,q.labels[1]);
  }
  // wedges
  // A predict question keeps its angle marks hidden until answered, because they would reveal the refracted ray.
  // Marks that carry their own text, such as a given angle of incidence, stay visible.
  const allW=q.wedges||{},wedges={};
  Object.keys(allW).forEach(k=>{if(done||q.kind!=='choice'||q.showOut||allW[k].text)wedges[k]=allW[k]});
  Object.keys(wedges).forEach(role=>{
    const [a,b]=roleDirs(g,role),w=wedges[role],c=bisect(a,b);
    const pos=at(c,w.far||62);
    let cls='wedge';
    if(q.kind==='wedge'&&done){cls+=' off';if(role===q.answer)cls+=' right';else if(role===q.chosen)cls+=' wrong'}
    if(q.kind!=='wedge')cls+=' off';
    const attrs=q.kind==='wedge'&&!done?' tabindex="-1" data-role="'+role+'"':'';
    h+='<g class="'+cls+'"'+attrs+'><path class="w" d="'+wedgePath(a,b,44)+'"/>';
    if(q.kind==='wedge'&&!done)h+='<path class="hit" d="'+wedgePath(a,b,76)+'"/>';
    const txt=(done&&w.doneText)||w.text;
    if(txt)h+='<text text-anchor="middle" dominant-baseline="central" class="'+(w.letter?'ltr':'val')+'" x="'+pos[0].toFixed(1)+'" y="'+pos[1].toFixed(1)+'">'+txt+'</text>';
    h+='</g>';
  });
  if(q.extend){const x=at(g.dIn,150);h+='<line class="ext" x1="'+P[0]+'" y1="'+P[1]+'" x2="'+x[0].toFixed(1)+'" y2="'+x[1].toFixed(1)+'"/>'}
  // normal
  const nA=at(g.n,150),nB=at(g.n,-150);
  const showNormal=q.kind!=='drag';
  if(showNormal)h+='<line class="nm" x1="'+nA[0].toFixed(1)+'" y1="'+nA[1].toFixed(1)+'" x2="'+nB[0].toFixed(1)+'" y2="'+nB[1].toFixed(1)+'"/>';
  // rays
  if(!q.noRay||done){
    const st=at(g.dIn,-(q.inLen||260));
    if(q.inLen){const pr=[st[0]-g.dIn[0]*300,st[1]+g.dIn[1]*300];
      h+='<line class="ray" x1="'+pr[0].toFixed(1)+'" y1="'+pr[1].toFixed(1)+'" x2="'+st[0].toFixed(1)+'" y2="'+st[1].toFixed(1)+'"/>'}
    h+='<line class="ray" x1="'+st[0].toFixed(1)+'" y1="'+st[1].toFixed(1)+'" x2="'+P[0]+'" y2="'+P[1]+'"/>';
    h+='<polygon class="head" points="'+arrow(at(g.dIn,-200),g.dIn)+'"/>';
  }
  const tir=q.outcome==='tir';
  if(q.outcome&&(done||q.showRefl)){

    hints:['Find the critical angle at the wall: sin c = '+n2f(n2)+' ÷ '+n2f(n1)+'.'].concat(axis?['The angle with the axis equals the angle with the wall. A ray at the critical angle makes 90° − c with the wall.']:['Total internal reflection begins just above the critical angle.']),
    explain:eq(lines.concat(axis?['Largest angle with the axis = 90° − '+c.toFixed(1)+'° = '+ans.toFixed(1)+'°']:['Smallest angle of incidence ≈ '+c.toFixed(1)+'°'])),
    fb:a=>matchFb([[crit(n1,1),'You used sin c = 1 ÷ n. The second medium is the cladding, not air.'],[n2/n1,ASIN_MSG,.01],[Math.asin(n2/n1),RAD_MSG,.02],[axis?c:90-c,axis?'That is the critical angle, measured from the normal. The angle with the axis is measured from the wall direction.':'That angle is measured from the wall. Angles of incidence are measured from the normal.']],a)||'Find the critical angle using the core and cladding values.'};
}
function level5(){
  const coin=()=>Math.random()<.5;
  return [tirPredictQ(coin()),coin()?denserTrapQ():snellErrorQ(),coin()?reflectionQ():semiQ(coin()),prismQ(),fibreQ()];
}

/* ---------- app state ---------- */
const LEVELS=[{name:'Which way does it bend?',make:level1},{name:'Finding the angles',make:level2},{name:'Snell\'s law',make:level3},{name:'Critical angle',make:level4},{name:'Total internal reflection',make:level5}];
const PASS=4;
let prog=store.get(); prog.best=LEVELS.map((_,i)=>(prog.best&&prog.best[i])||0);
const teacher=location.hash==='#teacher';
let cur=0;while(cur<LEVELS.length-1&&prog.best[cur]>=PASS)cur++;
let round=null;
const stage=document.getElementById('stage'),ladder=document.getElementById('ladder');
const LOCKS_ON=true; // set to true to make students pass each level before the next one opens
const unlocked=i=>!LOCKS_ON||i===0||teacher||prog.best[i-1]>=PASS;

function renderLadder(){
  ladder.innerHTML=LEVELS.map((l,i)=>{
    const open=unlocked(i),passed=prog.best[i]>=PASS;
    const state=!open?'Locked':passed?'✓ Best '+prog.best[i]+'/5':prog.best[i]?'Best '+prog.best[i]+'/5':'Not tried';
    return '<button type="button" class="rung'+(passed?' passed':'')+'" data-l="'+i+'"'+(open?'':' disabled')+(i===cur?' aria-current="true"':'')+' aria-label="Level '+(i+1)+': '+l.name+'. '+state+'"><b>Level '+(i+1)+'</b><span class="rname">'+l.name+'</span><small>'+state+'</small></button>';
  }).join('');
}
function start(i){cur=i;round={qs:LEVELS[i].make(),i:0,res:[]};renderLadder();renderQ();
  document.getElementById('explorer').hidden=i<3;}
function pips(){
  return '<div class="pips" aria-label="Question '+(round.i+1)+' of 5">'+round.qs.map((_,k)=>{
    const r=round.res[k],c=r===true?'ok':r===false?'bad':k===round.i?'now':'';
    return '<span class="pip '+c+'">'+(r===true?'✓':r===false?'✗':k+1)+'</span>'}).join('')+'</div>';
}
function renderQ(){
  const q=round.qs[round.i];q.hintN=0;q.done=false;
  stage.innerHTML='<section class="bench"><div class="meta"><span>LEVEL '+(cur+1)+' · QUESTION '+(round.i+1)+' OF 5</span>'+pips()+'</div>'+
    '<div class="fig" id="fig"></div><div class="prompt"><p>'+gloss(q.prompt)+'</p></div>'+
    '<div class="controls" id="controls"></div><div class="feedback" id="feedback" aria-live="polite"></div></section>';
  drawNow(q);renderControls(q);renderHelp(q);
}
function drawNow(q){
  document.getElementById('fig').innerHTML=drawFig(q,q.done);
  if(q.kind==='wedge'&&!q.done){
    document.querySelectorAll('.wedge[data-role]').forEach(el=>el.addEventListener('click',()=>answer(q,el.dataset.role)));
  }
  if(q.kind==='drag'&&!q.done)bindDrag(q);
}
function renderControls(q){
  const c=document.getElementById('controls');
  if(q.kind==='choice'){
    c.innerHTML=q.options.map(o=>'<button type="button" class="opt" id="opt-'+o.key+'" data-k="'+o.key+'">'+gloss(o.label)+'</button>').join('');
    c.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(q,b.dataset.k)));
  }else if(q.kind==='wedge'){
    const order=['a','b','c','d'],rev={};Object.keys(q.byRole).forEach(r=>rev[q.byRole[r]]=r);
    c.innerHTML='<div class="letters">'+order.map(l=>'<button type="button" class="opt" id="opt-'+l+'" data-k="'+rev[l]+'" aria-label="Angle '+l+'">'+l+'</button>').join('')+'</div>';
    c.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(q,b.dataset.k)));
  }else if(q.kind==='number'){
    c.innerHTML='<form id="num-form" class="row"><label class="answer" for="num-in"><input id="num-in" inputmode="decimal" autocomplete="off" aria-label="Your answer">'+(q.unit===undefined?'°':q.unit)+'</label><button class="primary" type="submit">Check answer</button></form><p class="err" id="num-err"></p>';
    document.getElementById('num-form').addEventListener('submit',e=>{e.preventDefault();
      const v=parseFloat(document.getElementById('num-in').value.replace('°','').trim());
      if(isNaN(v)){document.getElementById('num-err').textContent=q.unit===''?'Type your answer as a number, such as 1.50.':'Type your answer as a number of degrees, such as 40.';return}
      answer(q,v)});
    if(window.matchMedia('(min-width:761px)').matches)document.getElementById('num-in').focus();
  }else{
    c.innerHTML='<label class="slide" for="normal-angle">Rotate your line<input type="range" id="normal-angle" min="0" max="179" step="1" value="'+Math.round(q.alpha)+'"></label><div class="row"><button class="primary" type="button" id="drag-check">Check my normal</button></div>';
    document.getElementById('normal-angle').addEventListener('input',e=>setAlpha(q,+e.target.value));
    document.getElementById('drag-check').addEventListener('click',()=>answer(q,q.alpha));
  }
}
function setAlpha(q,a){
  q.alpha=((a%180)+180)%180;
  document.getElementById('drag-line').innerHTML=lineAt(q.alpha,'mine');
  const h=document.getElementById('drag-handle');
  h.setAttribute('cx',(P[0]+126*Math.cos(rad(q.alpha))).toFixed(1));
  h.setAttribute('cy',(P[1]+126*Math.sin(rad(q.alpha))).toFixed(1));
  const s=document.getElementById('normal-angle');if(s&&+s.value!==Math.round(q.alpha))s.value=Math.round(q.alpha)%180;
}
function bindDrag(q){
  const svg=document.getElementById('fig-svg');let on=false;
  const move=e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*480-P[0],y=(e.clientY-r.top)/r.height*340-P[1];
    if(Math.hypot(x,y)<8)return;
    setAlpha(q,deg(Math.atan2(y,x)));
  };
  svg.addEventListener('pointerdown',e=>{on=true;try{svg.setPointerCapture(e.pointerId)}catch(_){ }move(e);e.preventDefault()});
  svg.addEventListener('pointermove',e=>{if(on)move(e)});
  ['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>{on=false}));
}
function renderHelp(q){
  const f=document.getElementById('feedback');
  const shown=q.hints.slice(0,q.hintN).map(h=>'<li>'+gloss(h)+'</li>').join('');
  const left=q.hints.length-q.hintN;
  f.innerHTML=(shown?'<ul class="hints">'+shown+'</ul>':'')+(left>0?'<button type="button" class="hintbtn" id="hint-btn">'+(q.hintN?'Show another hint':'Show a hint')+' ('+left+' left)</button>':'');
  const b=document.getElementById('hint-btn');
  if(b)b.addEventListener('click',()=>{q.hintN++;renderHelp(q);const nb=document.getElementById('hint-btn');if(nb)nb.focus()});
}
function judge(q,ans){
  if(q.kind==='number')return Math.abs(ans-q.answer)<=(q.tol||.5);
  if(q.kind==='drag'){const d=normalOff(q,ans);return d<=5}
  return ans===q.answer;
}
function normalOff(q,a){ // degrees away from true perpendicular
  const d=(((a-q.g.b)%180)+180)%180;
  return Math.abs(d-90);
}
function dragFb(q,a){
  const d=(((a-q.g.b)%180)+180)%180,withSurface=Math.min(d,180-d);
  const rayA=((deg(Math.atan2(q.g.dIn[1],q.g.dIn[0]))%180)+180)%180;
  const rd=Math.abs(rayA-a),nearRay=Math.min(rd,180-rd)<=6;
  const measured='Your line makes '+withSurface.toFixed(0)+'° with the boundary. It should make 90°. ';
  if(nearRay)return measured+'You lined it up with the ray. The normal is set by the boundary, not by the ray.';
  if(Math.abs(a-90)<=6)return measured+'You drew it straight up the page. The normal is perpendicular to the boundary, which is sloping here.';
  if(a<=6||a>=174)return measured+'You drew it level across the page. Line it up with the boundary instead, at 90°.';
  return measured;
}
function answer(q,ans){
  if(q.done)return;
  q.done=true;q.chosen=ans;
  const ok=judge(q,ans);q.correct=ok;round.res[round.i]=ok;
  if(q.kind==='number'&&q.doneWedge){q.wedges=Object.assign({},q.wedges);q.wedges[q.doneWedge]={text:q.doneText||(q.answer+'°')}}
  if(q.kind==='drag'){q.alpha=ans}
  drawNow(q);
  // lock controls
  document.querySelectorAll('#controls .opt').forEach(b=>{b.disabled=true;
    if(b.dataset.k===String(q.answer))b.classList.add('right');
    else if(b.dataset.k===String(ans))b.classList.add('wrong');});
  const ni=document.getElementById('num-in');if(ni){ni.readOnly=true;document.getElementById('num-err').textContent='';document.querySelector('#num-form button').disabled=true}
  const sl=document.getElementById('normal-angle');if(sl)sl.disabled=true;
  const dc=document.getElementById('drag-check');if(dc)dc.disabled=true;
  const piph=document.querySelector('.pips');if(piph)piph.outerHTML=pips();
  const why=ok?'':(q.kind==='drag'?dragFb(q,ans):q.fb(ans));
  const last=round.i===round.qs.length-1;
  document.getElementById('feedback').innerHTML='<div class="verdict '+(ok?'ok':'bad')+'"><h2>'+(ok?'✓ Correct':'✗ Not quite')+'</h2>'+
    (why?'<p>'+gloss(why)+'</p>':'')+'<p>'+gloss(q.explain)+'</p></div>'+
    '<div class="row"><button class="primary" type="button" id="next-btn">'+(last?'See my score':'Next question')+'</button></div>';
  const nb=document.getElementById('next-btn');
  nb.addEventListener('click',()=>{if(last)finish();else{round.i++;renderQ();window.scrollTo({top:stage.offsetTop-8})}});
  if(window.matchMedia('(min-width:761px)').matches)nb.focus();
}
function finish(){
  const score=round.res.filter(Boolean).length,passed=score>=PASS;
  if(score>prog.best[cur]){prog.best[cur]=score;store.set(prog)}
  renderLadder();
  const hasNext=cur+1<LEVELS.length;
  let msg,btn='';
  if(passed&&hasNext){msg='Level '+(cur+2)+' is now open.';btn='<button class="primary" type="button" id="go-next">Go to Level '+(cur+2)+'</button>'}
  else if(passed){msg='You have finished all five levels, from the direction of bending to total internal reflection.'}
  else{msg='You need '+PASS+' out of 5 to move on. A new set has different numbers and diagrams.'}
  stage.innerHTML='<section class="result"><h2>'+score+' out of 5</h2><p>'+msg+'</p><div class="pips">'+round.res.map(r=>'<span class="pip '+(r?'ok':'bad')+'">'+(r?'✓':'✗')+'</span>').join('')+'</div><div class="row">'+btn+'<button class="'+(passed&&hasNext?'ghost':'primary')+'" type="button" id="again">'+(passed?'Practise this level again':'Try a new set')+'</button></div></section>';
  document.getElementById('again').addEventListener('click',()=>start(cur));
  const g=document.getElementById('go-next');if(g)g.addEventListener('click',()=>start(cur+1));
}
ladder.addEventListener('click',e=>{const b=e.target.closest('.rung');if(b&&!b.disabled)start(+b.dataset.l)});
const zhBtn=document.getElementById('zh-toggle');
function setZh(on){document.body.classList.toggle('show-zh',on);zhBtn.setAttribute('aria-pressed',on);zhBtn.textContent=on?'Hide 中文 terms':'Show 中文 terms'}
zhBtn.addEventListener('click',()=>{prog.zh=!prog.zh;store.set(prog);setZh(prog.zh)});
setZh(!!prog.zh);
const resetBtn=document.getElementById('reset');let armed=false;
resetBtn.addEventListener('click',()=>{
  if(!armed){armed=true;resetBtn.textContent='Click again to reset';setTimeout(()=>{armed=false;resetBtn.textContent='Reset my progress'},3000);return}
  armed=false;resetBtn.textContent='Reset my progress';prog.best=LEVELS.map(()=>0);store.set(prog);start(0);
});

/* ---------- ray explorer ---------- */
function fresnel(n1,n2,i,p){
  const ci=Math.cos(rad(i)),cp=Math.cos(rad(p));
  const rs=(n1*ci-n2*cp)/(n1*ci+n2*cp),rp=(n1*cp-n2*ci)/(n1*cp+n2*ci);
  return (rs*rs+rp*rp)/2;
}
function renderExplorer(){
  const[ka,kb]=document.getElementById('ex-pair').value.split(','),a=md(ka),b=md(kb),i=+document.getElementById('ex-angle').value;
  const x=a.n*Math.sin(rad(i))/b.n,tir=x>1,p=tir?0:deg(Math.asin(x)),g=geo(0,1,i,p);
  const R=tir?1:fresnel(a.n,b.n,i,p);
  const q={kind:'number',g,labels:[nLabel(a),nLabel(b)],showOut:!tir,outcome:tir?'tir':'refract',showRefl:true,reflOp:tir?1:Math.max(.08,Math.sqrt(R)),
    wedges:i?Object.assign({inN:{text:i+'°'}},tir?{}:{outN:{text:p.toFixed(0)+'°'}}):{}};
  document.getElementById('ex-fig').innerHTML=drawFig(q,false).replace(' id="fig-svg"','');
  document.getElementById('ex-angle-val').textContent=i+'°';
  const c=a.n>b.n?crit(a.n,b.n):null;
  document.getElementById('ex-read').innerHTML=gloss('sin θ₂ = '+n2f(a.n)+' × sin '+i+'° ÷ '+n2f(b.n)+' = <b>'+x.toFixed(3)+'</b><br>'+
    (tir?'This is greater than 1, so a calculator shows Math Error. No refracted ray exists: total internal reflection.':'Angle of refraction = '+p.toFixed(1)+'°. About '+Math.round(R*100)+'% of the light reflects.')+'<br>'+
    (c?'Critical angle = '+c.toFixed(1)+'°.':'This ray enters an optically denser medium, so it has no critical angle.'));
}
document.getElementById('ex-pair').addEventListener('input',renderExplorer);
document.getElementById('ex-angle').addEventListener('input',renderExplorer);
renderExplorer();
window.__ladder={level1,level2,level3,level4,level5,judge,normalOff};
start(cur);
})();
</script>
