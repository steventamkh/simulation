<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practise converting between s–t, v–t and a–t graphs for HKDSE Physics.">
<title>Motion Graph Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: lab-notebook workbench — question strip, two graph-paper panels side by side, feedback, then a motion track that replays the answer. */
:root{
  --bg:#EDF2F6; --panel:#FFFFFF; --ink:#14212C; --muted:#56687A; --line:#D3DDE6;
  --grid:#E4EBF1; --grid-major:#C2D0DB; --axis:#33465A;
  --s:#2560A8; --v:#D2620E; --a:#21825A; --reveal:#7A4BC8;
  --accent:#0E6B7B; --accent-ink:#FFFFFF;
  --good:#1D8048; --good-bg:#E2F3E9; --bad:#C2352B; --bad-bg:#FBE7E5; --info-bg:#E5EDF4; --sel:#FFF3CF;
  --f-display:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --panel:#16212B; --ink:#E4ECF2; --muted:#93A6B7; --line:#273541;
  --grid:#1C2833; --grid-major:#2E3F4D; --axis:#B7C6D3;
  --s:#72AAF2; --v:#F39A48; --a:#4CC48C; --reveal:#B696F6;
  --accent:#3BB3C3; --accent-ink:#06222A;
  --good:#4CC97F; --good-bg:#12301F; --bad:#F2766B; --bad-bg:#3A1A18; --info-bg:#1A2733; --sel:#2F2A16;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --panel:#16212B; --ink:#E4ECF2; --muted:#93A6B7; --line:#273541;
  --grid:#1C2833; --grid-major:#2E3F4D; --axis:#B7C6D3;
  --s:#72AAF2; --v:#F39A48; --a:#4CC48C; --reveal:#B696F6;
  --accent:#3BB3C3; --accent-ink:#06222A;
  --good:#4CC97F; --good-bg:#12301F; --bad:#F2766B; --bad-bg:#3A1A18; --info-bg:#1A2733; --sel:#2F2A16;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;font-weight:600}
.eyebrow{margin:0 0 6px;font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{margin:8px 0 0;color:var(--muted);max-width:60ch}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);font:700 13px var(--f-body);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;font:700 12px var(--f-mono);font-variant-numeric:tabular-nums}
.stats span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.relation{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:500 13px var(--f-mono);color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:8px}
.relation b{font-weight:700}
.cs{color:var(--s)} .cv{color:var(--v)} .ca{color:var(--a)}
.relation .gap{width:14px}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-family:var(--f-body)}
.levels button .n{font:700 15px var(--f-display)}
.levels button .d{font-size:13px;color:var(--muted)}
.levels button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.levels button[aria-pressed="true"] .n{color:var(--accent)}
@media (max-width:640px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.question{display:flex;flex-direction:column;gap:6px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font:700 12px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--panel)}
.prompt{margin:0;font-size:18px;max-width:70ch}
.how{margin:0;color:var(--muted);font-size:14px;max-width:75ch}
.graphs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:780px){.graphs{grid-template-columns:minmax(0,1fr)}}
.panel{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.panel figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px;padding:2px 4px}
.ro{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.answer{border-color:var(--accent)}
.graph{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none}
#gAns{touch-action:none;cursor:crosshair;border-radius:8px}
#gAns:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gl{stroke:var(--grid);stroke-width:1}
.gm{stroke:var(--grid-major)}
.ax{stroke:var(--axis);stroke-width:1.4}
.axh{fill:var(--axis)}
.tk{font:500 11px var(--f-mono);fill:var(--muted)}
.axt{font:700 12px var(--f-mono);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.pl{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.jump{stroke-dasharray:4 4;stroke-width:1.6}
.plbl,.vlbl{font:700 11px var(--f-mono);paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
.q-s .pl{stroke:var(--s)} .q-v .pl{stroke:var(--v)} .q-a .pl{stroke:var(--a)}
.q-s .plbl,.q-s .dot{fill:var(--s)} .q-v .plbl,.q-v .dot{fill:var(--v)} .q-a .plbl,.q-a .dot{fill:var(--a)}
.reveal .pl{stroke:var(--reveal);stroke-dasharray:7 5;stroke-width:2.2}
.reveal .plbl,.reveal .dot{fill:var(--reveal)}
.sl{fill:none;stroke-width:3.4;stroke-linecap:round}
.q-s .sl{stroke:var(--s)} .q-v .sl{stroke:var(--v)} .q-a .sl{stroke:var(--a)}
.sl.pending{stroke-dasharray:5 5;opacity:.6}
.sl.ok{stroke:var(--good)} .sl.bad{stroke:var(--bad)}
.hd{fill:var(--panel);stroke-width:2.4}
.q-s .hd{stroke:var(--s)} .q-v .hd{stroke:var(--v)} .q-a .hd{stroke:var(--a)}
.hd.on{stroke-width:3.6}
.hd.lock{fill:var(--ink);stroke:var(--ink)}
.vlbl{fill:var(--ink)}
.selcol{fill:var(--sel)}
.nguide{stroke:var(--muted);stroke-dasharray:2 4;opacity:.7}
.conn{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1.2}
.qm{font:700 13px var(--f-mono);fill:var(--muted)}
.cursor{stroke:var(--ink);stroke-width:1.3;stroke-dasharray:3 3}
.shapes{display:flex;flex-direction:column;gap:6px;padding:4px 4px 0}
.shapes .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shapes .sec{font:700 12px var(--f-mono);min-width:64px;font-variant-numeric:tabular-nums}
.shapes .seg button{font-size:12px;padding:5px 10px}
.shapes .row.bad .sec{color:var(--bad)} .shapes .row.ok .sec{color:var(--good)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:700 15px var(--f-body);border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.seg button:focus-visible,.levels button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:flex;flex-direction:column;gap:10px}
.banner{border-radius:10px;padding:10px 14px;font-weight:700;background:var(--info-bg)}
.banner.good{background:var(--good-bg);color:var(--good)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.items li{display:grid;grid-template-columns:72px 22px minmax(0,1fr);gap:8px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.items .sec{font:700 12px var(--f-mono);font-variant-numeric:tabular-nums}
.items .mk{font-weight:700}
.items li.ok .mk{color:var(--good)} .items li.bad .mk{color:var(--bad)}
.items p{margin:0}
.work{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.work h3{margin:0 0 6px;font:700 14px var(--f-body)}
.tbl{overflow-x:auto}
.work table{border-collapse:collapse;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.work th{text-align:left;padding:4px 14px 4px 0;white-space:nowrap;color:var(--muted)}
.work td{padding:4px 0;white-space:nowrap}
.motion{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.trackbox{position:relative}
#track{width:100%;height:auto;display:block}
.trackbox.locked #track{opacity:.28}
.lockmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px;font-weight:700;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ctrl input[type=range]{flex:1 1 200px;min-width:0;accent-color:var(--accent)}
.ctrl select{font:700 13px var(--f-body);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.readout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font:700 14px var(--f-mono);font-variant-numeric:tabular-nums}
.readout div{border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.readout small{display:block;font:500 11px var(--f-mono);color:var(--muted)}
@media (max-width:520px){.readout{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tr-ax{stroke:var(--axis);stroke-width:1.6}
.tr-ref{stroke:var(--accent);stroke-width:2}
.tr-reft{font:700 11px var(--f-mono);fill:var(--accent)}
.cart{fill:var(--s)}
.wheel{fill:var(--ink)}
.varrow{stroke:var(--v);stroke-width:3;stroke-linecap:round}
.varrowh{fill:var(--v)}
[hidden]{display:none!important}
/* modes + quick match */
.modes{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.modes button{border:0;background:none;color:var(--muted);font:700 15px var(--f-body);padding:8px 14px 9px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.modes button:hover{color:var(--ink)}
.modes button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mode{display:flex;flex-direction:column;gap:18px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:780px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.mside{display:flex;flex-direction:column;gap:10px;min-width:0}
.opt{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ohead{display:flex;align-items:center;gap:10px;padding:2px 4px}
.lt{font:800 15px var(--f-display);width:28px;height:28px;border-radius:50%;border:1.5px solid var(--grid-major);display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt.done{cursor:default}
.opt.done:hover{border-color:var(--line)}
.opt.dim{opacity:.72}
.opt.correct,.opt.correct:hover{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt.correct .lt{background:var(--good);border-color:var(--good);color:var(--panel)}
.opt.wrong,.opt.wrong:hover{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.why{margin:0;padding:0 4px;font-size:14px;color:var(--muted)}
.opt.correct .why{color:var(--good);font-weight:700}
.opt.wrong .why{color:var(--bad)}
/* play the motion */
.graphs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.graphs3{grid-template-columns:minmax(0,1fr)}}
.pg{touch-action:pan-y;cursor:ew-resize}
.showtg{display:inline-flex;gap:6px;align-items:center;font:500 13px var(--f-body);color:var(--muted);cursor:pointer}
.showtg input{accent-color:var(--accent);margin:0}
.hidnote{margin:0;padding:48px 12px;text-align:center;color:var(--muted);border:1px dashed var(--grid-major);border-radius:8px;font-size:14px}
.band{fill:var(--accent);opacity:.18}
.cdot{stroke:var(--panel);stroke-width:2}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.task .prompt{font-weight:700}
.why2{margin:0;color:var(--ink);max-width:75ch}
#ptrack{width:100%;height:auto;display:block;overflow:visible}
.aarrow{stroke:var(--a);stroke-width:3;stroke-linecap:round}
.aarrowh{fill:var(--a)}
.arrl{font:700 12px var(--f-mono)}
.varrowt{fill:var(--v)} .aarrowt{fill:var(--a)}
/* describe the motion */
.drows{display:flex;flex-direction:column;gap:8px;min-width:0}
.drow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.drow.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.drow.ok{border-color:var(--good)} .drow.bad{border-color:var(--bad)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dhead .sec{font:700 13px var(--f-mono);font-variant-numeric:tabular-nums}
.drow .mk{font-weight:700} .drow.ok .mk{color:var(--good)} .drow.bad .mk{color:var(--bad)}
.dgroups{display:flex;flex-wrap:wrap;gap:6px}
.dgroups .seg button{font-size:12.5px;padding:6px 10px}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.drow .hint{margin:0;font-size:14px;color:var(--bad)}
.dlegend{display:flex;gap:16px;flex-wrap:wrap;font:700 12px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<a id="homeLink" href="./" style="display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 max(16px,env(safe-area-inset-left,0px));min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid rgba(127,140,150,.35);font:500 13px/1.2 system-ui,-apple-system,sans-serif;color:inherit;text-decoration:none;opacity:.85">&#8592; All simulations</a>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 data-t="appTitle"></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="side">
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" type="button">EN</button><button id="lang-zh" type="button">中文</button>
      </div>
      <div class="stats" aria-live="polite"><span id="stFirst"></span><span id="stStreak"></span><span id="stBest"></span></div>
    </div>
  </header>

  <nav class="modes" id="modes" role="tablist" aria-label="Mode"></nav>

  <div class="relation" id="relation"></div>

  <nav class="levels" id="levels" aria-label="Level"></nav>

  <div class="mode" id="buildMode">
  <section class="question">
    <div class="qhead"><h2 id="qno"></h2><span class="chip" id="qtype"></span></div>
    <p class="prompt" id="prompt"></p>
    <p class="how" id="how"></p>
  </section>

  <div class="graphs">
    <figure class="panel">
      <figcaption><span id="capGiven"></span></figcaption>
      <svg id="gGiven" class="graph" role="img"></svg>
    </figure>
    <figure class="panel answer">
      <figcaption><span id="capAns"></span><span class="ro" id="readout"></span></figcaption>
      <svg id="gAns" class="graph" tabindex="0" role="application" aria-label="Answer graph"></svg>
      <div class="shapes" id="shapes"></div>
    </figure>
  </div>

  <div class="actions">
    <button class="btn primary" id="bCheck" type="button"></button>
    <button class="btn" id="bClear" type="button"></button>
    <button class="btn" id="bReveal" type="button"></button>
    <button class="btn" id="bNext" type="button"></button>
  </div>

  <section class="feedback" id="feedback" aria-live="polite"></section>

  <section class="motion">
    <h2 data-t="motionTitle"></h2>
    <div class="trackbox" id="trackbox">
      <svg id="track" viewBox="0 0 560 96"></svg>
      <div class="lockmsg" id="lockmsg"></div>
    </div>
    <div class="ctrl">
      <button class="btn" id="bPlay" type="button"></button>
      <input type="range" id="tSlider" min="0" max="10" step="0.05" value="0" aria-label="time">
      <select id="speed" aria-label="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    </div>
    <div class="readout">
      <div><small>t / s</small><span id="roT">0.0</span></div>
      <div class="cs"><small>s / m</small><span id="roS">–</span></div>
      <div class="cv"><small>v / m s⁻¹</small><span id="roV">–</span></div>
      <div class="ca"><small>a / m s⁻²</small><span id="roA">–</span></div>
    </div>
  </section>
  </div>

  <div class="mode" id="matchMode" hidden>
    <section class="question">
      <div class="qhead"><h2 id="mqno"></h2><span class="chip" id="mqtype"></span></div>
      <p class="prompt" id="mprompt"></p>
      <p class="how" id="mhow"></p>
    </section>
    <div class="mgrid">
      <figure class="panel">
        <figcaption><span id="mcapGiven"></span></figcaption>
        <svg id="mGiven" class="graph" role="img"></svg>
      </figure>
      <div class="mside">
        <section class="feedback" id="mfeedback" aria-live="polite"></section>
        <div class="actions"><button class="btn primary" id="mNext" type="button"></button></div>
      </div>
    </div>
    <div class="mgrid" id="options"></div>
  </div>

  <div class="mode" id="playMode" hidden>
    <section class="question">
      <div class="qhead"><h2 id="pqno"></h2></div>
      <p class="how" id="phow"></p>
    </section>
    <section class="motion">
      <svg id="ptrack" viewBox="0 0 560 112" role="img" aria-label="track"></svg>
      <div class="ctrl">
        <button class="btn" id="pPlay" type="button"></button>
        <input type="range" id="pSlider" min="0" max="10" step="0.05" value="0" aria-label="time">
        <select id="pSpeed" aria-label="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      </div>
      <div class="readout">
        <div><small>t / s</small><span id="pT">0.0</span></div>
        <div class="cs"><small>s / m</small><span id="pS">–</span></div>
        <div class="cv"><small>v / m s⁻¹</small><span id="pV">–</span></div>
        <div class="ca"><small>a / m s⁻²</small><span id="pA">–</span></div>
      </div>
    </section>

/* ---------- physics model ---------- */
function buildModel(spec,s0){
  let t=0,s=s0;const segs=spec.map(o=>{const g={t0:t,t1:t+o.d,d:o.d,vs:o.vs,a:o.a,ve:o.vs+o.a*o.d,sS:s};g.sE=s+o.vs*o.d+0.5*o.a*o.d*o.d;t=g.t1;s=g.sE;return g;});
  return {T:t,segs,s0,v0:segs[0].vs};
}
function segAt(m,t){for(const g of m.segs){if(t<g.t1-1e-9)return g;}return m.segs[m.segs.length-1];}
function sAt(m,t){const g=segAt(m,t),u=t-g.t0;return g.sS+g.vs*u+0.5*g.a*u*u;}
function vAt(m,t){const g=segAt(m,t);return g.vs+g.a*(t-g.t0);}
function aAt(m,t){return segAt(m,t).a;}
function sValues(m){const out=[m.s0];m.segs.forEach(g=>{out.push(g.sE);if(g.a!==0){const u=-g.vs/g.a;if(u>0&&u<g.d)out.push(g.sS+g.vs*u+0.5*g.a*u*u);}});return out;}
function valsOf(q,m){if(q==='s')return sValues(m);if(q==='v')return m.segs.flatMap(g=>[g.vs,g.ve]);return m.segs.map(g=>g.a);}
function split(T,n){const d=Array(n).fill(2);let r=T-2*n;while(r-->0)d[ri(0,n-1)]++;return d;}

/* Sections are split only where the GIVEN graph crosses its time axis, so no extra dot hints at the answer:
   s–t → v–t splits where s = 0; v–t → a–t and v–t → s–t split where v = 0; a–t → v–t is not split.
   Every question has at most 2 such crossings and at most 5 sections. */
const MAXCROSS=2,MAXSEC=5;
function zerosIn(g,q){
  const out=[],add=u=>{if(u>1e-6&&u<g.d-1e-6)out.push(u);};
  if(q==='v'){if(g.a!==0)add(-g.vs/g.a);}
  else if(q==='s'){
    if(g.a===0){if(g.vs!==0)add(-g.sS/g.vs);}
    else{const disc=g.vs*g.vs-2*g.a*g.sS;if(disc>=-1e-9){const r=Math.sqrt(Math.max(0,disc));add((-g.vs+r)/g.a);add((-g.vs-r)/g.a);}}
  }
  out.sort((x,y)=>x-y);return out.filter((u,i)=>!i||Math.abs(u-out[i-1])>1e-6);
}
function splitZeros(m,q,intS){
  const spec=[];let total=0;
  for(const g of m.segs){
    let cuts=q?zerosIn(g,q):[];total+=cuts.length;
    if(cuts.some(u=>Math.abs(u-Math.round(u))>1e-6))return null;
    cuts=cuts.map(Math.round);let prev=0;
    for(const u of [...cuts,g.d]){spec.push({d:u-prev,vs:g.vs+g.a*prev,a:g.a});prev=u;}
  }
  if(total>MAXCROSS)return null;
  const out=buildModel(spec,m.s0);
  if(out.segs.length>MAXSEC)return null;
  if(intS&&[out.s0,...out.segs.map(g=>g.sE)].some(x=>Math.abs(x-Math.round(x))>1e-6))return null;
  return out;
}
function genConst(type){
  for(let k=0;k<20000;k++){
    const n=ri(2,3),d=split(10,n);const v=d.map(()=>ri(-6,6));
    if(Math.random()<.5)v[ri(0,n-1)]=0;
    if(v.some((x,i)=>i&&x===v[i-1]))continue;
    if(v.every(x=>x===0))continue;
    const m=splitZeros(buildModel(d.map((dd,i)=>({d:dd,vs:v[i],a:0})),ri(-8,8)),type==='s2v'?'s':null,true);
    if(!m)continue;
    if(sValues(m).some(x=>Math.abs(x)>40))continue;
    return m;
  }
}
function genCont(level,type){
  for(let k=0;k<80000;k++){
    const n=level===2?ri(2,3):ri(3,4),d=split(10,n);
    let v=level===2?ri(0,5):ri(-6,6);const spec=[];let ok=true,zeros=0;
    for(let i=0;i<n;i++){
      const a=ri(-4,4);if(a===0)zeros++;
      if(i&&a===spec[i-1].a){ok=false;break;}
      const ve=v+a*d[i];
      if(level===2&&(ve<0||ve>12)){ok=false;break;}
      if(level===3&&Math.abs(ve)>12){ok=false;break;}
      spec.push({d:d[i],vs:v,a});v=ve;
    }
    if(!ok||zeros>1||zeros===n)continue;
    const vs=spec.flatMap(g=>[g.vs,g.vs+g.a*g.d]);
    if(level===3&&!(Math.min(...vs)<0&&Math.max(...vs)>0))continue;
    const m0=buildModel(spec,level===2?ri(0,6):ri(-6,6));
    if(m0.segs.reduce((c,g)=>c+zerosIn(g,'v').length,0)>MAXCROSS)continue;
    const m=splitZeros(m0,type==='a2v'?null:'v',type==='v2s');
    if(!m)continue;
    if(sValues(m).some(x=>Math.abs(x)>40))continue;
    return m;
  }
}
function makeQuestion(levelIdx){
  const lv=levelIdx===3?ri(0,2):levelIdx;
  let type,model;
  if(lv===0){type=pick(['s2v','v2s']);model=genConst(type);}
  else{type=pick(['v2a','v2s','a2v']);model=genCont(lv+1,type);}
  const segs=model.segs;
  const q={type,model,level:lv};
  if(type==='s2v'){Object.assign(q,{givenQ:'s',ansQ:'v',kind:'step',correct:{vals:segs.map(g=>g.vs)}});}
  if(type==='v2a'){Object.assign(q,{givenQ:'v',ansQ:'a',kind:'step',correct:{vals:segs.map(g=>g.a)}});}
  if(type==='v2s'){Object.assign(q,{givenQ:'v',ansQ:'s',kind:'node',hasShapes:true,correct:{nodes:[model.s0,...segs.map(g=>g.sE)],shapes:segs.map(g=>Math.sign(g.a))}});}
  if(type==='a2v'){Object.assign(q,{givenQ:'a',ansQ:'v',kind:'node',correct:{nodes:[model.v0,...segs.map(g=>g.ve)]}});}
  return q;
}

/* ---------- graph drawing ---------- */
const W=440,H=270,M={l:44,r:18,t:24,b:30},PW=W-M.l-M.r,PH=H-M.t-M.b;
function rangeFor(vals){
  const lo=Math.min(0,...vals),hi=Math.max(0,...vals),span=Math.max(hi-lo,1);
  const tick=[1,2,5,10,20].find(k=>span/k<=7)||20;
  return {lo:lo<-1e-9?Math.floor(lo/tick+1e-9)*tick-tick:0,hi:hi>1e-9?Math.ceil(hi/tick-1e-9)*tick+tick:tick,tick};
}
function scale(T,r){return Object.assign({},r,{T,x:t=>M.l+t/T*PW,y:v=>M.t+(r.hi-v)/(r.hi-r.lo)*PH,ti:px=>(px-M.l)/PW*T,vi:py=>r.hi-(py-M.t)/PH*(r.hi-r.lo)});}
function drawGrid(svg,sc,qty){
  svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const g=el('g',{},svg),pxu=PH/(sc.hi-sc.lo);
  const minor=[1,2,5,10,20].find(k=>sc.tick%k===0&&k*pxu>=7)||sc.tick;
  for(let v=sc.lo;v<=sc.hi+1e-9;v+=minor){const y=sc.y(v);el('line',{x1:M.l,x2:M.l+PW,y1:y,y2:y,class:Math.abs(v/sc.tick-Math.round(v/sc.tick))<1e-9?'gl gm':'gl'},g);}
  for(let t=0;t<=sc.T;t++){const x=sc.x(t);el('line',{x1:x,x2:x,y1:M.t,y2:M.t+PH,class:t%5===0?'gl gm':'gl'},g);}
  const y0=sc.y(0);
  el('line',{x1:M.l,x2:M.l+PW+10,y1:y0,y2:y0,class:'ax'},g);
  el('polygon',{points:`${M.l+PW+14},${y0} ${M.l+PW+6},${y0-4} ${M.l+PW+6},${y0+4}`,class:'axh'},g);
  el('line',{x1:M.l,x2:M.l,y1:M.t+PH,y2:M.t-12,class:'ax'},g);
  el('polygon',{points:`${M.l},${M.t-16} ${M.l-4},${M.t-8} ${M.l+4},${M.t-8}`,class:'axh'},g);
  for(let v=sc.lo;v<=sc.hi+1e-9;v+=sc.tick)el('text',{x:M.l-7,y:sc.y(v)+4,'text-anchor':'end',class:'tk'},g,F(v));
  for(let t=0;t<=sc.T;t++)el('text',{x:sc.x(t),y:M.t+PH+17,'text-anchor':'middle',class:'tk'},g,String(t));
  el('text',{x:M.l+10,y:M.t-6,class:'axt'},g,qty+' / '+UNIT[qty]);
  el('text',{x:M.l+PW+4,y:y0-8,'text-anchor':'end',class:'axt'},g,'t / s');
}
function ptLabel(g,sc,t,v,above,cls){
  let x=sc.x(t),anchor='middle';
  if(t<=1e-9){x+=6;anchor='start';}else if(t>=sc.T-1e-9){x-=6;anchor='end';}
  let y=sc.y(v)+(above?-8:16);
  if(y<M.t+4)y=sc.y(v)+16;if(y>M.t+PH-2)y=sc.y(v)-8;
  el('text',{x,y,'text-anchor':anchor,class:cls},g,F(v));
}
function drawTrue(svg,sc,qty,m,cls,labels){
  const g=el('g',{class:cls},svg),segs=m.segs,seen=new Set();
  const lab=(t,v,above)=>{const k=t+'|'+v;if(seen.has(k))return;seen.add(k);if(labels)ptLabel(g,sc,t,v,above,'plbl');};
  const dot=(t,v)=>el('circle',{cx:sc.x(t),cy:sc.y(v),r:2.8,class:'dot'},g);
  if(qty==='s'){
    let d='';
    segs.forEach(s=>{for(let k=0;k<=24;k++){const u=s.d*k/24,val=s.sS+s.vs*u+0.5*s.a*u*u;d+=(d?'L':'M')+sc.x(s.t0+u).toFixed(1)+' '+sc.y(val).toFixed(1);}});
    el('path',{d,class:'pl'},g);
    segs.forEach((s,i)=>{dot(s.t0,s.sS);lab(s.t0,s.sS,true);if(i===segs.length-1){dot(s.t1,s.sE);lab(s.t1,s.sE,true);}});
  }else if(qty==='v'){
    segs.forEach((s,i)=>{
      el('line',{x1:sc.x(s.t0),y1:sc.y(s.vs),x2:sc.x(s.t1),y2:sc.y(s.ve),class:'pl'},g);
      const prev=segs[i-1],next=segs[i+1];
      if(prev&&!eq(prev.ve,s.vs))el('line',{x1:sc.x(s.t0),x2:sc.x(s.t0),y1:sc.y(prev.ve),y2:sc.y(s.vs),class:'pl jump'},g);
      dot(s.t0,s.vs);dot(s.t1,s.ve);
      if(eq(s.vs,s.ve)){lab((s.t0+s.t1)/2,s.vs,true);}
      else{
        lab(s.t0,s.vs,prev&&!eq(prev.ve,s.vs)?s.vs>prev.ve:s.ve<s.vs);
        lab(s.t1,s.ve,next&&!eq(next.vs,s.ve)?s.ve>next.vs:s.ve>s.vs);
      }
    });
  }else{
    segs.forEach((s,i)=>{
      el('line',{x1:sc.x(s.t0),y1:sc.y(s.a),x2:sc.x(s.t1),y2:sc.y(s.a),class:'pl'},g);
      if(i&&!eq(segs[i-1].a,s.a))el('line',{x1:sc.x(s.t0),x2:sc.x(s.t0),y1:sc.y(segs[i-1].a),y2:sc.y(s.a),class:'pl jump'},g);
      lab((s.t0+s.t1)/2,s.a,true);
    });
  }
}
function addCursor(svg,sc){el('line',{x1:sc.x(0),x2:sc.x(0),y1:M.t-4,y2:M.t+PH,class:'cursor',visibility:'hidden'},svg);}

/* ---------- state ---------- */
const state={lang:'en',mode:'desc',level:0,n:0,q:null,ans:null,sel:0,status:null,results:null,warn:null,checked:false,solved:false,revealed:false,counted:false,cursorT:0,playing:false};
let stats={tries:0,first:0,streak:0,best:0};
try{const b=JSON.parse(localStorage.getItem('mgl-best')||'0');if(typeof b==='number')stats.best=b;}catch(e){}
function saveBest(){try{localStorage.setItem('mgl-best',JSON.stringify(stats.best));}catch(e){}}
const mstate={n:0,q:null,opts:null,pick:null};
let mstats={tries:0,first:0,streak:0,best:0};
let pstats={tries:0,first:0,streak:0,best:0},dstats={tries:0,first:0,streak:0,best:0};
try{const b=JSON.parse(localStorage.getItem('mgl-best-play')||'0');if(typeof b==='number')pstats.best=b;}catch(e){}
try{const b=JSON.parse(localStorage.getItem('mgl-best-desc')||'0');if(typeof b==='number')dstats.best=b;}catch(e){}
function bump(st,ok,key){st.tries++;if(ok){st.first++;st.streak++;if(st.streak>st.best){st.best=st.streak;try{localStorage.setItem(key,JSON.stringify(st.best));}catch(e){}}}else st.streak=0;}
const MODES=['desc','match','build','play'],MODE_EL={build:'#buildMode',match:'#matchMode',play:'#playMode',desc:'#descMode'};
try{const b=JSON.parse(localStorage.getItem('mgl-best-match')||'0');if(typeof b==='number')mstats.best=b;}catch(e){}
function saveBestM(){try{localStorage.setItem('mgl-best-match',JSON.stringify(mstats.best));}catch(e){}}

function newQuestion(){
  stopPlay();
  state.n++;state.q=makeQuestion(state.level);state.q.levelIdx=state.level;
  const q=state.q,n=q.model.segs.length;
  state.ans=q.kind==='step'?{vals:Array(n).fill(null)}:{nodes:[q.correct.nodes[0],...Array(n).fill(null)],shapes:q.hasShapes?Array(n).fill(null):null};
  state.sel=q.kind==='step'?0:1;
  Object.assign(state,{status:null,results:null,warn:null,checked:false,solved:false,revealed:false,counted:false,cursorT:0});
  state.givenSc=scale(q.model.T,rangeFor(valsOf(q.givenQ,q.model)));
  state.ansSc=scale(q.model.T,rangeFor(valsOf(q.ansQ,q.model)));
  $('#tSlider').max=q.model.T;
  renderAll();
}
const unlocked=()=>state.solved||state.revealed;

  const lv=$('#levels');lv.replaceChildren();
  t.levels.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',state.level===i);b.innerHTML=`<span class="n">${p[0]}</span><span class="d">${p[1]}</span>`;b.onclick=()=>{state.level=i;renderStatic();modeNew(state.mode);};lv.appendChild(b);});
  const md=$('#modes');md.replaceChildren();
  MODES.forEach((key,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',state.mode===key);b.textContent=t.modes[i];b.onclick=()=>setMode(key);md.appendChild(b);});
  MODES.forEach(k=>{$(MODE_EL[k]).hidden=state.mode!==k;});

  document.querySelectorAll('.showlbl').forEach(e=>{e.textContent=t.showG;});
  $('#dCheck').textContent=t.check;$('#dClear').textContent=t.clear;$('#dReveal').textContent=t.reveal;$('#dNext').textContent=t.next;
  $('#dlegDir').textContent=t.dirLabel;$('#dlegMot').textContent=t.motLabel;
  $('#mNext').textContent=t.next;
  $('#bCheck').textContent=t.check;$('#bClear').textContent=t.clear;$('#bReveal').textContent=t.reveal;$('#bNext').textContent=t.next;
  $('#bPlay').textContent=state.playing?t.pause:t.play;
  $('#lockmsg').textContent=t.locked;
}
function renderStats(){const t=T_(),st={build:stats,match:mstats,play:pstats,desc:dstats}[state.mode];$('#stFirst').textContent=t.first(st.first,st.tries);$('#stStreak').textContent=t.streak(st.streak);$('#stBest').textContent=t.best(st.best);}
function renderText(){
  const t=T_(),q=state.q;
  $('#qno').textContent=t.qno(state.n);
  $('#qtype').textContent=`${q.givenQ}–t → ${q.ansQ}–t`;
  $('#prompt').textContent=q.type==='v2s'?t.prompt.v2s(q.model.s0):q.type==='a2v'?t.prompt.a2v(q.model.v0):t.prompt[q.type]();
  $('#how').textContent=t.how[q.kind]+(q.hasShapes?t.how.shape:'');
  $('#capGiven').textContent=t.given(t.g[q.givenQ]);
  $('#capAns').textContent=t.yours(t.g[q.ansQ]);
}
function renderGiven(){
  const q=state.q,svg=$('#gGiven'),sc=state.givenSc;
  drawGrid(svg,sc,q.givenQ);svg.setAttribute('class','graph q-'+q.givenQ);
  svg.setAttribute('aria-label',T_().g[q.givenQ]);
  drawTrue(svg,sc,q.givenQ,q.model,'true',true);addCursor(svg,sc);
}

/* ---------- checking ---------- */
function diagnose(q,s,i){
  const a=state.ans;
  if(q.kind==='step'){
    const x=a.vals[i],c=q.correct.vals[i];if(eq(x,c))return{ok:true,m:[]};let m;
    if(q.type==='s2v'){const D=s.sE-s.sS;
      if(eq(c,0))m=['restS'];else if(eq(x,-c))m=['signV',c];else if(s.d!==1&&eq(x,D))m=['noDivide',D,s.d];else if(eq(x,s.sS)||eq(x,s.sE))m=['readS'];else m=['slopeS'];}
    else{const D=s.ve-s.vs;
      if(eq(c,0))m=['restV'];else if(eq(x,-c))m=['signA',c];else if(s.d!==1&&eq(x,D))m=['noDivide',D,s.d];else if(eq(x,s.vs)||eq(x,s.ve))m=['readV'];else m=['slopeV'];}
    return{ok:false,m:[m]};
  }
  const dx=a.nodes[i+1]-a.nodes[i],dc=q.correct.nodes[i+1]-q.correct.nodes[i],m=[];let ok=true;
  if(!eq(dx,dc)){ok=false;
    if(q.type==='a2v'){if(eq(s.a,0))m.push(['constV']);else if(eq(dx,-dc))m.push(['signDv',s.a]);else if(s.d!==1&&eq(dx,s.a))m.push(['noTimes',s.d]);else m.push(['areaA']);}
    else{if(!eq(dc,0)&&eq(dx,-dc))m.push(['signArea']);else if(eq(dx,s.vs*s.d)||eq(dx,s.ve*s.d))m.push(['rectArea']);else m.push(['areaV']);}
  }
  if(q.hasShapes&&a.shapes[i]!==q.correct.shapes[i]){ok=false;const c=q.correct.shapes[i];m.push([c>0?'shapeUp':c<0?'shapeDown':'shapeStraight']);}
  return{ok,m};
}
function check(){
  const q=state.q,a=state.ans;state.warn=null;
  if(q.kind==='step'&&a.vals.some(v=>v==null))state.warn='step';
  else if(q.kind==='node'&&a.nodes.some(v=>v==null))state.warn='node';
  else if(q.hasShapes&&a.shapes.some(v=>v==null))state.warn='shape';
  if(state.warn){renderFeedback();return;}
  state.results=q.model.segs.map((s,i)=>diagnose(q,s,i));state.status=state.results.map(r=>r.ok);state.checked=true;
  const all=state.results.every(r=>r.ok);
  if(!state.counted&&!state.revealed){state.counted=true;stats.tries++;if(all){stats.first++;stats.streak++;if(stats.streak>stats.best){stats.best=stats.streak;saveBest();}}else stats.streak=0;}
  if(all)state.solved=true;
  renderStats();renderAnswer();renderShapes();renderFeedback();renderTrack();
}
function reveal(){
  if(!state.counted){state.counted=true;stats.tries++;stats.streak=0;}
  state.revealed=true;state.warn=null;renderStats();renderAnswer();renderFeedback();renderTrack();
}

/* ---------- quick match ---------- */
/* One correct graph plus three distractors, each built from a named mistake.
   form: 'curve' (s–t), 'lines' (v–t style, may jump), 'steps' (a–t style). */
const FORM={s:'curve',v:'lines',a:'steps'},QF={curve:'s',lines:'v',steps:'a'};
function mkSeg(t0,d,o){const g={t0,t1:t0+d,d,vs:o.vs??0,a:o.a??0,sS:o.sS??0};g.ve=o.ve??(g.vs+g.a*d);g.sE=g.sS+g.vs*d+0.5*g.a*d*d;return g;}
function formVals(form,segs){if(form==='steps')return segs.map(g=>g.a);if(form==='lines')return segs.flatMap(g=>[g.vs,g.ve]);return sValues({s0:segs[0].sS,segs});}
function sampleForm(form,segs,t){const g=segs.find(x=>t<x.t1)||segs[segs.length-1],u=t-g.t0;
  if(form==='steps')return g.a;if(form==='lines')return g.vs+(g.ve-g.vs)*u/g.d;return g.sS+g.vs*u+0.5*g.a*u*u;}
function signature(o,T){const out=[];for(let t=0.05;t<T;t+=0.1)out.push(sampleForm(o.form,o.segs,t));return out;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function matchOptions(q){
  const m=q.model,G=m.segs,cands=[];
  const add=(form,segs,key,arg)=>cands.push({form,segs,key,arg});
  const steps=vals=>G.map((g,i)=>mkSeg(g.t0,g.d,{a:vals[i],vs:vals[i],ve:vals[i]}));
  const pairs=p=>G.map((g,i)=>mkSeg(g.t0,g.d,{vs:p[i][0],ve:p[i][1]}));
  const nodesL=n=>G.map((g,i)=>mkSeg(g.t0,g.d,{vs:n[i],ve:n[i+1]}));
  const curves=(n,acc)=>G.map((g,i)=>mkSeg(g.t0,g.d,{sS:n[i],a:acc[i],vs:(n[i+1]-n[i])/g.d-0.5*acc[i]*g.d}));
  const cum=(start,ds)=>{const o=[start];ds.forEach(d=>o.push(o[o.length-1]+d));return o;};
  const sN=[m.s0,...G.map(g=>g.sE)],vN=[m.v0,...G.map(g=>g.ve)],acc=G.map(g=>g.a),ds=G.map(g=>g.sE-g.sS);
  const correct={form:FORM[q.ansQ],segs:G,key:'correctWhy'};
  if(q.type==='s2v'){
    add('lines',pairs(G.map(g=>[-g.vs,-g.vs])),'flipV');
    add('lines',pairs(ds.map(d=>[d,d])),'noDivideS');
    add('lines',nodesL(sN),'copyShape');
    add('lines',pairs(G.map(g=>[g.sE,g.sE])),'heightS');
  }else if(q.type==='v2a'){
    add('steps',steps(acc.map(a=>-a)),'flipA');
    add('steps',steps(G.map(g=>g.ve-g.vs)),'noDivideV');
    add('lines',pairs(G.map(g=>[g.vs,g.ve])),'copyShape');
    add('steps',steps(G.map(g=>g.ve)),'heightV');
  }else if(q.type==='v2s'){
    add('curve',curves(sN,acc.map(a=>-a)),'curvature');
    add('curve',curves(cum(m.s0,ds.map(d=>-d)),acc.map(a=>-a)),'flipArea');
    add('curve',curves(cum(m.s0,G.map(g=>g.ve*g.d)),acc),'rectArea');
    add('curve',curves(cum(m.s0,G.map(g=>g.vs*g.d)),acc),'rectArea');
    add('lines',pairs(G.map(g=>[g.vs,g.ve])),'copyShape');
    if(m.s0!==0)add('curve',curves(cum(0,ds),acc),'noInitS');
  }else{
    add('lines',nodesL(cum(m.v0,G.map(g=>-g.a*g.d))),'flipDv');
    add('lines',nodesL(cum(m.v0,acc)),'noTimes');
    add('lines',pairs(acc.map(a=>[a,a])),'copyShape');
    if(m.v0!==0)add('lines',nodesL(cum(0,G.map(g=>g.a*g.d))),'noInitV');
  }
  const perturb=()=>{
    const i=ri(0,G.length-1),d=pick(q.ansQ==='s'?[-4,-2,2,4]:[-2,-1,1,2]);
    if(q.type==='s2v')return{form:'lines',segs:pairs(G.map((g,k)=>k===i?[g.vs+d,g.vs+d]:[g.vs,g.vs])),key:'section',arg:G[i]};
    if(q.type==='v2a')return{form:'steps',segs:steps(acc.map((a,k)=>a+(k===i?d:0))),key:'section',arg:G[i]};
    if(q.type==='a2v'){const n=vN.slice();n[i+1]+=d;return{form:'lines',segs:nodesL(n),key:'point',arg:G[i].t1};}
    const n=sN.slice();n[i+1]+=d;return{form:'curve',segs:curves(n,acc),key:'point',arg:G[i].t1};
  };

  const fits=o=>{if(formVals(o.form,o.segs).some(x=>Math.abs(x)>60))return false;
    const sg=signature(o,m.T);if(sigs.some(s=>s.every((x,i)=>Math.abs(x-sg[i])<0.05)))return false;
    if(chosen.some(c=>c.key===o.key))return false;
    sigs.push(sg);return true;};
  for(const o of shuffle(cands)){if(chosen.length>=4)break;if(fits(o))chosen.push(o);}
  for(let k=0;chosen.length<4&&k<200;k++){const o=perturb();if(o.key==='section'||o.key==='point'){const kk=o.key;o.key='__';if(fits(o)){o.key=kk;chosen.push(o);}}}
  return shuffle(chosen);
}
function newMatch(){
  mstate.n++;const q=makeQuestion(state.level);q.levelIdx=state.level;
  mstate.q=q;mstate.opts=matchOptions(q);mstate.pick=null;
  mstate.givenSc=scale(q.model.T,rangeFor(valsOf(q.givenQ,q.model)));
  mstate.ansSc=scale(q.model.T,rangeFor(mstate.opts.flatMap(o=>formVals(o.form,o.segs))));
  renderStats();renderMatch();
}
function choose(i){
  if(mstate.pick!=null||!mstate.opts[i])return;
  mstate.pick=i;mstats.tries++;
  if(mstate.opts[i].key==='correctWhy'){mstats.first++;mstats.streak++;if(mstats.streak>mstats.best){mstats.best=mstats.streak;saveBestM();}}else mstats.streak=0;
  renderStats();renderMatch();
  try{$('#mNext').focus({preventScroll:true});}catch(e){}
}
function renderMatch(){
  const t=T_(),q=mstate.q,LT='ABCD',done=mstate.pick!=null;
  $('#mqno').textContent=t.qno(mstate.n);
  $('#mqtype').textContent=`${q.givenQ}–t → ${q.ansQ}–t`;
  $('#mprompt').textContent=q.type==='v2s'?t.mprompt.v2s(q.model.s0):q.type==='a2v'?t.mprompt.a2v(q.model.v0):t.mprompt[q.type]();
  $('#mhow').textContent=t.mhow;
  $('#mcapGiven').textContent=t.given(t.g[q.givenQ]);
  const gs=$('#mGiven');drawGrid(gs,mstate.givenSc,q.givenQ);gs.setAttribute('class','graph q-'+q.givenQ);gs.setAttribute('aria-label',t.g[q.givenQ]);
  drawTrue(gs,mstate.givenSc,q.givenQ,q.model,'true',true);
  const box=$('#options');box.replaceChildren();
  mstate.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.type='button';b.id='opt-'+i;
    let cls='opt';if(done){cls+=' done';cls+=o.key==='correctWhy'?' correct':i===mstate.pick?' wrong':' dim';}
    b.className=cls;b.setAttribute('aria-label',t.opt(LT[i]));
    const head=document.createElement('span');head.className='ohead';head.innerHTML=`<span class="lt">${LT[i]}</span><span class="ro">${t.g[q.ansQ]}</span>`;b.appendChild(head);
    const svg=document.createElementNS(NS,'svg');drawGrid(svg,mstate.ansSc,q.ansQ);svg.setAttribute('class','graph q-'+q.ansQ);
    drawTrue(svg,mstate.ansSc,QF[o.form],{segs:o.segs},'true',true);b.appendChild(svg);
    if(done){const p=document.createElement('p');p.className='why';p.textContent=t.mm[o.key](q,o.arg,t);b.appendChild(p);}
    b.onclick=()=>choose(i);box.appendChild(b);
  });
  let h;
  if(!done)h=`<div class="banner">${t.mtip}</div>`;
  else{const c=mstate.opts.findIndex(o=>o.key==='correctWhy');
    h=mstate.pick===c?`<div class="banner good">${t.mright(LT[c])}</div>`:`<div class="banner bad">${t.mwrong(LT[mstate.pick],LT[c])}</div>`;
    h+=`<div class="work"><h3>${t.working}</h3><div class="tbl"><table>${workingRows(q)}</table></div></div>`;}
  $('#mfeedback').innerHTML=h;
}
/* ---------- shared track ---------- */
function buildTrack(svg,m,refLabel){
  svg.replaceChildren();
  const VW=Math.round(Math.max(480,Math.min(860,svg.clientWidth||560))),X0=34,X1=VW-34;svg.setAttribute('viewBox',`0 0 ${VW} 112`);
  const r=rangeFor(sValues(m)),x=s=>X0+(s-r.lo)/(r.hi-r.lo)*(X1-X0),Y=70;
  el('line',{x1:X0-10,x2:X1+10,y1:Y,y2:Y,class:'tr-ax'},svg);
  for(let s=r.lo;s<=r.hi+1e-9;s+=r.tick){el('line',{x1:x(s),x2:x(s),y1:Y,y2:Y+5,class:'tr-ax'},svg);el('text',{x:x(s),y:Y+20,'text-anchor':'middle',class:'tk'},svg,F(s));}
  el('text',{x:X1+10,y:Y+36,'text-anchor':'end',class:'tk'},svg,'s / m');
  const rx=x(0),anc=rx<X0+50?'start':rx>X1-50?'end':'middle';
  el('line',{x1:rx,x2:rx,y1:8,y2:Y,class:'tr-ref'},svg);
  el('text',{x:anc==='start'?rx-4:anc==='end'?rx+4:rx,y:Y+36,'text-anchor':anc,class:'tr-reft'},svg,refLabel);
  const cart=el('g',{},svg);
  el('rect',{x:-15,y:-18,width:30,height:13,rx:3,class:'cart'},cart);
  el('circle',{cx:-8,cy:-3,r:3,class:'wheel'},cart);el('circle',{cx:8,cy:-3,r:3,class:'wheel'},cart);
  const mk=(cls,y)=>({y,line:el('line',{class:cls,y1:y,y2:y},svg),head:el('polygon',{class:cls+'h'},svg),lab:el('text',{class:'arrl '+cls+'t',y:y+4},svg)});
  const av=mk('varrow',42),aa=mk('aarrow',22);
  const vmax=Math.max(1,...m.segs.flatMap(g=>[Math.abs(g.vs),Math.abs(g.ve)])),amax=Math.max(1,...m.segs.map(g=>Math.abs(g.a)));
  const setA=(A,cx,len,label)=>{const parts=[A.line,A.head,A.lab];
    if(Math.abs(len)<4){parts.forEach(e=>e.setAttribute('visibility','hidden'));return;}
    const d=Math.sign(len),x2=cx+len;
    A.line.setAttribute('x1',cx);A.line.setAttribute('x2',x2-d*6);
    A.head.setAttribute('points',`${x2},${A.y} ${x2-d*9},${A.y-5} ${x2-d*9},${A.y+5}`);
    A.lab.setAttribute('x',x2+d*5);A.lab.setAttribute('text-anchor',d>0?'start':'end');A.lab.textContent=label;
    parts.forEach(e=>e.setAttribute('visibility','visible'));};
  return{update(t){const s=sAt(m,t),cx=x(s);cart.setAttribute('transform',`translate(${cx},${Y})`);setA(av,cx,vAt(m,t)/vmax*70,'v');setA(aa,cx,aAt(m,t)/amax*45,'a');}};
}
function motionFor(lv,given){return lv===0?genConst(given==='s'?'s2v':'v2s'):genCont(lv+1,'v2s');}
const lvOf=()=>state.level===3?ri(0,2):state.level;
const r1=x=>F(Math.round(x*10)/10);

/* ---------- play the motion ---------- */
const pstate={n:0,q:null,t:0,playing:false,show:{s:true,v:true,a:true},tasks:[],ti:0,res:null,counted:false,trk:null,sc:{},cur:{}};
function signFlips(fn,T){
  const out=[];let last=0,lastT=0;
  for(let i=0;i<=Math.round(T*100);i++){const t=i/100,x=fn(t),sg=x>1e-6?1:x<-1e-6?-1:0;
    if(sg!==0){if(last!==0&&sg!==last)out.push([lastT,t]);last=sg;lastT=t;}}
  return out;
}
function playTasks(m){
  const tasks=[],pad=([a,b])=>[a-0.25,b+0.25],padI=g=>[g.t0-0.1,g.t1+0.1];
  const turn=signFlips(t=>vAt(m,t),m.T);if(turn.length)tasks.push({key:'turn',iv:turn.map(pad)});
  const ref=signFlips(t=>sAt(m,t),m.T);if(ref.length)tasks.push({key:'passRef',iv:ref.map(pad)});
  let M=0;m.segs.forEach(g=>{M=Math.max(M,Math.abs(g.vs),Math.abs(g.ve));});
  const fast=[];m.segs.forEach(g=>{
    if(g.a===0){if(eq(Math.abs(g.vs),M))fast.push(padI(g));}
    else{if(eq(Math.abs(g.vs),M))fast.push(pad([g.t0,g.t0]));if(eq(Math.abs(g.ve),M))fast.push(pad([g.t1,g.t1]));}});
  if(M>0&&fast.length)tasks.push({key:'fastest',iv:fast});
  const rest=m.segs.filter(g=>g.a===0&&g.vs===0).map(padI);if(rest.length)tasks.push({key:'rest',iv:rest});
  const slow=m.segs.filter(g=>g.a!==0&&(g.vs+g.ve)*g.a<0).map(padI);if(slow.length)tasks.push({key:'slowing',iv:slow});
  return shuffle(tasks);
}
function newPlay(){
  stopPPlay();pstate.n++;
  const m=motionFor(lvOf(),pick(['s','v']));
  pstate.q={model:m,levelIdx:state.level};
  Object.assign(pstate,{t:0,tasks:playTasks(m),ti:0,res:null,counted:false});
  ['s','v','a'].forEach(q=>{pstate.sc[q]=scale(m.T,rangeFor(valsOf(q,m)));});
  $('#pSlider').max=m.T;
  renderStats();renderPlay();
}
function renderPlay(){
  const t=T_(),m=pstate.q.model,task=pstate.tasks[pstate.ti],res=pstate.res,showBand=res&&(res.ok||res.shown);
  $('#pqno').textContent=t.pqno(pstate.n);$('#phow').textContent=t.phow;
  ['s','v','a'].forEach(q=>{
    const svg=$('#pg-'+q),sc=pstate.sc[q];
    $('#pcap-'+q).textContent=t.g[q];$('#pshow-'+q).checked=pstate.show[q];
    svg.hidden=!pstate.show[q];$('#phid-'+q).hidden=pstate.show[q];$('#phid-'+q).textContent=t.hidNote;
    drawGrid(svg,sc,q);svg.setAttribute('class','graph pg q-'+q);svg.setAttribute('aria-label',t.g[q]);
    if(showBand)task.iv.forEach(([a,b])=>{const a1=Math.max(0,a),b1=Math.min(m.T,b);el('rect',{x:sc.x(a1),y:M.t,width:sc.x(b1)-sc.x(a1),height:PH,class:'band'},svg);});
    drawTrue(svg,sc,q,m,'true',true);
    pstate.cur[q]={line:el('line',{y1:M.t-4,y2:M.t+PH,class:'cursor'},svg),dot:el('circle',{r:5,class:'dot cdot'},svg)};
  });
  pstate.trk=buildTrack($('#ptrack'),m,t.ref);
  $('#ptaskTitle').textContent=t.pTaskTitle;$('#ptaskNo').textContent=t.pTaskNo(pstate.ti+1,pstate.tasks.length);
  $('#ptask').textContent=t.ptask[task.key];
  $('#pNextTask').textContent=pstate.ti<pstate.tasks.length-1?t.pNextTask:t.pNew;
  $('#pNew').hidden=pstate.ti>=pstate.tasks.length-1;
  let h;
  if(!res)h=`<div class="banner">${t.pHelp}</div>`;
  else if(res.ok)h=`<div class="banner good">${t.pGood(r1(res.t))}</div><p class="why2">${t.pwhy[task.key]}</p>`;
  else if(res.shown)h=`<div class="banner">${t.pShown}</div><p class="why2">${t.pwhy[task.key]}</p>`;
  else h=`<div class="banner bad">${t.pBad(r1(res.t))}</div><p class="why2">${t.pwhy[task.key]}</p>`;
  $('#pfb').innerHTML=h;
  updatePlay();
}
function updatePlay(){
  if(!pstate.q)return;const m=pstate.q.model,t=pstate.t;
  const val={s:sAt(m,t),v:vAt(m,t),a:aAt(m,t)};
  ['s','v','a'].forEach(q=>{const c=pstate.cur[q],sc=pstate.sc[q];if(!c)return;const x=sc.x(t);
    c.line.setAttribute('x1',x);c.line.setAttribute('x2',x);c.dot.setAttribute('cx',x);c.dot.setAttribute('cy',sc.y(val[q]));});
  pstate.trk.update(t);
  $('#pT').textContent=(Math.round(t*10)/10).toFixed(1);
  $('#pS').textContent=r1(val.s);$('#pV').textContent=r1(val.v);$('#pA').textContent=F(val.a);
  $('#pSlider').value=t;
}
let praf=null;
function stopPPlay(){pstate.playing=false;if(praf)cancelAnimationFrame(praf);praf=null;$('#pPlay').textContent=T_().play;}
function playP(){
  if(pstate.playing){stopPPlay();return;}
  const T=pstate.q.model.T;if(pstate.t>=T-1e-6)pstate.t=0;
  pstate.playing=true;$('#pPlay').textContent=T_().pause;let last=null;
  const step=ts=>{if(!pstate.playing)return;if(last!=null)pstate.t=Math.min(T,pstate.t+(ts-last)/1000*parseFloat($('#pSpeed').value));last=ts;updatePlay();
    if(pstate.t>=T){stopPPlay();return;}praf=requestAnimationFrame(step);};
  praf=requestAnimationFrame(step);
}
function setPT(t){stopPPlay();pstate.t=Math.max(0,Math.min(pstate.q.model.T,Math.round(t*20)/20));updatePlay();}
function checkTime(){
  stopPPlay();const task=pstate.tasks[pstate.ti],t=pstate.t;
  const ok=task.iv.some(([a,b])=>t>=a-1e-9&&t<=b+1e-9);
  if(!pstate.counted){pstate.counted=true;bump(pstats,ok,'mgl-best-play');}
  pstate.res={ok,t,shown:false};renderStats();renderPlay();
}
function showMe(){
  const task=pstate.tasks[pstate.ti];
  if(!pstate.counted){pstate.counted=true;bump(pstats,false,'mgl-best-play');}
  const [a,b]=task.iv[0];setPT((Math.max(0,a)+Math.min(pstate.q.model.T,b))/2);
  pstate.res={ok:false,t:pstate.t,shown:true};renderStats();renderPlay();
}
function nextTask(){if(pstate.ti<pstate.tasks.length-1){pstate.ti++;pstate.res=null;pstate.counted=false;renderPlay();}else newPlay();}
['s','v','a'].forEach(q=>{
  const svg=$('#pg-'+q);let down=false;
  const at=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const r=p.matrixTransform(svg.getScreenCTM().inverse());setPT(pstate.sc[q].ti(r.x));};
  svg.addEventListener('pointerdown',e=>{down=true;at(e);});
  svg.addEventListener('pointermove',e=>{if(down)at(e);});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>svg.addEventListener(n,()=>{down=false;}));
  $('#pshow-'+q).addEventListener('change',e=>{pstate.show[q]=e.target.checked;renderPlay();});
});
$('#pPlay').onclick=playP;$('#pCheck').onclick=checkTime;$('#pShow').onclick=showMe;$('#pNextTask').onclick=nextTask;$('#pNew').onclick=newPlay;
$('#pSlider').addEventListener('input',e=>setPT(parseFloat(e.target.value)));

/* ---------- describe the motion ---------- */
const dstate={n:0,q:null,ans:[],checked:false,results:null,revealed:false,counted:false,warn:false,sel:0,sc:null};
function descKey(g){const v=g.vs+g.ve;if(g.a===0&&g.vs===0)return{dir:'rest',mot:null};return{dir:v>0?'pos':'neg',mot:g.a===0?'uniform':v*g.a>0?'up':'down'};}
function newDesc(){
  dstate.n++;const givenQ=pick(['s','v']);const m=motionFor(lvOf(),givenQ);
  dstate.q={model:m,givenQ,levelIdx:state.level,correct:m.segs.map(descKey)};
  dstate.ans=m.segs.map(()=>({dir:null,mot:null}));
  Object.assign(dstate,{checked:false,results:null,revealed:false,counted:false,warn:false,sel:0});
  dstate.sc=scale(m.T,rangeFor(valsOf(givenQ,m)));
  renderStats();renderDesc();
}
function renderDesc(){
  const t=T_(),q=dstate.q,m=q.model,sc=dstate.sc,G=t.g[q.givenQ];
  $('#dqno').textContent=t.qno(dstate.n);$('#dqtype').textContent=G;
  $('#dprompt').textContent=t.dprompt(G);$('#dhow').textContent=t.dhow;$('#dcap').textContent=t.given(G);
  const svg=$('#dGiven');drawGrid(svg,sc,q.givenQ);svg.setAttribute('class','graph q-'+q.givenQ);svg.setAttribute('aria-label',G);
  const sg=m.segs[dstate.sel];if(sg)el('rect',{x:sc.x(sg.t0),y:M.t,width:sc.x(sg.t1)-sc.x(sg.t0),height:PH,class:'selcol',opacity:.6},svg);
  drawTrue(svg,sc,q.givenQ,m,'true',true);
  const box=$('#drows');box.replaceChildren();
  m.segs.forEach((g,i)=>{
    const a=dstate.ans[i],r=dstate.results&&dstate.results[i];
    const row=document.createElement('div');row.className='drow'+(i===dstate.sel?' sel':'')+(r?(r.ok?' ok':' bad'):'');
    row.addEventListener('click',()=>{if(dstate.sel!==i){dstate.sel=i;renderDesc();}});
    row.innerHTML=`<div class="dhead"><span class="sec">${t.sec(g.t0,g.t1)}</span><span class="mk">${r?(r.ok?'✓':'✗'):''}</span></div>`;
    const groups=document.createElement('div');groups.className='dgroups';
    const mkGroup=(label,opts,cur,dis,set)=>{const grp=document.createElement('div');grp.className='seg';grp.setAttribute('role','group');grp.setAttribute('aria-label',label);
      Object.keys(opts).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=opts[k];b.setAttribute('aria-pressed',cur===k);b.disabled=dis;
        b.onclick=e=>{e.stopPropagation();dstate.sel=i;set(k);dstate.results=null;dstate.checked=false;dstate.warn=false;renderDesc();renderDescFb();};grp.appendChild(b);});
      groups.appendChild(grp);};
    mkGroup(t.dirLabel,t.dirs,a.dir,false,k=>{a.dir=k;if(k==='rest')a.mot=null;});
    mkGroup(t.motLabel,t.mots,a.mot,a.dir==='rest',k=>{a.mot=k;});
    row.appendChild(groups);
    if(r&&!r.ok){const p=document.createElement('p');p.className='hint';p.textContent=r.hints.join(' ');row.appendChild(p);}
    box.appendChild(row);
  });
  renderDescFb();
}
function renderDescFb(){
  const t=T_(),q=dstate.q;let h='';
  if(dstate.warn)h+=`<div class="banner">${t.dneed}</div>`;
  else if(dstate.checked&&dstate.results){const bad=dstate.results.filter(r=>!r.ok).length;
    h+=bad?`<div class="banner bad">${t.someWrong(bad,dstate.results.length)}</div>`:`<div class="banner good">${t.allRight}</div>`;}
  if(dstate.revealed)h=`<div class="banner">${t.drevealed}</div>`+h;
  const solved=dstate.results&&dstate.results.every(r=>r.ok);
  if(solved||dstate.revealed)h+=`<div class="work"><h3>${t.dmodel}</h3><ul class="items">`+q.model.segs.map((g,i)=>`<li><span class="sec">${t.sec(g.t0,g.t1)}</span><span class="mk"></span><p>${t.sentence(g,q.givenQ,q.correct[i])}</p></li>`).join('')+'</ul></div>';
  if(!h)h=`<div class="banner">${t.tip}</div>`;
  $('#dfb').innerHTML=h;
}
function checkDesc(){
  const q=dstate.q,t=T_();
  if(dstate.ans.some(a=>!a.dir||(a.dir!=='rest'&&!a.mot))){dstate.warn=true;renderDescFb();return;}
  dstate.warn=false;
  dstate.results=q.correct.map((c,i)=>{const a=dstate.ans[i],hints=[];
    const dirOk=a.dir===c.dir,motOk=c.dir==='rest'||a.dir==='rest'||a.mot===c.mot;
    const H=q.givenQ==='v'?t.dh.dirV:t.dh.dirS,HM=q.givenQ==='v'?t.dh.motV:t.dh.motS;
    if(!dirOk)hints.push(H[c.dir]);if(!motOk)hints.push(HM[c.mot]);
    return{ok:dirOk&&motOk,hints};});
  dstate.checked=true;
  const all=dstate.results.every(r=>r.ok);
  if(!dstate.counted&&!dstate.revealed){dstate.counted=true;bump(dstats,all,'mgl-best-desc');}
  renderStats();renderDesc();
}
function revealDesc(){if(!dstate.counted){dstate.counted=true;bump(dstats,false,'mgl-best-desc');}dstate.revealed=true;dstate.warn=false;renderStats();renderDescFb();}
function clearDesc(){dstate.ans=dstate.q.model.segs.map(()=>({dir:null,mot:null}));dstate.results=null;dstate.checked=false;dstate.warn=false;renderDesc();}
$('#dCheck').onclick=checkDesc;$('#dReveal').onclick=revealDesc;$('#dClear').onclick=clearDesc;$('#dNext').onclick=newDesc;

/* ---------- modes ---------- */
function modeQ(k){return{build:state.q,match:mstate.q,play:pstate.q,desc:dstate.q}[k];}
function modeNew(k){({build:newQuestion,match:newMatch,play:newPlay,desc:newDesc})[k]();}
function setMode(key){
  stopPlay();stopPPlay();state.mode=key;renderStatic();
  const q=modeQ(key);if(!q||q.levelIdx!==state.level)modeNew(key);else if(key==='play')renderPlay();
  renderStats();
}
$('#mNext').onclick=newMatch;
document.addEventListener('keydown',e=>{
  if(state.mode!=='match'||e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
  const k=e.key.toLowerCase();let i='1234'.indexOf(k);if(i<0)i='abcd'.indexOf(k);
  if(i>=0&&mstate.pick==null){choose(i);e.preventDefault();}
  else if(k==='n'&&mstate.pick!=null){newMatch();e.preventDefault();}
});

function setLang(l){state.lang=l;if(dstate.checked&&dstate.results){renderAll();checkDesc();}else renderAll();}
$('#lang-en').onclick=()=>setLang('en');
$('#lang-zh').onclick=()=>setLang('zh');

try{const h={'#build':'build','#match':'match','#play':'play','#describe':'desc'}[location.hash];if(h)state.mode=h;}catch(e){}
newQuestion();
if(state.mode!=='build')modeNew(state.mode);
})();
</script>
