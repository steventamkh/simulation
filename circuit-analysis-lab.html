<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Practise finding current, voltage, resistance, power and their ratios in series, parallel and mixed circuits for HKDSE Physics.">
<title>Circuit Analysis Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:16px}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: lab workbench shared with Motion Graph Lab. Level strip on top, circuit on graph paper at left, question and answer at right. */
:root{
  --bg:#EDF2F6; --panel:#FFFFFF; --ink:#14212C; --muted:#56687A; --line:#D3DDE6;
  --grid:#E4EBF1; --wire:#1F3242; --flow:#D2620E; --lamp:#F4B400; --hl:#FFE9A8; --hl-line:#C98A00;
  --accent:#0E6B7B; --accent-ink:#FFFFFF; --accent-soft:#E0F0F2;
  --good:#1D8048; --good-bg:#E2F3E9; --bad:#C2352B; --bad-bg:#FBE7E5; --info-bg:#E5EDF4;
  --f-display:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans HK','Noto Sans TC','Noto Sans CJK TC',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,'PingFang HK','Microsoft JhengHei','Noto Sans CJK TC',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --panel:#16212B; --ink:#E4ECF2; --muted:#93A6B7; --line:#273541;
  --grid:#1C2833; --wire:#C6D4DF; --flow:#F39A48; --lamp:#FFC933; --hl:#4A3C10; --hl-line:#E5B93A;
  --accent:#3BB3C3; --accent-ink:#06222A; --accent-soft:#14323A;
  --good:#4CC97F; --good-bg:#12301F; --bad:#F2766B; --bad-bg:#3A1A18; --info-bg:#1A2733;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --panel:#16212B; --ink:#E4ECF2; --muted:#93A6B7; --line:#273541;
  --grid:#1C2833; --wire:#C6D4DF; --flow:#F39A48; --lamp:#FFC933; --hl:#4A3C10; --hl-line:#E5B93A;
  --accent:#3BB3C3; --accent-ink:#06222A; --accent-soft:#14323A;
  --good:#4CC97F; --good-bg:#12301F; --bad:#F2766B; --bad-bg:#3A1A18; --info-bg:#1A2733;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 var(--f-body)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:600}
a{color:var(--accent)}
.eyebrow{margin:0 0 4px;font:700 .75rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.eyebrow a{color:inherit;text-decoration:none}
.eyebrow a:hover{text-decoration:underline}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:42px;padding:7px 14px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;font-weight:700;font-size:.9rem;padding:8px 14px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

.levels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.levels .n{font:700 .95rem var(--f-display)}
.levels .d{font-size:.78rem;color:var(--muted);line-height:1.25}
.levels button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.levels button[aria-pressed="true"] .n{color:var(--accent)}
.levels button:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:900px){.levels{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}

.strip{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.9rem}
.strip label{display:flex;gap:6px;align-items:center;font-weight:700}
select{min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-weight:400}
.note{color:var(--muted);font-size:.85rem}
.stats{font:700 .78rem var(--f-mono);display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;font-variant-numeric:tabular-nums}
.stats span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}

.drawer{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.drawer>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.drawer p{margin:0}
.code{font:700 2.3rem var(--f-mono);letter-spacing:.06em;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text]{min-height:42px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
input.code-in{font-family:var(--f-mono);text-transform:uppercase;width:10em;max-width:100%}
.err{color:var(--bad);font-size:.88rem;margin:0}
@media (max-width:640px){.drawer{grid-template-columns:minmax(0,1fr)}}

.stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
.board,.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.board{padding:10px;display:flex;flex-direction:column;gap:10px}
.paper{overflow-x:auto;border-radius:8px;background-color:var(--panel);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.paper svg{display:block;width:100%;min-width:300px;height:auto;max-height:64vh;margin:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.qpanel{padding:14px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:700 .72rem var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.stem{margin:0;font-size:1.12rem;line-height:1.4}
.cond{margin:0;color:var(--muted);font-size:.86rem}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ans input{width:9em;font:700 1.05rem var(--f-mono)}
.unit{font:700 1rem var(--f-mono)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font:700 1rem var(--f-mono);width:100%}
.opt b{color:var(--accent);font-family:var(--f-display)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.8rem;color:var(--muted)}
td input[type=text]{width:4.6em;min-height:36px;padding:4px 6px;font:500 .92rem var(--f-mono)}
td input.ok{background:var(--good-bg);border-color:var(--good)}
td input.no{background:var(--bad-bg);border-color:var(--bad)}
.pred{display:grid;gap:8px}
.pred .pr{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.pred .lb{font-weight:700;min-width:7em}
.pred .seg button{font-size:.82rem;padding:6px 9px}
.seg button.ok{background:var(--good);color:var(--panel)}
.seg button.no{background:var(--bad);color:var(--panel)}
.fb{border-radius:8px;padding:9px 12px;font-size:.95rem}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb.info{background:var(--info-bg)}
.fb b{font-family:var(--f-display)}
.hints{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.hints li{background:var(--info-bg);border-radius:8px;padding:7px 11px;font-size:.93rem}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font:500 .8rem var(--f-mono)}
.checks li::before{content:"✓ ";color:var(--good);font-weight:700}
h3{font-size:.95rem}
.walk{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.walk p{margin:0;font-size:1.02rem}
.prog{font:700 .75rem var(--f-mono);color:var(--muted)}
.timer{font:700 1.5rem var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.timer.up{color:var(--bad)}
.sl{display:grid;grid-template-columns:5.2em minmax(0,1fr) 4.2em;align-items:center;gap:8px;font-size:.92rem}
.sl b{font-family:var(--f-mono);font-size:.85rem}
.sl output{font:700 .85rem var(--f-mono);text-align:right}
.sl input{width:100%;min-height:30px;accent-color:var(--accent)}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.92rem}
summary{cursor:pointer;font-weight:700}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;margin-top:8px}

/* circuit drawing */
.w{stroke:var(--wire);stroke-width:2;fill:none;stroke-linecap:round}
.sym{stroke:var(--wire);stroke-width:2;fill:var(--panel)}
.t{font:700 13px var(--f-body);fill:var(--ink);text-anchor:middle}
.tv{font:500 11.5px var(--f-mono);fill:var(--muted);text-anchor:middle}
.tr{font:700 11.5px var(--f-mono);fill:var(--flow);text-anchor:middle}
.tm{font:700 13px var(--f-mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.dot{fill:var(--wire)}
.hlr{fill:var(--hl);stroke:var(--hl-line);stroke-width:1.5;stroke-dasharray:5 3}
.eqbox{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.swh{cursor:pointer}
.swh rect{fill:transparent}
.flow{stroke:var(--flow);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 15;fill:none}
.ibox{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
@media (prefers-reduced-motion:no-preference){
  .flow{animation:fl var(--d,1.5s) linear infinite}
  @keyframes fl{to{stroke-dashoffset:-16}}
  .paper:not(.live) svg{animation:fade .28s ease-out}
  @keyframes fade{from{opacity:.25}to{opacity:1}}
}

/* projector */
html.proj{font-size:20px}
html.proj .wrap{max-width:none}
html.proj .paper svg{max-height:70vh;max-width:none!important}
html.proj .stage{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
html.proj .levels,html.proj .strip label,html.proj details{display:none}
html.proj .ansin{display:none}
@media (max-width:860px){html.proj{font-size:16px}html.proj .stage{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow"><a href="./">HKDSE Physics · Simulation Lab</a></p>
      <h1>Circuit Analysis Lab</h1>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language 語言">
        <button id="lEn" aria-pressed="true">English</button>
        <button id="lZh" aria-pressed="false" lang="zh-Hant">中文</button>
      </div>
      <div class="seg" role="group" aria-label="Mode">
        <button id="mPractice" aria-pressed="true">Practice</button>
        <button id="mExplore" aria-pressed="false">Explore</button>
      </div>
      <button class="btn" id="bClass" aria-pressed="false">Class set</button>
      <button class="btn" id="bProj" aria-pressed="false">Projector</button>
    </div>
  </header>

  <section class="drawer" id="drawer" hidden aria-label="Class set">
    <div>
      <h2 id="hCreate">Teacher: create a set</h2>
      <p class="note" id="pCreate">Ten questions from the level and format selected below. Everyone who enters this code gets the same questions in the same order.</p>
      <div class="row"><button class="btn primary" id="bCreate">Create code</button><span class="code" id="newCode"></span></div>
    </div>
    <div>
      <h2 id="hJoin">Student: join a set</h2>
      <label class="note" id="lCode" for="codeIn">Enter the code on the board.</label>
      <form class="row" id="fJoin"><input type="text" class="code-in" id="codeIn" placeholder="2X-K7QF" autocomplete="off" aria-label="Class code"><button class="btn" type="submit">Join</button></form>
      <p class="err" id="codeErr" hidden></p>
    </div>
  </section>

  <nav class="levels" id="levels" aria-label="Level"></nav>

  <div class="strip">
    <label for="fmt"><span id="lFmt">Format</span>
      <select id="fmt">
        <option value="X">Mixed</option><option value="V">Find the value</option><option value="R">Find the ratio</option><option value="T">Complete the table</option><option value="M">DSE-style MC</option>
      </select></label>
    <span class="note" id="fmtNote"></span>
    <div class="stats" id="stats" aria-live="polite"></div>
  </div>

  <main class="stage">
    <section class="board" aria-label="Circuit">
      <div class="paper" id="paper"></div>
      <div class="bar" id="boardBar"></div>
      <div class="walk" id="walk" hidden aria-live="polite"></div>
    </section>
    <aside class="qpanel" id="qpanel"></aside>
  </main>

  <details>
    <summary>English–Chinese terms 中英詞彙</summary>
    <div class="gloss" id="gloss"></div>
  </details>
</div>

<script id="core">
/* ============ Language: every piece of text goes through L(english, chinese) ============ */
let LANG='en';
const L=(en,zh)=>LANG==='zh'?zh:en;

/* ============ Exact fractions, so answers never suffer rounding error ============ */
const gcdB=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b)[a,b]=[b,a%b];return a};
class Fr{
  constructor(n,d=1n){n=BigInt(n);d=BigInt(d);if(d<0n){n=-n;d=-d}const g=gcdB(n,d)||1n;this.n=n/g;this.d=d/g}
  add(o){return new Fr(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){return new Fr(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){return new Fr(this.n*o.n,this.d*o.d)}
  div(o){return new Fr(this.n*o.d,this.d*o.n)}
  eq(o){return this.n===o.n&&this.d===o.d}
  cmp(o){const x=this.n*o.d-o.n*this.d;return x<0n?-1:x>0n?1:0}
  get zero(){return this.n===0n}
  get v(){return Number(this.n)/Number(this.d)}
}
const F=x=>new Fr(Math.round(x*100),100);
const ZERO=F(0),ONE=F(1);

/* ============ Seeded random numbers, so a class code gives everyone the same set ============ */
const seeded=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hashStr=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const shuffle=(r,a)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SUB='₀₁₂₃₄₅₆₇₈₉';
const sub=n=>String(n).split('').map(d=>SUB[d]).join('');

/* ============ Circuit tree: L load, A ammeter, W switch, S series, P parallel ============ */
let NID=0;
function build(spec,labelFn){
  let k=0;
  const go=s=>{
    if(s==='x'){k++;return{t:'L',id:++NID,kind:'R',num:k,label:labelFn(k),R:ONE}}
    if(s==='A')return{t:'A',id:++NID,label:'A'};
    if(s==='so'||s==='sc')return{t:'W',id:++NID,label:'S',closed:s==='sc'};
    return{t:s[0],id:++NID,kids:s.slice(1).map(go)};
  };
  return go(spec);
}
const clone=n=>{if(!n)return n;const c={...n};if(n.kids)c.kids=n.kids.map(clone);return c};
const walk=(n,f)=>{f(n);(n.kids||[]).forEach(k=>walk(k,f))};
const allNodes=n=>{const a=[];walk(n,x=>a.push(x));return a};
const loads=n=>allNodes(n).filter(x=>x.t==='L');
const findId=(n,id)=>allNodes(n).find(x=>x.id===id);

function eff(n){
  if(n.t==='L'){n._R=n.R}
  else if(n.t==='A'){n._R=ZERO}
  else if(n.t==='W'){n._R=n.closed?ZERO:null}
  else{
    n.kids.forEach(eff);
    if(n.t==='S'){n._R=n.kids.some(k=>k._R===null)?null:n.kids.reduce((s,k)=>s.add(k._R),ZERO)}
    else{
      const on=n.kids.filter(k=>k._R!==null);
      if(!on.length)n._R=null;
      else if(on.some(k=>k._R.zero))n._R=ZERO;
      else n._R=ONE.div(on.reduce((s,k)=>s.add(ONE.div(k._R)),ZERO));
    }
  }
}
function share(n,V,I){
  n.V=V;n.I=I;
  if(n.t==='L'||n.t==='A'||n.t==='W'){n.P=V.mul(I);return}
  if(n.t==='S'){
    if(n._R===null)n.kids.forEach(k=>share(k,k._R===null?V:ZERO,ZERO));
    else n.kids.forEach(k=>share(k,I.mul(k._R),I));
  }else{
    const shorts=n.kids.filter(k=>k._R!==null&&k._R.zero);
    if(shorts.length){let first=true;n.kids.forEach(k=>{const isS=k._R!==null&&k._R.zero;share(k,ZERO,isS&&first?I:ZERO);if(isS)first=false})}
    else n.kids.forEach(k=>share(k,V,k._R===null?ZERO:V.div(k._R)));
  }
}
/* Solves the whole circuit and stores V, I and P on every node. */
function solve(c){
  eff(c.tree);
  const r=c.r||ZERO;
  c.short=false;
  if(c.tree._R===null){c.It=ZERO;c.Rt=null}
  else{
    const tot=c.tree._R.add(r);
    c.Rt=c.tree._R;
    if(tot.zero){c.short=true;c.It=ZERO}else c.It=c.emf.div(tot);
  }
  c.Vt=c.emf.sub(c.It.mul(r));
  share(c.tree,c.Vt,c.It);
  return c;
}
/* Removes ideal meters and switches so only the loads remain. */
function strip(n){
  if(n.t==='L'){const c=clone(n);delete c.vm;return c}
  if(n.t==='A')return'wire';
  if(n.t==='W')return n.closed?'wire':'open';
  const ks=n.kids.map(strip);
  if(n.t==='S'){
    if(ks.includes('open'))return'open';
    const f=ks.filter(k=>k!=='wire');
    if(!f.length)return'wire';
    if(f.length===1)return f[0];
    return{t:'S',id:n.id,kids:f.flatMap(k=>k.t==='S'?k.kids:[k])};
  }
  const f=ks.filter(k=>k!=='open');
  if(f.includes('wire'))return'wire';
  if(!f.length)return'open';
  if(f.length===1)return f[0];
  return{t:'P',id:n.id,kids:f};
}
const expr=n=>{
  if(n.t==='L')return n.label;
  return n.kids.map(k=>k.t==='L'||k.t===n.t?expr(k):'('+expr(k)+')').join(n.t==='S'?' + ':' ∥ ');
};

/* ============ Number and symbol formatting ============ */

  2:[['S','x',['P','x','x']],['P',['S','x','x'],'x'],['S','x',['P','x','x'],'x'],['S',['P','x','x'],'x']],

  6:[['S','x'],['S','x','x'],['P','x','x'],['S','x',['P','x','x']],['P',['S','x','x'],'x']]

const RVALS=[1,2,3,4,5,6,8,10,12,15,20,24,30];
const EMFS=[1.5,3,4.5,6,9,12,15,18,20,24,30,36];
const dp2=f=>{const x=f.mul(F(100));return x.d===1n};

function makeCircuit(level,r,style){
  const bulb=style==='B';
  const label=k=>bulb?'B'+sub(k):'R'+sub(k);
  for(let tryN=0;tryN<3000;tryN++){
    const spec=pick(r,TEMPLATES[level]);
    const tree=build(spec,label);
    const ls=loads(tree);
    const rs=ls.map(()=>pick(r,RVALS));
    if(new Set(rs).size<2)continue;
    ls.forEach((l,i)=>{l.R=F(rs[i]);l.kind=bulb?'B':'R'});
    const c={tree,emf:F(pick(r,EMFS)),r:null,level,bulb};
    if(level===6)c.r=F(pick(r,[.5,1,1.5,2]));

}
function makeSym(r,identical){
  const LBL='XYZUW';
  for(let t=0;t<2000;t++){
    const spec=pick(r,TEMPLATES[4]);
    const tree=build(spec,k=>identical?LBL[k-1]:'R'+sub(k));
    const ls=loads(tree);
    ls.forEach(l=>{l.R=identical?ONE:F(pick(r,[1,1,2,3,4,6]));l.kind=identical?'B':'R'});
    if(!identical&&new Set(ls.map(l=>l.R.v)).size<2)continue;
    const c={tree,emf:ONE,r:null,level:4,sym:true,identical};
    solve(c);
    if(Math.max(...intRatio(ls.map(l=>l.P)))<=48&&Math.max(...intRatio(ls.map(l=>l.I)))<=24&&Math.max(...intRatio(ls.map(l=>l.V)))<=24)return c;
  }
  throw new Error('no sym circuit');
}
function decorate(c,r){
  const t=c.tree;
  if(r()<.65){
    const a={t:'A',id:++NID,label:'A'};
    if(t.t==='S')t.kids.unshift(a);else c.tree={t:'S',id:++NID,kids:[a,t]};
  }
  const ps=allNodes(c.tree).filter(n=>n.t==='P');
  if(ps.length&&r()<.5){
    const p=pick(r,ps),i=Math.floor(r()*p.kids.length),k=p.kids[i],a={t:'A',id:++NID,label:'A'};
    if(k.t==='S')k.kids.unshift(a);else p.kids[i]={t:'S',id:++NID,kids:[a,k]};
  }
  const am=allNodes(c.tree).filter(n=>n.t==='A');
  am.forEach((a,i)=>a.label=am.length>1?'A'+sub(i+1):'A');
  if(r()<.6){

/* Level 5: predict the change */
const PRED=[
  {spec:['S','A','x',['P','x',['S','so','x']]],act:'closed',vm:1},
  {spec:['S','A','x',['P','x','so']],act:'closed',vm:1},
  {spec:['S','A',['P','x',['S','so','x']]],act:'closed',vm:0},
  {spec:['S','A','x',['P','x',['S','sc','x']]],act:'opened',vm:0},
  {spec:['S','A',['P',['S','x','x'],['S','so','x']]],act:'closed',vm:0},
  {spec:['S','A',['P','x',['S','x',['P','x','so']]]],act:'closed',vm:1},
  {spec:['S','A','x',['P','x','sc']],act:'opened',vm:1},
  {spec:['S','A','x',['P',['S','x','so'],'x','x']],act:'closed',vm:2}

const wd=d=>({up:L('Increases','增加'),down:L('Decreases','減少'),same:L('No change','不變')})[d];
const dirOf=(a,b)=>{const k=b.cmp(a);return k>0?'up':k<0?'down':'same'};

    cond:L('Ideal meters. The cell has negligible internal resistance, so its p.d. V stays fixed. Each bulb has constant resistance R.','所有電錶均為理想電錶。電池的內阻可忽略不計，所以其電勢差 V 保持不變。每個燈泡的電阻 R 保持不變。'),
    items:rows,ansText:rows.map(i=>L(`${i.label}: ${wd(i.dir)}`,`${i.label}：${wd(i.dir)}`)).join(L('; ','；')),
    hints:[L('Draw the circuit again for the new switch position. A closed switch across a bulb short-circuits it. An open switch removes its branch.','按開關的新位置重畫電路。與燈泡並聯的開關閉合時，燈泡會被短路。開關斷開時，該支路等於不存在。'),L('Find the new total resistance first. The total current is V ÷ R(total), because the cell p.d. is fixed.','先求新的總電阻。電池的電勢差不變，所以總電流 = V ÷ 總電阻。'),L('Then find the p.d. across each group. A bulb directly across the ideal cell always has the full p.d., so it does not change.','再求每組兩端的電勢差。直接接在理想電池兩端的燈泡，其電勢差等於電池的電勢差，所以不會改變。')]};

/* Level 6: internal resistance */
function internalQ(c,r){
  const E=c.emf,rr=c.r,It=c.It,Vt=c.Vt,R=c.Rt;
  c.termV=true;

  const ms=[];
  const base={skill:L('Internal resistance','內阻'),cond:L('Ideal meters. The voltmeter is connected across the terminals of the cell.','所有電錶均為理想電錶。伏特計接在電池的兩極之間。')};
  const mk=(stem,a,unit,h2,final)=>({...base,kind:'num',stem,ans:a.v,unit,ansText:num(a.v)+' '+unit,mistakes:cleanM(ms,a.v),hints:[h1,h2,firstStepHint(c)],finalText:final});
  if(kind==='I'){
    addMistake(ms,E.div(R),L('That leaves out the internal resistance. Use I = ε / (R + r).','這沒有計算內阻。請用 I = ε / (R + r)。'));
    addMistake(ms,E.div(rr),L('That uses only the internal resistance. That is the short-circuit current.','這只用了內阻，得出的是短路電流。'));
    return mk(L('Find the current through the cell.','求通過電池的電流。'),It,'A',L('ε = I(R + r), where R is the external resistance.','ε = I(R + r)，其中 R 是外電阻。'),`I = ε / (R + r) = ${num(E.v)} / (${num(R.v)} + ${num(rr.v)}) = ${fmtI(It)}${L('.','。')}`);
  }
  if(kind==='tv'){
    addMistake(ms,E,L('The terminal p.d. equals the e.m.f. only when no current flows. Here some p.d. is lost across r.','只有沒有電流時，端電壓才等於電動勢。這裏有部分電勢差降落在 r 上。'));
    addMistake(ms,It.mul(rr),L('That is the lost p.d. across r. The terminal p.d. is what remains of the e.m.f.','這是降落在 r 上的電勢差。端電壓是電動勢減去這部分後的餘額。'));
    return mk(L('Find the reading of the voltmeter.','求伏特計的讀數。'),Vt,'V',L('Terminal p.d. V = ε − Ir.','端電壓 V = ε − Ir。'),`V = ε − Ir = ${num(E.v)} − ${num(It.v)} × ${num(rr.v)} = ${fmtV(Vt)}${L('.','。')}`);
  }
  if(kind==='lost'){
    const lost=It.mul(rr);
    addMistake(ms,Vt,L('That is the terminal p.d. The lost p.d. is the part across r.','這是端電壓。損失的電勢差是降落在 r 上的部分。'));
    addMistake(ms,E,L('That is the e.m.f. Only part of it is lost across r.','這是電動勢。只有部分會降落在 r 上。'));
    return mk(L('Find the p.d. lost across the internal resistance.','求內阻上損失的電勢差。'),lost,'V',L('Lost p.d. = Ir.','損失的電勢差 = Ir。'),L(`Lost p.d. = Ir = ${num(It.v)} × ${num(rr.v)} = ${fmtV(lost)}.`,`損失的電勢差 = Ir = ${num(It.v)} × ${num(rr.v)} = ${fmtV(lost)}。`));
  }
  if(kind==='pr'){
    const p=It.mul(It).mul(rr);
    addMistake(ms,E.mul(It),L('That is the total power supplied by the cell. Only part of it is wasted in r.','這是電池供應的總功率。只有部分消耗在 r 上。'));
    addMistake(ms,It.mul(rr),L('I × r gives the lost p.d., not power. Use P = I²r.','I × r 得出的是損失的電勢差，不是功率。請用 P = I²r。'));
    addMistake(ms,Vt.mul(It),L('That is the power delivered to the external circuit.','這是輸送到外電路的功率。'));
    return mk(L('Find the power wasted in the internal resistance.','求內阻消耗的功率。'),p,'W',L('Power in r = I²r.','r 消耗的功率 = I²r。'),`P = I²r = ${num(It.v)}² × ${num(rr.v)} = ${fmtP(p)}${L('.','。')}`);

  }
  if(kind==='short'){
    const m=E.div(rr);
    addMistake(ms,It,L('That is the current in this circuit. Short-circuiting removes the external resistance.','這是現時電路中的電流。短路後，外電阻等於零。'));

  }
  c.hideR=true;c.hideEmf=true;
  addMistake(ms,Vt.div(It),L('That is V ÷ I, which gives the external resistance.','這是 V ÷ I，得出的是外電阻。'));
  addMistake(ms,E.div(It),L('That is ε ÷ I, which gives R + r.','這是 ε ÷ I，得出的是 R + r。'));
  addMistake(ms,Vt.mul(It),L('That multiplies V by I. Use r = (ε − V) / I.','這是 V 乘以 I。請用 r = (ε − V) / I。'));
  const qr=mk(L(`With the circuit disconnected, the voltmeter across the cell reads ${fmtV(E)}. With the circuit connected, it reads ${fmtV(Vt)} and the current from the cell is ${fmtI(It)}. Find the internal resistance r.`,`電路未接通時，接在電池兩端的伏特計讀數為 ${fmtV(E)}。電路接通後，讀數為 ${fmtV(Vt)}，而電池輸出的電流為 ${fmtI(It)}。求內阻 r。`),rr,'Ω',L('Lost p.d. = ε − V, and lost p.d. = Ir.','損失的電勢差 = ε − V，而且損失的電勢差 = Ir。'),`r = (ε − V) / I = (${num(E.v)} − ${num(Vt.v)}) / ${num(It.v)} = ${fmtR(rr)}${L('.','。')}`);

/* The main generator. Same level, format and seed always give the same question, in either language. */
function genQuestion(level,fmt,seed){
  const r=seeded(seed);
  if(level===0)level=1+Math.floor(r()*6);
  let q,c;
  if(level===5){q=predictQ(r);c=q.c}
  else if(level===4){
    const roll=r();
    let want=fmt==='V'?'req':fmt==='R'||fmt==='T'?'ratio':fmt==='M'?(roll<.55?'mcr':roll<.8?'rank':'req'):(roll<.35?'ratio':roll<.6?'mcr':roll<.85?'rank':'req');
    c=makeSym(r,want==='rank');
    if(want==='rank')q=rankQ(c,r);
    else if(want==='req')q=symReqQ(c,r);
    else{q=ratioQ(c,r);if(want==='mcr'&&q.kind==='ratio')q=toMC(q,r)}
    q.cond=L('The cell has negligible internal resistance. V is the p.d. of the cell.','電池的內阻可忽略不計。V 是電池的電勢差。');
  }else if(level===6){
    c=makeCircuit(6,r,r()<.25?'B':'R');
    q=internalQ(c,r);
    if(c.bulb)q.cond+=condBulb();
    if(fmt==='M'||(fmt==='X'&&r()<.3))q=toMC(q,r);
  }else{
    c=makeCircuit(level,r,r()<.3?'B':'R');
    decorate(c,r);
    const roll=r();
    const kind=fmt==='V'?'v':fmt==='R'?'r':fmt==='T'?'t':fmt==='M'?(roll<.6?'mv':'mr'):(roll<.42?'v':roll<.62?'r':roll<.78?'t':roll<.9?'mv':'mr');
    if(kind==='t')q=tableQ(c);
    else if(kind==='r'||kind==='mr'){q=ratioQ(c,r);if(kind==='mr')q=toMC(q,r)}
    else{q=valueQ(c,r);if(kind==='mv')q=toMC(q,r)}
    q.cond=condIdeal()+(c.bulb?condBulb():'');
  }
  q.c=c;q.level=level;
  q.cond=q.cond||condIdeal();
  return q;
}

/* ============ Step-by-step reduction and expansion ============ */
function findInner(n){
  if(n.t==='L')return null;
  for(const k of n.kids){const g=findInner(k);if(g)return g}
  return n.kids.every(k=>k.t==='L')?n:null;
}
function replaceNode(n,id,rep){
  if(n.id===id)return rep;
  if(n.kids)n.kids=n.kids.map(k=>replaceNode(k,id,rep));
  return n;
}
function walkthrough(q){
  if(q.kind==='predict')return predictWalk(q);
  const c=q.c,s=c.sym,steps=[];
  const st=(tree,hl,text,values)=>{const x={tree:clone(tree),emf:c.emf,r:c.r,sym:s,identical:c.identical,hideEmf:c.hideEmf,termV:false};solve(x);steps.push({c:x,hl,text,values})};
  let root=strip(c.tree);
  const hadExtras=allNodes(c.tree).some(n=>n.t==='A'||n.t==='W'||n.vm);
  if(hadExtras)st(root,[],L('Redraw without the meters. An ideal ammeter acts as a wire, and an ideal voltmeter carries no current.','重畫電路，略去電錶。理想安培計相當於導線，理想伏特計沒有電流通過。'),false);
  const recs=[];let k=0;
  while(root.t!=='L'){
    const g=findInner(root),ks=g.kids;
    const R=g.t==='S'?ks.reduce((a,x)=>a.add(x.R),ZERO):ONE.div(ks.reduce((a,x)=>a.add(ONE.div(x.R)),ZERO));
    k++;
    const lab='Req'+sub(k),eqId=++NID;
    const names=ks.map(x=>x.label).join(L(' and ','、'));
    const calc=g.t==='S'?`${lab} = ${ks.map(x=>fmtR(x.R,s).replace(' Ω','')).join(' + ')} = ${fmtR(R,s)}`
      :`1/${lab} = ${ks.map(x=>'1/'+(s&&x.R.d===1n&&x.R.n!==1n?'('+fmtR(x.R,s)+')':fmtR(x.R,s).replace(' Ω',''))).join(' + ')}${L(', so ','，所以 ')}${lab} = ${fmtR(R,s)}`;
    st(root,[g.id],g.t==='S'?L(`${names} are in series. ${calc}.`,`${names} 串聯。${calc}。`):L(`${names} are in parallel. ${calc}.`,`${names} 並聯。${calc}。`),false);
    recs.push({before:clone(root),gid:g.id,type:g.t,lab});
    root=replaceNode(root,g.id,{t:'L',kind:'E',id:eqId,label:lab,R});
  }
  const x={tree:clone(root),emf:c.emf,r:c.r,sym:s};solve(x);
  const tot=c.r?`${fmtR(x.Rt,s)} + ${fmtR(c.r,s)} (r)`:fmtR(x.Rt,s);
  steps.push({c:{...x,identical:c.identical},hl:[root.id],values:true,text:L(`Current from the cell: I = ${fmtV(c.emf,s)} ÷ (${tot}) = ${fmtI(x.It,s)}.`,`電池輸出的電流：I = ${fmtV(c.emf,s)} ÷ (${tot}) = ${fmtI(x.It,s)}。`)+(c.r?L(` Terminal p.d. = ${fmtV(x.Vt,s)}.`,`端電壓 = ${fmtV(x.Vt,s)}。`):'')});
  recs.reverse().forEach(rec=>{
    const y={tree:clone(rec.before),emf:c.emf,r:c.r,sym:s,identical:c.identical};solve(y);
    const g=findId(y.tree,rec.gid);
    const parts=g.kids.map(kid=>g.t==='S'?`V(${kid.label}) = ${fmtI(g.I,s)} × ${fmtR(kid.R,s)} = ${fmtV(kid.V,s)}`:`I(${kid.label}) = ${fmtV(g.V,s)} ÷ ${fmtR(kid.R,s)} = ${fmtI(kid.I,s)}`);
    const intro=g.t==='S'?L(`${rec.lab} splits back into parts in series. Each carries ${fmtI(g.I,s)}.`,`把 ${rec.lab} 還原為串聯的部分，每部分的電流都是 ${fmtI(g.I,s)}。`):L(`${rec.lab} splits back into parallel branches. Each has ${fmtV(g.V,s)} across it.`,`把 ${rec.lab} 還原為並聯的支路，每條支路兩端的電勢差都是 ${fmtV(g.V,s)}。`);
    steps.push({c:y,hl:g.kids.map(n=>n.id),values:true,text:`${intro} ${parts.join(L('; ','；'))}${L('.','。')}`});
  });
  const fin={...c,tree:clone(c.tree)};solve(fin);
  steps.push({c:fin,hl:[],values:true,text:(q.finalText?q.finalText+' ':'')+L(`Answer: ${q.ansText}`,`答案：${q.ansText}`)});
  return steps;
}
function predictWalk(q){
  const a=q.c,b=q.after,s=true;
  const A={...a,tree:clone(a.tree)},B={...b,tree:clone(b.tree)};solve(A);solve(B);
  const rt=x=>x.Rt?fmtR(x.Rt.add(ZERO),s):L('open','斷路');
  return[
    {c:A,hl:[],values:true,text:L(`Before the change: total resistance ${rt(A)}, and current from the cell ${fmtI(A.It,s)}.`,`改變前：總電阻 ${rt(A)}，電池輸出的電流 ${fmtI(A.It,s)}。`)},
    {c:B,hl:allNodes(B.tree).filter(n=>n.t==='W').map(n=>n.id),values:true,text:q.act==='closed'?L(`S is closed. Total resistance is now ${rt(B)}, and current from the cell is ${fmtI(B.It,s)}.`,`S 閉合後，總電阻變為 ${rt(B)}，電池輸出的電流為 ${fmtI(B.It,s)}。`):L(`S is opened. Total resistance is now ${rt(B)}, and current from the cell is ${fmtI(B.It,s)}.`,`S 斷開後，總電阻變為 ${rt(B)}，電池輸出的電流為 ${fmtI(B.It,s)}。`)},
    {c:B,hl:[],values:true,text:q.items.map(i=>L(`${i.label}: ${wd(i.dir).toLowerCase()}`,`${i.label}：${wd(i.dir)}`)).join(L('. ','。'))+L('.','。')}
  ];
}
/* Conservation checks shown after answering */
function conservation(c){
  const s=c.sym,out=[];
  allNodes(c.tree).filter(n=>n.t==='P').forEach(p=>{
    const on=p.kids.filter(k=>k.I);
    out.push(L('Junction: ','接點：')+`${fmtI(p.I,s)} = ${on.map(k=>fmtI(k.I,s)).join(' + ')}`);
  });
  const top=c.tree.t==='S'?c.tree.kids.filter(k=>k.t!=='A'):[c.tree];
  const vs=top.map(k=>fmtV(k.V,s));
  if(c.r)vs.push(fmtV(c.It.mul(c.r),s)+' (r)');
  out.push(L('Loop: ','迴路：')+`${fmtV(c.emf,s)} = ${vs.join(' + ')}`);
  const ps=loads(c.tree).map(l=>l.P);
  if(c.r)ps.push(c.It.mul(c.It).mul(c.r));
  out.push(L('Power: cell ','功率：電池 ')+`${fmtP(c.emf.mul(c.It),s)} = ${ps.map(p=>fmtP(p,s)).join(' + ')}`);
  return out;
}
</script>

<script>
/* ============ Circuit drawing ============ */
const SVGW={leaf:78,meter:50,sw:60,stub:20,gap:10,row:14};
function layout(n,o){
  let w,up,dn;
  const vals=o.values;
  if(n.t==='L'){w=SVGW.leaf;up=30;dn=vals?68:26}
  else if(n.t==='A'){w=SVGW.meter;up=32;dn=vals?34:18}
  else if(n.t==='W'){w=SVGW.sw;up=30;dn=12}
  else if(n.t==='S'){
    n.kids.forEach(k=>layout(k,o));
    w=n.kids.reduce((s,k)=>s+k._l.w,0)+SVGW.gap*(n.kids.length-1);
    up=Math.max(...n.kids.map(k=>k._l.up));dn=Math.max(...n.kids.map(k=>k._l.dn));
  }else{
    n.kids.forEach(k=>layout(k,o));
    w=Math.max(...n.kids.map(k=>k._l.w))+SVGW.stub*2;
    const h=n.kids.reduce((s,k)=>s+k._l.up+k._l.dn,0)+SVGW.row*(n.kids.length-1);
    up=h/2;dn=h/2;
  }
  const base=up;
  if(n.vm)up+=vals?54:38;
  n._l={w,up,dn,base};
}
function line(C,x1,y1,x2,y2,I){
  C.wires.push(`<line class="w" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`);
  if(C.flow&&I&&!I.zero&&C.It&&!C.It.zero&&(x1!==x2||y1!==y2)){
    const d=Math.min(6,Math.max(.35,.9*C.It.v/I.v));
    C.flows.push(`<line class="flow" style="--d:${d.toFixed(2)}s" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`);
  }
}
function draw(n,x,y,W,C){
  const L=n._l,o=C.o,cx=x+W/2;
  if(C.hl.includes(n.id))C.bg.push(`<rect class="hlr" x="${x-3}" y="${y-L.base-2}" width="${W+6}" height="${L.base+L.dn+4}" rx="6"/>`);
  if(n.t==='L'){
    const hw=n.kind==='B'?14:23;
    line(C,x,y,cx-hw,y,n.I);line(C,cx+hw,y,x+W,y,n.I);
    if(n.kind==='B'){
      const a=(o.values&&C.pmax>0)?Math.min(1,.12+.88*n.P.v/C.pmax):0;
      C.sym.push(`<circle class="sym" cx="${cx}" cy="${y}" r="13"/>`);
      if(a>0&&n.P.v>0)C.sym.push(`<circle cx="${cx}" cy="${y}" r="12" fill="var(--lamp)" opacity="${a.toFixed(2)}"/>`);
      C.sym.push(`<path class="w" d="M${cx-9} ${y-9}L${cx+9} ${y+9}M${cx-9} ${y+9}L${cx+9} ${y-9}"/>`);
    }else C.sym.push(`<rect class="${n.kind==='E'?'eqbox':'sym'}" x="${cx-23}" y="${y-9}" width="46" height="18" rx="1"/>`);
    C.text.push(`<text class="t" x="${cx}" y="${y-(n.kind==='B'?18:14)}">${n.label}</text>`);
    let ty=y+(n.kind==='B'?26:23);
    if(!(C.c.identical&&n.kind==='B'))C.text.push(`<text class="tv" x="${cx}" y="${ty}">${fmtR(n.R,o.sym)}</text>`);
    if(o.values){
      [fmtV(n.V,o.sym),fmtI(n.I,o.sym),fmtP(n.P,o.sym)].forEach((s,i)=>C.text.push(`<text class="tr" x="${cx}" y="${y+(n.kind==='B'?26:23)+14*(i+((C.c.identical&&n.kind==='B')?0:1))}">${s}</text>`));
    }
  }else if(n.t==='A'){
    line(C,x,y,cx-14,y,n.I);line(C,cx+14,y,x+W,y,n.I);
    C.sym.push(`<circle class="sym" cx="${cx}" cy="${y}" r="14"/>`);
    C.text.push(`<text class="tm" x="${cx}" y="${y}">A</text>`);
    if(n.label!=='A')C.text.push(`<text class="t" x="${cx}" y="${y-19}">${n.label}</text>`);
    if(o.values)C.text.push(`<text class="tr" x="${cx}" y="${y+28}">${fmtI(n.I,o.sym)}</text>`);
  }else if(n.t==='W'){
    line(C,x,y,cx-16,y,n.I);line(C,cx+16,y,x+W,y,n.I);
    const end=n.closed?`${cx+16} ${y}`:`${cx+12} ${y-14}`;
    const sw=`<circle class="dot" cx="${cx-16}" cy="${y}" r="3"/><circle class="dot" cx="${cx+16}" cy="${y}" r="3"/><path class="w" d="M${cx-16} ${y}L${end}"/><text class="t" x="${cx}" y="${y-19}">${n.label}</text>`;
    C.sym.push(C.o.toggle?`<g class="swh" data-sw="${n.id}" role="button" aria-label="${LANG==='zh'?'切換開關':'Toggle switch'}"><rect x="${cx-26}" y="${y-30}" width="52" height="42"/>${sw}</g>`:sw);
  }else if(n.t==='S'){
    const extra=W-L.w,each=extra/n.kids.length;let px=x;
    n.kids.forEach((k,i)=>{
      const kw=k._l.w+each;draw(k,px,y,kw,C);px+=kw;
      if(i<n.kids.length-1){line(C,px,y,px+SVGW.gap,y,n.I);px+=SVGW.gap}
    });
  }else{
    const xl=x+SVGW.stub,xr=x+W-SVGW.stub;
    line(C,x,y,xl,y,n.I);line(C,xr,y,x+W,y,n.I);
    let py=y-L.base;
    const dots=[];
    n.kids.forEach(k=>{
      const ky=py+k._l.up;
      line(C,xl,y,xl,ky,k.I);line(C,xr,ky,xr,y,k.I);
      draw(k,xl,ky,xr-xl,C);
      dots.push(ky);py=ky+k._l.dn+SVGW.row;
    });
    C.sym.push(`<circle class="dot" cx="${xl}" cy="${y}" r="3"/><circle class="dot" cx="${xr}" cy="${y}" r="3"/>`);
    dots.forEach(d=>{if(Math.abs(d-y)>1){C.sym.push(`<circle class="dot" cx="${xl}" cy="${d}" r="3"/><circle class="dot" cx="${xr}" cy="${d}" r="3"/>`)}});
  }
  if(n.vm){
    const ty=y-L.base-(o.values?30:20),a=x+12,b=x+W-12;
    C.wires.push(`<path class="w" d="M${a} ${y}V${ty}H${cx-13}M${cx+13} ${ty}H${b}V${y}"/>`);
    C.sym.push(`<circle class="dot" cx="${a}" cy="${y}" r="3"/><circle class="dot" cx="${b}" cy="${y}" r="3"/><circle class="sym" cx="${cx}" cy="${ty}" r="13"/>`);
    C.text.push(`<text class="tm" x="${cx}" y="${ty}">V</text>`);
    if(o.values)C.text.push(`<text class="tr" x="${cx}" y="${ty-18}">${fmtV(n.V,o.sym)}</text>`);
  }
}
function circuitSVG(c,o={}){
  const sym=!!c.sym,opts={...o,sym};
  layout(c.tree,opts);
  const L=c.tree._l,pad=34;
  const W=Math.max(L.w,c.r?300:230);
  const y=L.up+10,yb=y+L.dn+34,x0=pad,x1=pad+W,cx=x0+W/2;
  const C={o:opts,c,wires:[],flows:[],sym:[],text:[],bg:[],hl:o.hl||[],flow:o.flow,It:c.It,pmax:Math.max(0,...loads(c.tree).map(l=>l.P.v))};
  draw(c.tree,x0,y,W,C);
  line(C,x0,yb,x0,y,c.It);line(C,x1,y,x1,yb,c.It);
  let bottom=yb+40;
  if(c.r){
    const cellX=cx-40,rX=cx+34,bl=cx-72,br=cx+74;
    line(C,x1,yb,br,yb,c.It);line(C,bl,yb,x0,yb,c.It);
    line(C,br,yb,rX+20,yb);line(C,rX-20,yb,cellX+5,yb);line(C,cellX-5,yb,bl,yb);
    C.sym.push(`<rect class="ibox" x="${bl}" y="${yb-24}" width="${br-bl}" height="48" rx="4"/>`);
    C.sym.push(`<path class="w" d="M${cellX-5} ${yb-17}V${yb+17}" style="stroke-width:2.6"/><path class="w" d="M${cellX+5} ${yb-9}V${yb+9}" style="stroke-width:3.4"/>`);
    C.sym.push(`<rect class="sym" x="${rX-20}" y="${yb-8}" width="40" height="16" rx="1"/>`);
    C.text.push(`<text class="tv" x="${rX}" y="${yb-12}">r${c.hideR&&!o.values?'':' = '+num(c.r.v)+' Ω'}</text>`);
    C.text.push(`<text class="tv" x="${cellX}" y="${yb+35}">${c.hideEmf&&!o.values?'ε':'ε = '+num(c.emf.v)+' V'}</text>`);
    bottom=yb+44;
    if(c.termV){
      const vy=yb+62;
      C.wires.push(`<path class="w" d="M${bl-10} ${yb}V${vy}H${cx-13}M${cx+13} ${vy}H${br+10}V${yb}"/>`);
      C.sym.push(`<circle class="dot" cx="${bl-10}" cy="${yb}" r="3"/><circle class="dot" cx="${br+10}" cy="${yb}" r="3"/><circle class="sym" cx="${cx}" cy="${vy}" r="13"/>`);
      C.text.push(`<text class="tm" x="${cx}" y="${vy}">V</text>`);
      if(o.values)C.text.push(`<text class="tr" x="${cx+50}" y="${vy-4}">${fmtV(c.Vt)}</text>`);
      bottom=vy+22;
    }
  }else{
    line(C,x1,yb,cx+5,yb,c.It);line(C,cx-5,yb,x0,yb,c.It);
    C.sym.push(`<path class="w" d="M${cx-5} ${yb-17}V${yb+17}" style="stroke-width:2.6"/><path class="w" d="M${cx+5} ${yb-9}V${yb+9}" style="stroke-width:3.4"/>`);
    if(!c.hideEmf)C.text.push(`<text class="tv" x="${cx}" y="${yb+33}">${sym?'V':num(c.emf.v)+' V'}</text>`);
  }
  const H=bottom+6,VW=W+pad*2;
  const desc=`${LANG==='zh'?'電路':'Circuit'}: ${expr(strip(c.tree)==='wire'||strip(c.tree)==='open'?{t:'L',label:'wire'}:strip(c.tree))}`;
  return `<svg viewBox="0 0 ${VW} ${H}" role="img" aria-label="${desc}" style="max-width:${Math.round(VW*1.9)}px">${C.bg.join('')}${C.wires.join('')}${C.flows.join('')}${C.sym.join('')}${C.text.join('')}</svg>`;
}

/* ============ App state ============ */
const $=id=>document.getElementById(id);
const levelsList=()=>[
  [0,L('Mix','混合'),L('All levels','所有程度')],[1,L('Level 1','程度 1'),L('Series or parallel','串聯或並聯')],[2,L('Level 2','程度 2'),L('Simple mixed','簡單混合電路')],[3,L('Level 3','程度 3'),L('Nested mixed','多層混合電路')],
  [4,L('Level 4','程度 4'),L('Ratios with R and V','以 R 和 V 求比例')],[5,L('Level 5','程度 5'),L('Circuit changes','電路改變')],[6,L('Level 6','程度 6'),L('Internal resistance','內阻')]];
const SET_SIZE=10;
const S={mode:'practice',level:2,fmt:'X',q:null,qArgs:null,hintN:0,done:false,revealed:false,first:true,values:false,flow:false,walk:null,walkI:0,walkTimer:null,
  score:{right:0,total:0},cs:null,results:{},sel:{},exp:null,timerEnd:0,timerId:null,fb:null,checked:false};
const randSeed=()=>Math.floor(Math.random()*2**31);

function loadQuestion(){
  stopWalk();
  S.qArgs=S.cs?[S.cs.level,S.cs.fmt,hashStr(S.cs.code+'#'+S.cs.i)]:[S.level,S.fmt,randSeed()];
  S.q=genQuestion(...S.qArgs);
  S.hintN=0;S.done=false;S.revealed=false;S.first=true;S.values=false;S.flow=false;S.walk=null;S.sel={};S.checked=false;S.fb=null;
  renderAll();
}
function renderLevels(){
  const lv=S.cs?S.cs.level:S.level;
  $('levels').innerHTML=levelsList().map(([n,a,b])=>`<button data-l="${n}" aria-pressed="${n===lv}" ${S.cs?'disabled':''}><span class="n">${a}</span><span class="d">${b}</span></button>`).join('');
  const f=$('fmt');f.value=S.cs?S.cs.fmt:S.fmt;
  f.disabled=!!S.cs||lv===5;
  $('fmtNote').textContent=S.cs?L(`Class set ${S.cs.code}`,`全班練習 ${S.cs.code}`):lv===5?L('Level 5 always asks you to predict the change.','程度 5 一律要求預測電路改變的影響。'):lv===4?L('Level 4 has no numbers, so tables are not used.','程度 4 沒有數值，所以不設表格題。'):lv===6?L('Level 6 uses typed answers and MC.','程度 6 使用輸入答案題和選擇題。'):'';
}
function renderStats(){
  const parts=[];
  if(S.cs){const r=Object.values(S.results);parts.push(L(`Question ${S.cs.i+1} of ${SET_SIZE}`,`第 ${S.cs.i+1} 題，共 ${SET_SIZE} 題`),L(`First-try correct ${r.filter(x=>x).length}`,`首次答對 ${r.filter(x=>x).length} 題`))}
  else parts.push(L(`First-try correct ${S.score.right} of ${S.score.total}`,`首次答對 ${S.score.right} / ${S.score.total}`));
  $('stats').innerHTML=parts.map(p=>`<span>${p}</span>`).join('')+(S.cs?`<button class="btn" id="bLeave" style="min-height:28px;padding:2px 10px">${L('Leave set','離開練習')}</button>`:'');
}
function currentView(){
  if(S.mode==='explore')return{c:S.exp,opts:{values:true,flow:true,toggle:true}};
  if(S.walk){const st=S.walk[S.walkI];return{c:st.c,opts:{values:st.values,flow:st.values,hl:st.hl}}}
  return{c:S.q.c,opts:{values:S.values,flow:S.values}};
}
function renderPaper(){
  const v=currentView();
  $('paper').classList.toggle('live',S.mode==='explore');
  $('paper').innerHTML=circuitSVG(v.c,v.opts);
}
function renderBoardBar(){
  if(S.mode==='explore'){$('boardBar').innerHTML='';return}
  $('boardBar').innerHTML=`
    <button class="btn" id="bWalk" aria-pressed="${!!S.walk}">${L('Step-by-step solution','逐步題解')}</button>
    <button class="btn" id="bValues" aria-pressed="${S.values}" ${S.done?'':`disabled title="${L('Available after answering','作答後可用')}"`}>${L('Show values and current','顯示數值及電流')}</button>
    <button class="btn" id="bToExp">${L('Explore this circuit','探索這個電路')}</button>`;
}
function renderWalk(){
  const w=$('walk');
  if(!S.walk||S.mode!=='practice'){w.hidden=true;w.innerHTML='';return}
  const st=S.walk[S.walkI];
  w.hidden=false;
  w.innerHTML=`<div class="prog">${L(`Step ${S.walkI+1} of ${S.walk.length}`,`第 ${S.walkI+1} 步，共 ${S.walk.length} 步`)}</div><p>${st.text}</p>
    <div class="bar"><button class="btn" id="wPrev" ${S.walkI?'':'disabled'}>${L('Back','上一步')}</button><button class="btn primary" id="wNext" ${S.walkI<S.walk.length-1?'':'disabled'}>${L('Next step','下一步')}</button><button class="btn" id="wPlay" aria-pressed="${!!S.walkTimer}">${S.walkTimer?L('Pause','暫停'):L('Play','播放')}</button></div>`;
}
function stopWalk(){if(S.walkTimer){clearInterval(S.walkTimer);S.walkTimer=null}}
const LETTERS='ABCD';
function renderAnswerBody(){
  const q=S.q,show=S.revealed,chk=L('Check','檢查');
  if(q.kind==='num')return `<form class="ans ansin" id="fAns"><input type="text" id="aNum" inputmode="decimal" autocomplete="off" aria-label="${L('Your answer','你的答案')}"><span class="unit">${q.unit}</span><button class="btn primary" type="submit">${chk}</button></form>`;
  if(q.kind==='ratio')return `<form class="ans ansin" id="fAns"><input type="text" id="aNum" autocomplete="off" placeholder="${q.n===3?'2 : 3 : 6':'2 : 3'}" aria-label="${L('Your ratio','你的比例')}"><button class="btn primary" type="submit">${chk}</button></form>`;
  if(q.kind==='mc')return `<div class="opts" id="opts">${q.options.map((o,i)=>`<button class="opt ${show&&o.ok?'ok':''}" data-i="${i}" ${S.done?'disabled':''}><b>${LETTERS[i]}</b><span>${o.text}</span></button>`).join('')}</div>`;
  if(q.kind==='table'){
    const cell=(r,k)=>`<td><input type="text" id="t_${r}_${k}" inputmode="decimal" autocomplete="off" aria-label="${q.rows[r].label} ${k}" ${show?`value="${num(q.rows[r][k].v)}" readonly class="ok"`:''}></td>`;
    return `<div class="tw"><table><thead><tr><th>${L('Component','元件')}</th><th>R / Ω</th><th>V / V</th><th>I / A</th><th>P / W</th></tr></thead><tbody>${q.rows.map((r,i)=>`<tr><td><b>${r.label}</b></td><td>${num(r.R.v)}</td>${cell(i,'V')}${cell(i,'I')}${cell(i,'P')}</tr>`).join('')}</tbody></table></div><div class="ansin"><button class="btn primary" id="bTable" ${S.done?'disabled':''}>${L('Check table','檢查表格')}</button></div>`;
  }
  if(q.kind==='predict')return `<div class="pred">${q.items.map((it,i)=>`<div class="pr"><span class="lb">${it.label}</span><div class="seg" role="group" aria-label="${it.label}">${['up','down','same'].map(d=>{
      const on=S.sel[i]===d,cls=show&&it.dir===d?'ok':(S.checked&&on&&it.dir!==d?'no':(S.checked&&on?'ok':''));
      return `<button data-i="${i}" data-d="${d}" aria-pressed="${on}" class="${cls}" ${S.done?'disabled':''}>${wd(d)}</button>`}).join('')}</div></div>`).join('')}</div><div class="ansin"><button class="btn primary" id="bPred" ${S.done?'disabled':''}>${chk}</button></div>`;
  return'';
}
function renderPanel(){
  if(S.mode==='explore')return renderExplorePanel();
  const q=S.q,proj=document.documentElement.classList.contains('proj');
  const lvlName=levelsList().find(l=>l[0]===q.level);
  $('qpanel').innerHTML=`
    <div class="qhead"><span class="chip">${lvlName[1]}</span><span class="chip">${q.skill}</span></div>
    <p class="stem">${q.stem}</p>
    <p class="cond">${q.cond}</p>
    <div id="ansBody">${renderAnswerBody()}</div>
    <div id="fb" aria-live="polite"></div>
    <ul class="hints" id="hints"></ul>
    <div id="checks"></div>
    <div class="bar">
      <button class="btn" id="bHint"></button>
      <button class="btn" id="bReveal">${proj?L('Reveal answer','顯示答案'):L('Show answer','顯示答案')}</button>
      ${S.cs?`<button class="btn" id="bPrev" ${S.cs.i?'':'disabled'}>${L('Previous','上一題')}</button>`:''}
      <button class="btn primary" id="bNext">${S.cs&&S.cs.i>=SET_SIZE-1?L('Finish set','完成練習'):L('Next question','下一題')}</button>
    </div>
    ${proj?`<div class="row" id="timerRow"><span class="note">${L('Timer','計時')}</span><button class="btn" data-t="60">${L('1 min','1 分鐘')}</button><button class="btn" data-t="120">${L('2 min','2 分鐘')}</button><button class="btn" data-t="180">${L('3 min','3 分鐘')}</button><span class="timer" id="timer"></span></div>`:''}`;
  renderHints();
  renderFb();
  if(S.done)showChecks();
}
/* Redraws the panel but keeps what the student has typed or already tried */
function renderPanelKeep(){
  const box=$('ansBody');
  const saved=box?[...box.querySelectorAll('input,button')].map(e=>({v:e.value,c:e.className,d:e.disabled})):null;
  renderPanel();
  const after=$('ansBody');
  if(saved&&after){
    const els=[...after.querySelectorAll('input,button')];
    if(els.length===saved.length)els.forEach((e,i)=>{if(e.tagName==='INPUT')e.value=saved[i].v;e.className=saved[i].c;e.disabled=saved[i].d});
  }
}
function renderHints(){
  const q=S.q,h=$('hints');if(!h)return;
  h.innerHTML=q.hints.slice(0,S.hintN).map(x=>`<li>${x}</li>`).join('');
  const b=$('bHint');if(b){b.disabled=S.hintN>=q.hints.length;b.textContent=S.hintN?L(`Hint ${Math.min(S.hintN+1,3)} of 3`,`提示 ${Math.min(S.hintN+1,3)} / 3`):L('Hint','提示')}
}
/* Feedback is stored as a function, so it can be rewritten when the language changes */
function setFb(type,fn){S.fb=fn?{type,fn}:null;renderFb()}
function renderFb(){const el=$('fb');if(el)el.innerHTML=S.fb?`<div class="fb ${S.fb.type}">${S.fb.fn()}</div>`:''}
function showChecks(){
  const c=S.q.kind==='predict'?S.q.after:S.q.c;
  $('checks').innerHTML=`<h3 style="margin-bottom:6px">${L('Check with conservation','用守恆定律檢查')}</h3><ul class="checks">${conservation(c).map(x=>`<li>${x}</li>`).join('')}</ul>`;
}
function record(right){
  if(!S.first)return;
  S.first=false;
  if(S.cs){if(!(S.cs.i in S.results))S.results[S.cs.i]=right}
  else{S.score.total++;if(right)S.score.right++}
  renderStats();
}
const okWord=()=>`<b>${L('Correct.','正確。')}</b>`;
function finish(right,fn){
  record(right);
  S.done=true;
  setFb(right?'good':'info',fn);
  showChecks();
  renderBoardBar();
}
/* msgFn reads the current language's text each time it is drawn */
function wrong(msgFn){
  record(false);
  setFb('bad',()=>`<b>${L('Not yet.','未正確。')}</b> ${(msgFn&&msgFn())||L('Try again, or take a hint.','請再試一次，或看看提示。')}`);
}
function checkNum(){
  const q=S.q,raw=$('aNum').value;
  if(q.kind==='num'){
    const x=parseNum(raw);
    if(x===null)return setFb('bad',()=>L('Enter a number, such as 1.5 or 3/4.','請輸入數字，例如 1.5 或 3/4。'));
    if(near(x,q.ans))return finish(true,()=>`${okWord()} ${L(`The answer is ${S.q.ansText}.`,`答案是 ${S.q.ansText}。`)}`);
    const i=q.mistakes.findIndex(m=>near(x,m.val));
    wrong(i<0?null:()=>S.q.mistakes[i].msg);
  }else{
    const parts=raw.replace(/：/g,':').split(':').map(parseNum),eg=q.n===3?'2 : 3 : 6':'2 : 3',n=q.n;
    if(parts.length!==q.n||parts.some(p=>p===null||p<=0))return setFb('bad',()=>L(`Enter ${n} numbers separated by colons, such as ${eg}.`,`請輸入 ${n} 個以冒號分隔的數字，例如 ${eg}。`));
    if(ratioEq(parts,q.ans))return finish(true,()=>`${okWord()} ${L(`The ratio is ${S.q.ansText}.`,`比例是 ${S.q.ansText}。`)}`);
    const i=q.mistakes.findIndex(m=>ratioEq(parts,m.val));
    wrong(i<0?null:()=>S.q.mistakes[i].msg);
  }
}
function checkTable(){
  const q=S.q;let bad=0,blank=0;
  q.rows.forEach((r,i)=>['V','I','P'].forEach(k=>{
    const el=$(`t_${i}_${k}`),x=parseNum(el.value);
    el.classList.remove('ok','no');
    if(x===null){blank++;return}
    if(near(x,r[k].v))el.classList.add('ok');else{el.classList.add('no');bad++}
  }));
  if(blank)return setFb('bad',()=>L(`Fill in the ${blank} empty box${blank===1?'':'es'} first.`,`請先填寫 ${blank} 個空格。`));
  if(!bad)return finish(true,()=>`${okWord()} ${L('Every value in the table is right.','表格中所有數值都正確。')}`);
  wrong(()=>L(`${bad} value${bad===1?' is':'s are'} not right yet. Red boxes need another look. Parts in series have the same I, and parallel branches have the same V.`,`有 ${bad} 個數值未正確，請再檢查紅色的方格。串聯部分的 I 相同，並聯支路的 V 相同。`));
}
function checkPred(){
  const q=S.q;
  if(q.items.some((_,i)=>!S.sel[i]))return setFb('bad',()=>L('Choose an answer for every row.','請為每一行選擇答案。'));
  S.checked=true;
  const wrongItems=q.items.filter((it,i)=>S.sel[i]!==it.dir);
  if(!wrongItems.length){
    S.done=true;$('ansBody').innerHTML=renderAnswerBody();S.done=false;
    return finish(true,()=>`${okWord()} ${S.q.items.map(i=>i.why).join(L('. ','。'))}${L('.','。')}`);
  }
  $('ansBody').innerHTML=renderAnswerBody();
  S.checked=false;
  const n=wrongItems.length,dir=wrongItems[0].dir;
  wrong(()=>L(`${n} row${n===1?' is':'s are'} not right. `,`有 ${n} 行未正確。`)+(dir==='same'?L('An ideal cell keeps its p.d. fixed, so a branch directly across it is unaffected.','理想電池的電勢差不變，所以直接接在其兩端的支路不受影響。'):dir==='up'?L('Work out the new total resistance. A smaller total means more current from the cell.','請計算新的總電阻。總電阻較小時，電池輸出的電流較大。'):L('Check the new p.d. across this component. It may lose its share or be short-circuited.','請檢查這個元件新的電勢差。它可能分得較少，或已被短路。')));
}
function reveal(){
  S.revealed=true;
  record(false);
  S.done=true;
  $('ansBody').innerHTML=renderAnswerBody();
  setFb('info',()=>`<b>${L('Answer.','答案：')}</b> ${S.q.kind==='predict'?S.q.items.map(i=>i.why).join(L('. ','。'))+L('.','。'):S.q.ansText}`);
  showChecks();
  renderBoardBar();
}

/* ============ Language ============ */
function applyStatic(){
  document.documentElement.lang=LANG==='zh'?'zh-Hant-HK':'en';
  document.title=L('Circuit Analysis Lab','電路分析練習室');
  $('lEn').setAttribute('aria-pressed',String(LANG==='en'));
  $('lZh').setAttribute('aria-pressed',String(LANG==='zh'));
  const set=(sel,e,z)=>{const el=document.querySelector(sel);if(el)el.textContent=L(e,z)};
  set('.eyebrow a','HKDSE Physics · Simulation Lab','HKDSE 物理 · 模擬實驗室');
  set('h1','Circuit Analysis Lab','電路分析練習室');
  set('#mPractice','Practice','練習');set('#mExplore','Explore','探索');
  set('#bClass','Class set','全班練習');set('#bProj','Projector','投影模式');
  set('#hCreate','Teacher: create a set','教師：建立練習');
  set('#pCreate','Ten questions from the level and format selected below. Everyone who enters this code gets the same questions in the same order.','按下方所選的程度和題型出十題。輸入這個代碼的人都會得到相同的題目和次序。');
  set('#bCreate','Create code','建立代碼');
  set('#hJoin','Student: join a set','學生：加入練習');
  set('#lCode','Enter the code on the board.','輸入老師提供的代碼。');
  set('#fJoin button','Join','加入');
  set('#lFmt','Format','題型');
  [['X','Mixed','混合'],['V','Find the value','求數值'],['R','Find the ratio','求比例'],['T','Complete the table','完成表格'],['M','DSE-style MC','DSE 選擇題']].forEach(([v,e,z])=>set(`#fmt option[value="${v}"]`,e,z));
  $('codeIn').setAttribute('aria-label',L('Class code','班級代碼'));
  $('levels').setAttribute('aria-label',L('Level','程度'));
  if(!$('codeErr').hidden)$('codeErr').textContent=codeErrText();
}
const codeErrText=()=>L('That code does not look right. It has this form: 2X-K7QF.','代碼格式不正確。正確格式如：2X-K7QF。');
function setLang(z){
  if(z===LANG)return;
  LANG=z;
  try{localStorage.setItem('circuit-lang',z)}catch(e){}
  S.q=genQuestion(...S.qArgs);
  if(S.walk)S.walk=walkthrough(S.q);
  applyStatic();
  renderLevels();renderStats();renderPaper();renderBoardBar();renderWalk();renderPanelKeep();
}

/* ============ Explore mode: change values and watch the circuit respond ============ */
function toExplore(){
  if(!S.done)record(false);
  const src=S.q.c;
  const c={tree:clone(src.tree),emf:src.sym?F(12):src.emf,r:src.r,level:src.level,identical:false,termV:src.termV};
  if(src.sym)loads(c.tree).forEach(l=>{l.R=src.identical?F(6):l.R.mul(F(2))});
  c.emf=F(Math.round(c.emf.v*2)/2);
  S.exp=solve(c);S.mode='explore';stopWalk();S.walk=null;renderAll();
}
function renderExplorePanel(){
  const c=S.exp,ls=loads(c.tree),sw=allNodes(c.tree).filter(n=>n.t==='W');
  const emfHtml=`<div class="sl"><b>${L('e.m.f.','電動勢')}</b><input type="range" id="xE" min="1" max="36" step="0.5" value="${c.emf.v}" aria-label="${L('e.m.f.','電動勢')}"><output id="oE">${num(c.emf.v)} V</output></div>`;
  const rHtml=c.r?`<div class="sl"><b>r</b><input type="range" id="xr" min="0" max="5" step="0.5" value="${c.r.v}" aria-label="${L('Internal resistance','內阻')}"><output id="or">${num(c.r.v)} Ω</output></div>`:'';
  $('qpanel').innerHTML=`<h2>${L('Explore this circuit','探索這個電路')}</h2>
    <p class="cond">${sw.length?L('Move a slider or tap the switch, then watch how the rest of the circuit responds.','移動滑桿或按開關，觀察電路其他部分的變化。'):L('Move a slider, then watch how the rest of the circuit responds.','移動滑桿，觀察電路其他部分的變化。')}</p>
    ${emfHtml}${rHtml}
    ${ls.map((l,i)=>`<div class="sl"><b>${l.label}</b><input type="range" data-r="${i}" min="1" max="30" step="1" value="${Math.round(l.R.v)}" aria-label="${l.label}"><output id="o${i}">${Math.round(l.R.v)} Ω</output></div>`).join('')}
    ${sw.length?`<div class="row">${sw.map(s=>`<button class="btn" data-sw="${s.id}" aria-pressed="${s.closed}">${L(`Switch ${s.label}: ${s.closed?'closed':'open'}`,`開關 ${s.label}：${s.closed?'閉合':'斷開'}`)}</button>`).join('')}</div>`:''}
    <div id="xOut"></div>
    <div class="bar"><button class="btn primary" id="bBack">${L('Back to practice','返回練習')}</button></div>`;
  ls.forEach(l=>{l.R=F(Math.round(l.R.v))});
  updateExplore();
}
function updateExplore(){
  const c=S.exp;solve(c);renderPaper();
  const out=$('xOut');if(!out)return;
  if(c.short){out.innerHTML=`<div class="fb bad">${L('The closed switch short-circuits the cell. With no resistance left, an ideal cell has no sensible current. Open the switch.','閉合的開關把電池短路了。電路沒有電阻時，理想電池的電流沒有合理數值。請斷開開關。')}</div>`;return}
  const rt=c.Rt?num(c.Rt.v)+' Ω':L('open circuit','斷路');
  out.innerHTML=`<div class="tw"><table><thead><tr><th></th><th>V / V</th><th>I / A</th><th>P / W</th></tr></thead><tbody>
    ${loads(c.tree).map(l=>`<tr><td><b>${l.label}</b></td><td>${num(l.V.v)}</td><td>${num(l.I.v)}</td><td>${num(l.P.v)}</td></tr>`).join('')}
    ${c.r?`<tr><td><b>r</b></td><td>${num(c.It.mul(c.r).v)}</td><td>${num(c.It.v)}</td><td>${num(c.It.mul(c.It).mul(c.r).v)}</td></tr>`:''}
    <tr><td><b>${L('Cell','電池')}</b></td><td>${num(c.emf.v)}</td><td>${num(c.It.v)}</td><td>${num(c.emf.mul(c.It).v)}</td></tr></tbody></table></div>
    <p class="cond" style="margin-top:8px">${L('External resistance: ','外電阻：')}${rt}</p>`;
}

function renderAll(){
  document.querySelectorAll('#mPractice,#mExplore').forEach(b=>b.setAttribute('aria-pressed',String((b.id==='mPractice')===(S.mode==='practice'))));
  renderLevels();renderStats();renderPaper();renderBoardBar();renderWalk();renderPanel();
}

/* ============ Events ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-sw]');if(!t)return;
  const id=t.id;
  if(t.dataset.l!==undefined&&t.closest('#levels')){S.level=+t.dataset.l;S.mode='practice';return loadQuestion()}
  if(t.dataset.sw&&S.mode==='explore'){
    const n=findId(S.exp.tree,+t.dataset.sw);n.closed=!n.closed;renderExplorePanel();return;
  }
  if(t.dataset.t&&t.closest('#timerRow'))return startTimer(+t.dataset.t);
  if(t.closest('#opts')){
    const i=+t.dataset.i,o=S.q.options[i];
    if(S.done)return;
    if(o.ok){t.classList.add('ok');[...$('opts').children].forEach(b=>b.disabled=true);finish(true,()=>`${okWord()} ${L(`The answer is ${S.q.options[i].text}.`,`答案是 ${S.q.options[i].text}。`)}`)}
    else{t.classList.add('no');t.disabled=true;wrong(o.msg?()=>S.q.options[i].msg:null)}
    return;
  }
  if(t.closest('.pred')&&t.dataset.d&&!S.done){S.sel[t.dataset.i]=t.dataset.d;t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));return}
  const act={
    lEn(){setLang('en')},
    lZh(){setLang('zh')},
    mPractice(){if(S.mode!=='practice'){S.mode='practice';renderAll()}},
    mExplore(){if(S.mode!=='explore')toExplore()},
    bClass(){const d=$('drawer');d.hidden=!d.hidden;t.setAttribute('aria-pressed',String(!d.hidden))},
    bProj(){
      const on=document.documentElement.classList.toggle('proj');t.setAttribute('aria-pressed',String(on));
      try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(err){}
      if(S.mode==='practice')renderPanelKeep();
    },
    bCreate(){
      const ch='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=ch[Math.floor(Math.random()*ch.length)];
      const lv=S.level,f=lv===5?'X':S.fmt,code=`${lv}${f}-${s}`;
      $('newCode').textContent=code;joinSet(code);
    },
    bHint(){S.hintN++;renderHints()},
    bLeave(){S.cs=null;S.results={};$('newCode').textContent='';loadQuestion()},
    bReveal(){reveal()},
    bNext(){
      if(S.cs&&S.cs.i>=SET_SIZE-1){
        const r=Object.values(S.results).filter(x=>x).length,code=S.cs.code;
        S.cs=null;S.results={};loadQuestion();
        setFb('info',()=>L(`<b>Set ${code} finished.</b> You got ${r} of ${SET_SIZE} right on the first try.`,`<b>已完成練習 ${code}。</b>你首次答對 ${r} / ${SET_SIZE} 題。`));return;
      }
      if(S.cs)S.cs.i++;loadQuestion();
    },
    bPrev(){if(S.cs&&S.cs.i>0){S.cs.i--;loadQuestion()}},
    bTable(){checkTable()},
    bPred(){checkPred()},
    bWalk(){
      if(S.walk){stopWalk();S.walk=null}else{
        if(!S.done)record(false);
        S.walk=walkthrough(S.q);S.walkI=0;
      }
      renderPaper();renderBoardBar();renderWalk();
    },
    bValues(){S.values=!S.values;renderPaper();renderBoardBar()},
    bToExp(){toExplore()},
    bBack(){S.mode='practice';renderAll()},
    wPrev(){if(S.walkI>0){S.walkI--;stopWalk();renderPaper();renderWalk()}},
    wNext(){if(S.walkI<S.walk.length-1){S.walkI++;stopWalk();renderPaper();renderWalk()}},
    wPlay(){
      if(S.walkTimer)stopWalk();
      else{
        if(S.walkI>=S.walk.length-1)S.walkI=0;
        S.walkTimer=setInterval(()=>{if(S.walkI<S.walk.length-1){S.walkI++;renderPaper();renderWalk()}if(S.walkI>=S.walk.length-1){stopWalk();renderWalk()}},3500);
      }
      renderPaper();renderWalk();
    }
  }[id];
  if(act)act();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='fAns')checkNum();
  if(e.target.id==='fJoin')joinFromInput();
});
document.addEventListener('input',e=>{
  if(S.mode!=='explore')return;
  const t=e.target,c=S.exp;
  if(t.id==='xE'){c.emf=F(+t.value);$('oE').textContent=num(+t.value)+' V'}
  else if(t.id==='xr'){c.r=F(+t.value);$('or').textContent=num(+t.value)+' Ω'}
  else if(t.dataset.r!==undefined){const l=loads(c.tree)[+t.dataset.r];l.R=F(+t.value);$('o'+t.dataset.r).textContent=t.value+' Ω'}
  else return;
  updateExplore();
});
$('fmt').addEventListener('change',e=>{S.fmt=e.target.value;loadQuestion()});
function joinSet(code){
  S.cs={code,level:+code[0],fmt:code[1],i:0};S.results={};S.mode='practice';$('codeErr').hidden=true;loadQuestion();
}
function joinFromInput(){
  const code=$('codeIn').value.trim().toUpperCase().replace(/\s/g,'');
  if(!/^[0-6][XVRTM]-[A-Z0-9]{4}$/.test(code)){const er=$('codeErr');er.textContent=codeErrText();er.hidden=false;return}
  joinSet(code);$('drawer').hidden=true;$('bClass').setAttribute('aria-pressed','false');
}
function startTimer(sec){
  clearInterval(S.timerId);S.timerEnd=Date.now()+sec*1000;
  const tick=()=>{
    const el=$('timer');if(!el){clearInterval(S.timerId);return}
    const left=Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000));
    el.textContent=left?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:L("Time's up",'時間到');
    el.classList.toggle('up',!left);
    if(!left)clearInterval(S.timerId);
  };
  tick();S.timerId=setInterval(tick,250);
}
$('gloss').innerHTML=[['series','串聯'],['parallel','並聯'],['current','電流'],['potential difference (p.d.)','電勢差'],['resistance','電阻'],['equivalent resistance','等效電阻'],['power','功率'],['ammeter','安培計'],['voltmeter','伏特計'],['bulb','燈泡'],['switch','開關'],['short circuit','短路'],['e.m.f.','電動勢'],['internal resistance','內阻'],['terminal p.d.','端電壓'],['junction','接點'],['brightness','亮度'],['ratio','比例']].map(([a,b])=>`<span>${a} · ${b}</span>`).join('');
/* Open in Chinese with ?lang=zh, otherwise use the viewer's last choice */
try{
  const qp=new URLSearchParams(location.search).get('lang');
  const saved=localStorage.getItem('circuit-lang');
  if(qp==='zh'||qp==='en')LANG=qp;else if(saved==='zh'||saved==='en')LANG=saved;
}catch(e){}
applyStatic();
loadQuestion();
</script>
